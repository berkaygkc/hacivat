# Dynamic ID families (I18N-01): messages addressed by an ID built at runtime. They still get
# typed constants in `hacivat_l10n::ids`; the l10n check does not report them as unused.
#
# hui-*     widget texts resolved by ID through `UiTextProvider` (R4)
# hv-cmd-*  command titles, `hv-cmd-<action id with . and _ as ->` (R5)
# error-conn-*  connect-error headings and bodies, `ErrClass::fluent_stem()` plus `-title` or
#           `-body` (M2a, HV-CONN-03)
families = ["hui-*", "hv-cmd-*", "error-conn-*"]
