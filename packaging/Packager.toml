# cargo-packager config for Hacivat. Run via packaging/package-macos.sh (or the Linux/Windows
# scripts), which render the @PLACEHOLDERS@ into an ignored copy: nothing secret lives here.
# Lines carrying the signing placeholder are deleted by every script that does not sign, so the
# Windows and Linux configs, and the unsigned macOS nightly, never see it (L13).
name = "hacivat"
productName = "Hacivat"
identifier = "dev.hacivat.Hacivat"
version = "@VERSION@"
description = "Hacivat, a native SQL client"
publisher = "Hacivat"
copyright = "Hacivat"
category = "DeveloperTool"
# M3a Task 1a (R-M3-1, P23): the third-party notices ship in every bundle (the .app's
# Contents/Resources, next to the NSIS executable, the AppImage and deb resources). cargo-packager
# resolves `src` from the directory of the config it is given, the rendered
# `packaging/.Packager.generated.toml`, so the path climbs to the repository root.
resources = [
    { src = "../THIRD_PARTY_NOTICES.md", target = "THIRD_PARTY_NOTICES.md" },
]

[[binaries]]
path = "hacivat"
main = true

# macOS: Developer ID signing with the hardened runtime applies only to a local RELEASE=1 build
# on the PO's Mac (cargo-packager passes `--options runtime` and `--timestamp`).
[macos]
minimumSystemVersion = "13.0"
signingIdentity = "@SIGNING_IDENTITY@"

# Windows: per-user NSIS installer (no admin prompt), unsigned.
[nsis]
installMode = "currentUser"
