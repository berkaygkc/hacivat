[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]

[licenses]
# Anything not listed here is denied, which covers GPL/AGPL/LGPL/SSPL.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "OFL-1.1",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

# `mysql_async`'s rustls TLS always pulls the Mozilla CA bundle crate, whose data licence is
# permissive (M2a Task 1, P1).
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]   # mysql_async rustls-tls; ruled PO-away 2026-11-12 (ledger)

[bans]
multiple-versions = "allow"
wildcards = "allow"
# Zed's GPL crates must never enter the dependency graph.
deny = [
    { crate = "editor", reason = "zed GPL crate" },
    { crate = "ui", reason = "zed GPL crate" },
    { crate = "workspace", reason = "zed GPL crate" },
    { crate = "rope", reason = "zed GPL crate" },
    { crate = "text", reason = "zed GPL crate" },
    # Two rustls providers make `ClientConfig::builder()` panic (M2a Task 1, P5). M2b: russh is
    # built without its `aws-lc-rs` default (`ring`, `rsa`, `flate2` only; Q28, ADR 0003). The
    # vendored `mysql_async` (third_party/, a `[patch]` path crate) needs no source entry.
    { crate = "aws-lc-rs", reason = "M2a uses the ring provider" },
    { crate = "aws-lc-sys", reason = "M2a uses the ring provider; OpenSSL licence" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
unused-allowed-source = "allow"
allow-git = [
    "https://github.com/zed-industries/zed",
    # The Hacivat zed fork (R1): zed @ 912159c plus the carried IME patch.
    "https://github.com/berkaygkc/zed",
    "https://github.com/zed-industries/font-kit",
    "https://github.com/zed-industries/async-process",
    "https://github.com/zed-industries/async-task",
    # Each of the following is declared by the pinned zed workspace itself:
    # zed Cargo.toml:1009 (wgpu, rev cddb2f5)
    "https://github.com/gfx-rs/wgpu",
    # zed Cargo.toml:831 (oo7)
    "https://github.com/zed-industries/oo7",
    # zed Cargo.toml:894 (scap)
    "https://github.com/zed-industries/scap",
    # zed Cargo.toml:988 (wasm_thread)
    "https://github.com/zed-industries/wasm_thread",
    # zed crates/gpui_linux/Cargo.toml:127 (xim-rs)
    "https://github.com/zed-industries/xim-rs",
]
