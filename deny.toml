[graph]
targets = [
    "aarch64-apple-darwin",
]

[licenses]
# Anything not listed here is denied, which covers GPL/AGPL/LGPL/SSPL.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "OFL-1.1",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"
wildcards = "allow"
# Zed's GPL crates must never enter the dependency graph.
deny = [
    { crate = "editor", reason = "zed GPL crate" },
    { crate = "ui", reason = "zed GPL crate" },
    { crate = "workspace", reason = "zed GPL crate" },
    { crate = "rope", reason = "zed GPL crate" },
    { crate = "text", reason = "zed GPL crate" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
unused-allowed-source = "allow"
allow-git = [
    "https://github.com/zed-industries/zed",
    "https://github.com/zed-industries/font-kit",
    "https://github.com/zed-industries/async-process",
    "https://github.com/zed-industries/async-task",
]
