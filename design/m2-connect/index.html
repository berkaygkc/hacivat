<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440, initial-scale=1">
<title>Hacivat Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Fragment+Mono:ital@0;1&display=block" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   M2a Connect — clickable mocks inside the approved harman world.
   Tokens, type, radii and components are harman's; additions are
   marked NEW and listed in NOTES.md.
   Scale:  radius 0 · 3 · 4 · 6   seam 1px   spacing 2/4/6/8/10/12/14/16
           type 11 · 11.5 · 12 · 12.5 · 13 · 13.5 · 15
   GPUI:   solid fills, 1px borders, popover shadow only, no transforms,
           no blur, no filters, no masks.
   ═══════════════════════════════════════════════════════════════ */
:root, :root[data-theme="dark"] {
  --ground:#16181D; --panel:#1E2127; --side:#1E2127; --head:#1E2127; --gutter:#1A1D22;
  --raised:#252931; --hover:#23272E; --seam:#2A2E36; --seam-2:#363B45; --seam-soft:#23262D;
  --text:#C9D1D9; --text-2:#8B949E; --text-3:#828A96; --text-3-base:#828A96;
  --on-accent:#10141C; --on-red:#10141C; --cp-fill:#CE2C31; --on-cp-fill:#FFFFFF;
  --blue:#7AA2F7; --blue-a:rgba(122,162,247,.12); --blue-a2:rgba(122,162,247,.22); --blue-hover:#8DB0F8;
  --red:#E06C75; --red-a:rgba(224,108,117,.13); --red-line:rgba(224,108,117,.55);
  --green:#98C379; --green-fill:rgba(152,195,121,.55);
  --amber:#E5C07B; --amber-a:rgba(229,192,123,.13);
  --syn-kw:#B4A7F2; --syn-str:#98C379; --syn-num:#E5C07B;
  --scrim:rgba(22,24,29,.6);                       /* ground @ SCRIM_ALPHA 0.6 (shell/layers.rs) */
  --shadow-pop:0 10px 28px rgba(0,0,0,.34), 0 1px 2px rgba(0,0,0,.30);
  --tl-close:#FF5F57; --tl-min:#FEBC2E; --tl-max:#28C840;
  color-scheme:dark;
}
:root[data-theme="light"] {
  --ground:#F7F7F8; --panel:#FFFFFF; --side:#F7F7F8; --head:#F7F7F8; --gutter:#FAFAFB;
  --raised:#FFFFFF; --hover:#F1F1F3; --seam:#E5E5E9; --seam-2:#D8D8DE; --seam-soft:#EFEFF2;
  --text:#1B1B1F; --text-2:#55555E; --text-3:#6C6C76; --text-3-base:#6C6C76;
  --on-accent:#FFFFFF; --on-red:#FFFFFF; --cp-fill:#CE2C31; --on-cp-fill:#FFFFFF;
  --blue:#3B5FD9; --blue-a:rgba(59,95,217,.08); --blue-a2:rgba(59,95,217,.15); --blue-hover:#3352C4;
  --red:#CE2C31; --red-a:rgba(206,44,49,.08); --red-line:rgba(206,44,49,.45);
  --green:#1F7A50; --green-fill:rgba(31,122,80,.42);
  --amber:#A35C00; --amber-a:rgba(163,92,0,.10);
  --syn-kw:#4B57C2; --syn-str:#2B7A30; --syn-num:#B4530A;
  --scrim:rgba(247,247,248,.6);
  --shadow-pop:0 12px 32px -6px rgba(20,20,40,.20), 0 0 0 1px rgba(20,20,40,.04), 0 1px 2px rgba(20,20,40,.08);
  color-scheme:light;
}

/* ───────── Base (harman) ───────── */
* { box-sizing:border-box; }
html, body { margin:0; height:100%; }
body { background:var(--ground); color:var(--text); font:400 13px/1.35 "Source Sans 3", system-ui, sans-serif;
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased; overflow:hidden; }
::selection { background:var(--blue-a2); color:inherit; }
button { font:inherit; color:inherit; }
input { font:inherit; color:inherit; caret-color:var(--blue); }
.mono { font-family:"Fragment Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums; }
.sc { font-variant-caps:all-small-caps; letter-spacing:.075em; font-weight:600; }
svg.ic { width:14px; height:14px; flex:none; display:block; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
svg.ic.i12 { width:12px; height:12px; }
:focus { outline:none; }
:focus-visible { outline:1px solid var(--blue); outline-offset:1px; }
kbd { font:400 11px/1 "Fragment Mono", monospace; color:var(--text-3); border:1px solid var(--seam); border-radius:3px;
  padding:2px 4px; display:inline-flex; align-items:center; height:16px; background:transparent; flex:none; }
.grow { flex:1; }
.vsep { width:1px; height:18px; background:var(--seam); flex:none; }

/* Environment marks. Shape-coded first, hue only for production.
   local ○ (existing) · dev ◉ (NEW) · test ● (NEW) · staging □ (existing) · production ■ (existing) */
.env { width:7px; height:7px; border-radius:0; flex:none; display:inline-block; position:relative; }
.env.production { background:var(--red); }
.env.staging { border:1px solid var(--text-2); }
.env.test { background:var(--text-2); border-radius:50%; }
.env.dev { border:1px solid var(--text-2); border-radius:50%; }
.env.dev::after { content:""; position:absolute; left:1px; top:1px; width:3px; height:3px; border-radius:50%; background:var(--text-2); }
.env.local { border:1px solid var(--text-3); border-radius:50%; }

/* ───────── Mock bar (mock only, not product) ───────── */
.mockbar { height:34px; display:flex; align-items:center; gap:8px; padding:0 10px; background:var(--gutter);
  border-bottom:1px dashed var(--seam-2); white-space:nowrap; color:var(--text-2); font-size:12px; overflow:hidden; }
.mockbar .tag { font:400 11px "Fragment Mono", monospace; color:var(--text-2); border:1px dashed var(--seam-2); border-radius:3px; padding:2px 6px; }
.mockbar .lbl { color:var(--text-3); font-size:11.5px; }
.mseg { display:flex; height:24px; border:1px solid var(--seam-2); border-radius:4px; overflow:hidden; flex:none; }
.mseg button { border:0; background:transparent; padding:0 8px; color:var(--text-2); cursor:pointer; display:flex; align-items:center; gap:5px; font-size:12px; }
.mseg button + button { border-left:1px solid var(--seam-2); }
.mseg button[aria-pressed="true"] { background:var(--raised); color:var(--text); }
:root[data-theme="light"] .mseg button[aria-pressed="true"] { background:var(--panel); }
.mseg button:hover { color:var(--text); }
.mseg button .n { font:400 11px "Fragment Mono", monospace; color:var(--text-3); }
.mseg.lang button { font:400 11.5px "Fragment Mono", monospace; }

/* ───────── Window ───────── */
.win { position:relative; width:100vw; height:calc(100vh - 34px); display:grid; grid-template-rows:40px 1fr 24px; background:var(--ground); min-height:620px; }
.titlebar { display:flex; align-items:center; padding:0 10px 0 14px; border-bottom:1px solid var(--seam); background:var(--ground);
  user-select:none; white-space:nowrap; min-width:0; position:relative; z-index:40; }
.lights { display:flex; gap:8px; margin-right:18px; }
.lights i { width:12px; height:12px; border-radius:50%; display:block; border:.5px solid rgba(0,0,0,.25); }
.lights i:nth-child(1){background:var(--tl-close);} .lights i:nth-child(2){background:var(--tl-min);} .lights i:nth-child(3){background:var(--tl-max);}
.brand { display:flex; align-items:center; gap:8px; color:var(--text); padding-right:14px; }
.brand .word { font-size:14.5px; letter-spacing:.09em; }
.mark { width:16px; height:16px; display:block; color:var(--text-2); }

/* Capsule (harman) + M2a states */
.capsule { display:flex; align-items:stretch; height:26px; margin-left:12px; padding:0; border:1px solid var(--seam-2); border-radius:4px;
  overflow:hidden; background:var(--panel); cursor:pointer; font-size:13px; flex:none; }
.capsule > span { display:flex; align-items:center; gap:6px; padding:0 9px; }
.capsule > span + span { border-left:1px solid var(--seam-2); }
.capsule:hover > span:not(.cp-env) { background:var(--hover); }
.cp-env { background:var(--cp-fill); color:var(--on-cp-fill); padding:0 10px 0 9px !important; font-size:13.5px; }
.cp-env .sc { letter-spacing:.09em; font-weight:700; }
.cp-tag { color:var(--text-2); }
.cp-name b { font-weight:600; color:var(--text); }
.cp-name .dim { color:var(--text-2); }
.cp-ro svg { color:var(--red); }
.cp-rw { color:var(--text-2); }
.cp-path svg.direct { color:var(--green); }
.cp-path svg.ssh { color:var(--text-2); }
.cp-path .mono { font-size:11.5px; color:var(--text-2); }
.cp-unenc { color:var(--text); }
.cp-unenc svg { color:var(--text-2); }
.cp-chev { color:var(--text-3); padding:0 6px !important; }
.cp-none { color:var(--text-2); }
.cp-run { color:var(--text); }
.cp-run .mono { font-size:11.5px; color:var(--text-2); min-width:44px; }
.run { width:7px; height:7px; background:var(--amber); display:block; flex:none; }          /* splash run marker */
.cp-fail { color:var(--text); }
.cp-fail svg { color:var(--text); }
.cp-retry { color:var(--text-2); }
.capsule:hover .cp-retry { color:var(--text); }

.palette { margin:0 4px 0 auto; flex:0 1 290px; min-width:170px; height:26px; display:flex; align-items:center; gap:8px; padding:0 6px 0 9px;
  border:1px solid var(--seam); border-radius:4px; color:var(--text-3); background:transparent; cursor:text; overflow:hidden; }
.palette:hover { border-color:var(--seam-2); }
.palette span { flex:1; text-align:left; overflow:hidden; text-overflow:ellipsis; }

/* Tiles */
.tiles { position:relative; display:grid; grid-template-columns:276px 1fr; gap:1px; background:var(--seam); min-height:0; }
.col { display:grid; gap:1px; min-height:0; background:var(--seam); }
.col.left { grid-template-rows:1fr 205px; }
.panel { background:var(--panel); min-height:0; min-width:0; display:flex; flex-direction:column; position:relative; overflow:hidden; }
.panel.side { background:var(--side); }
.ph { height:30px; flex:none; display:flex; align-items:center; gap:10px; padding:0 10px 0 12px; border-bottom:1px solid var(--seam); white-space:nowrap; background:var(--head); }
.ph .t { color:var(--text-2); font-size:13.5px; }
.ph .meta { color:var(--text-3); font-size:12px; }
.ph .id { color:var(--text); font-size:12.5px; }
.ph .ibtn { margin-right:-4px; }

/* Explorer */
.xfilter { display:flex; align-items:center; gap:7px; height:28px; margin:8px 8px 4px; padding:0 6px 0 8px; border:1px solid var(--seam); border-radius:4px; color:var(--text-3); background:var(--panel); }
:root[data-theme="dark"] .xfilter { background:transparent; }
.xfilter input { flex:1; min-width:0; border:0; background:transparent; outline:none; font-size:12.5px; }
.xfilter input::placeholder { color:var(--text-3); }
.tree { padding:2px 0 8px; overflow:auto; flex:1; outline:none; }
.grp { height:26px; display:flex; align-items:center; gap:7px; padding:6px 10px 0 12px; color:var(--text-3); font-size:13px; }
.grp .rule { flex:1; height:1px; background:var(--seam-soft); }
:root[data-theme="light"] .grp .rule { background:var(--seam); }
.grp .n { font-size:11px; color:var(--text-3); }
.row { height:23px; display:flex; align-items:center; gap:6px; padding:0 10px 0 12px; cursor:default; white-space:nowrap; color:var(--text); position:relative; }
.row:hover { background:var(--hover); }
.row.sel { background:var(--blue-a); }
.row.sel::before { content:""; position:absolute; left:0; top:0; bottom:0; width:1px; background:var(--blue); }
.tree:focus-visible .row.sel { outline:1px solid var(--blue); outline-offset:-1px; }
.row .ic { color:var(--text-2); }
.row.sel > .ic { color:var(--blue); }
.row .lbl { overflow:hidden; text-overflow:ellipsis; }
.row .lbl.on { font-weight:600; }
.row .flags { display:flex; align-items:center; gap:5px; color:var(--text-2); }
.row .flags .ro { color:var(--red); }
.row .meta { color:var(--text-3); font-size:11px; display:flex; align-items:center; gap:4px; }
.row .meta .ok { color:var(--green); }
.row .run { width:7px; height:7px; }
.xempty { flex:1; display:flex; flex-direction:column; align-items:flex-start; padding:18px 14px 0 14px; gap:8px; }
.xempty .h { font-weight:600; color:var(--text); font-size:13px; display:flex; align-items:center; gap:8px; }
.xempty .h svg { color:var(--text-2); }
.xempty p { margin:0 0 4px; color:var(--text-2); font-size:12.5px; line-height:1.4; }
.xempty .acts { display:flex; flex-direction:column; align-items:stretch; gap:6px; width:100%; }
.xempty .acts .btn { justify-content:flex-start; }
.xempty .acts .btn .k { margin-left:auto; }

/* Connection sheet */
.sheet { padding:6px 0 0; margin:0; }
.kv { display:grid; grid-template-columns:92px 1fr; align-items:center; height:22px; padding:0 12px; column-gap:10px; font-size:12.5px; white-space:nowrap; }
.kv dt { color:var(--text-3); margin:0; overflow:hidden; text-overflow:ellipsis; }
.kv dd { margin:0; display:flex; align-items:center; gap:6px; min-width:0; overflow:hidden; }
.kv dd .mono { font-size:11.5px; overflow:hidden; text-overflow:ellipsis; }
.kv .r { color:var(--red); font-weight:600; }
.kv .d { color:var(--text-2); }
.kv .g { color:var(--green); }

/* Center: empty workspace */
.home { flex:1; display:flex; align-items:center; justify-content:center; }
.home .box { width:420px; display:flex; flex-direction:column; gap:14px; }
.home .h { color:var(--text-2); font-size:13.5px; }
.home .keys { display:grid; grid-template-columns:1fr auto; row-gap:9px; column-gap:24px; font-size:13px; }
.home .keys span { color:var(--text-2); }
.home .keys .k { display:flex; gap:3px; justify-content:flex-end; }
.home .hint { color:var(--text-3); font-size:12px; }

/* Buttons (harman) */
.btn { height:24px; display:inline-flex; align-items:center; gap:6px; padding:0 9px; border:1px solid var(--seam-2); border-radius:4px; background:transparent;
  color:var(--text); font-size:12.5px; font-weight:500; cursor:pointer; white-space:nowrap; flex:none; }
.btn:hover { background:var(--hover); }
.btn .k { font:400 11px "Fragment Mono", monospace; color:var(--text-3); }
.btn.primary { background:var(--blue); border-color:var(--blue); color:var(--on-accent); font-weight:600; }
.btn.primary .k { color:var(--on-accent); opacity:.7; }
.btn.primary:hover { background:var(--blue-hover); border-color:var(--blue-hover); }
.btn.ghost { border-color:transparent; color:var(--text-2); }
.btn.ghost:hover { color:var(--text); }
.btn.icon { padding:0 6px; }
.btn[disabled], .btn[disabled]:hover { cursor:not-allowed; color:var(--text-3); border-color:var(--seam-2); background:transparent; }
.btn.ghost[disabled], .btn.ghost[disabled]:hover { border-color:transparent; }
.btn.danger { color:var(--red); border-color:var(--red-line); background:transparent; }
.btn.danger:hover, .btn.danger:focus-visible { background:var(--red); border-color:var(--red); color:var(--on-red); outline:none; }
.void { display:flex; align-items:center; gap:8px; margin-right:28px; padding-right:12px; border-right:1px solid var(--seam); height:20px; flex:none; }

/* Status bar (harman) */
.status { display:flex; align-items:stretch; border-top:1px solid var(--seam); background:var(--ground); font-size:12px; color:var(--text-2); white-space:nowrap; position:relative; z-index:1; }
.status .s { display:flex; align-items:center; gap:6px; padding:0 10px; border-right:1px solid var(--seam); }
.status .s.r { border-right:0; border-left:1px solid var(--seam); }
.status .envseg { background:var(--red-a); color:var(--red); font-weight:600; padding-left:12px; }
.status .envseg.np { background:transparent; color:var(--text); font-weight:400; }
.status .g svg { color:var(--green); }
.status .mono { font-size:11px; }
.status button.s { background:transparent; border-top:0; border-bottom:0; border-right:0; cursor:pointer; color:var(--text-2); }
.status button.s:hover { color:var(--text); background:var(--hover); }
.status .lang b { color:var(--text); font-weight:600; }
.status .run { width:7px; height:7px; }

/* ───────── Layers: scrim + dialogs ─────────
   The scrim starts below the title bar: the capsule is never dimmed (decision M2a-1). */
.layer { position:absolute; left:0; right:0; top:40px; bottom:0; background:var(--scrim); display:flex; align-items:center; justify-content:center; z-index:30; }
.dlg { position:relative; background:var(--raised); border:1px solid var(--seam-2); border-radius:6px; box-shadow:var(--shadow-pop);
  display:flex; flex-direction:column; max-height:calc(100% - 32px); --text-3:var(--text-2); }    /* Raised Ink Rule */
.dlg.w420 { width:420px; } .dlg.w480 { width:480px; } .dlg.w640 { width:640px; }
.dlg .dhead { display:flex; align-items:flex-start; gap:12px; padding:16px 16px 0; }
.dlg .dhead .tt { flex:1; min-width:0; }
.dlg .dhead .title { font-weight:600; font-size:13px; color:var(--text); }
.dlg .dhead .sub { color:var(--text-2); font-size:12.5px; margin-top:2px; display:flex; gap:6px; align-items:center; }
.dlg .x { border:0; background:transparent; padding:4px; border-radius:4px; color:var(--text-3); cursor:pointer; margin:-3px -4px 0 0; }
.dlg .x:hover { background:var(--hover); color:var(--text); }
.dlg .dbody { padding:12px 16px 0; color:var(--text-2); font-size:13px; }
.dlg .dbody p { margin:0 0 10px; line-height:1.4; }
.dlg .dbody p.strong { color:var(--text); }
.dlg .dfoot { display:flex; align-items:center; gap:8px; padding:12px 16px 16px; }
.dlg .dfoot .grow { flex:1; }
.dlg.form .dhead { padding:12px 14px 12px 16px; border-bottom:1px solid var(--seam); align-items:center; }
.dlg.form .dscroll { overflow:auto; padding:12px 16px 14px; min-height:0; }
.dlg.form .dfoot { border-top:1px solid var(--seam); padding:12px 16px; }

/* Form rows */
.frow { display:grid; grid-template-columns:140px 1fr; align-items:center; column-gap:12px; min-height:26px; }
.frow + .frow, .frow + .notice, .notice + .frow, .frow + .hintrow, .hintrow + .frow { margin-top:8px; }
.flab { color:var(--text-2); font-size:13px; line-height:1.25; }
.fcell { display:flex; align-items:center; gap:8px; min-width:0; }
.hintrow { display:grid; grid-template-columns:140px 1fr; column-gap:12px; margin-top:4px; }
.hintrow .h { grid-column:2; color:var(--text-2); font-size:12px; display:flex; gap:6px; align-items:center; line-height:1.35; }
.hintrow .h svg { flex:none; }
.inl { color:var(--text-2); font-size:13px; flex:none; }
.secth { display:flex; align-items:center; gap:7px; height:22px; margin:14px 0 8px; color:var(--text-2); font-size:13px; }
.secth .rule { flex:1; height:1px; background:var(--seam); }

/* TextInput (existing): 26px, seam-strong, radius 4, padding 0 6 0 9; field well = panel (dark) / ground (light) like the harman query box */
.in { height:26px; display:flex; align-items:center; gap:6px; padding:0 6px 0 9px; border:1px solid var(--seam-2); border-radius:4px; background:var(--panel);
  min-width:0; flex:1; --text-3:var(--text-3-base); transition:background-color 240ms cubic-bezier(.16,1,.3,1); }
:root[data-theme="light"] .in { background:var(--ground); }
.in input { flex:1; min-width:0; border:0; background:transparent; outline:0; font-size:13px; color:var(--text); padding:0; height:24px; }
.in input::placeholder { color:var(--text-3); }
.in.mono input::placeholder { font-family:"Source Sans 3", system-ui, sans-serif; font-size:13px; }
.in.mono input { font:400 12px "Fragment Mono", monospace; }
.in:focus-within { outline:1px solid var(--blue); outline-offset:1px; }
.in.filled { background:var(--blue-a2); }
.in .tail { color:var(--text-3); font-size:12px; flex:none; display:flex; gap:4px; align-items:center; }
.in .tail .btn { height:20px; padding:0 5px; margin-right:-3px; }
.in.port { flex:0 0 76px; }
.in.short { flex:0 0 96px; }
.in.err { border-color:var(--text-2); }

/* Segmented (existing). Inside a raised dialog it sits in a field well; pressed = raised (dark) / panel (light). */
.seg { display:flex; height:26px; border:1px solid var(--seam-2); border-radius:4px; overflow:hidden; flex:none; background:var(--panel); }
:root[data-theme="light"] .seg { background:var(--ground); }
.seg button { border:0; background:transparent; padding:0 9px; color:var(--text-2); cursor:pointer; display:flex; align-items:center; gap:6px; font-size:13px; }
.seg button + button { border-left:1px solid var(--seam-2); }
.seg button[aria-pressed="true"] { background:var(--raised); color:var(--text); font-weight:600; }
:root[data-theme="light"] .seg button[aria-pressed="true"] { background:var(--panel); }
.seg button:hover { color:var(--text); }
.seg button:focus-visible { outline:1px solid var(--blue); outline-offset:-2px; }
.seg.unset button[aria-pressed="false"] { color:var(--text-2); }

/* NEW · Checkbox: 14px, radius 3, 1px seam-strong; checked = blue fill + on-accent check */
.cb { display:inline-flex; align-items:center; gap:8px; cursor:pointer; color:var(--text); font-size:13px; border:0; background:transparent; padding:0; text-align:left; }
.cb .box { width:14px; height:14px; border:1px solid var(--seam-2); border-radius:3px; background:var(--panel); display:flex; align-items:center; justify-content:center; flex:none; color:var(--on-accent); }
:root[data-theme="light"] .cb .box { background:var(--ground); }
:root .cb[aria-checked="true"] .box, :root[data-theme="light"] .cb[aria-checked="true"] .box { background:var(--blue); border-color:var(--blue); }
.cb .box svg { width:12px; height:12px; stroke-width:2.2; visibility:hidden; }
.cb[aria-checked="true"] .box svg { visibility:visible; }
.cb .sub { color:var(--text-2); }

/* NEW · Select: field-shaped button that opens a PopupMenu */
.select { height:26px; display:inline-flex; align-items:center; gap:8px; padding:0 6px 0 9px; border:1px solid var(--seam-2); border-radius:4px; background:var(--panel);
  color:var(--text); cursor:pointer; font-size:13px; min-width:0; text-align:left; }
:root[data-theme="light"] .select { background:var(--ground); }
.select .v { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.select svg { color:var(--text-2); }
.select:hover { border-color:var(--text-3-base); }

/* NEW · Disclosure: 30px row, chevron swaps right/down (no rotation), small-caps title, summary at text-2 */
.disc { width:100%; height:32px; display:flex; align-items:center; gap:8px; border:0; border-top:1px solid var(--seam); background:transparent; padding:0 2px 0 0; cursor:pointer; text-align:left; margin-top:14px; }
.disc + .dbox + .disc, .disc + .disc { margin-top:0; }
.disc .chev { color:var(--text-2); width:14px; display:flex; justify-content:center; }
.disc .ttl { color:var(--text); font-size:13px; font-weight:600; }
.disc .sum { flex:1; text-align:right; color:var(--text-2); font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:flex; justify-content:flex-end; gap:6px; align-items:center; }
.disc:hover .ttl { color:var(--text); }
.disc:focus-visible { outline-offset:-1px; }
.dbox { padding:4px 0 12px 22px; }

/* NEW · Inline notice: bordered inset, icon carries meaning only when it is a result */
.notice { display:flex; gap:9px; align-items:flex-start; padding:8px 10px; border:1px solid var(--seam-2); border-radius:4px; background:var(--panel); color:var(--text); font-size:12.5px; line-height:1.4; }
:root[data-theme="light"] .notice { background:var(--ground); }
.notice > svg { margin-top:1px; color:var(--text-2); }
.notice .nb { flex:1; min-width:0; }
.notice .nb .l2 { color:var(--text-2); }
.notice .nb ul { margin:4px 0 0; padding:0; list-style:none; }
.notice .nb li { display:flex; gap:6px; align-items:baseline; color:var(--text-2); }
.notice .nb li .mono { font-size:11.5px; color:var(--text); }
.notice .acts { display:flex; gap:6px; margin-top:8px; }
.notice.ok > svg { color:var(--green); }
.notice .mono { font-size:11.5px; }

/* Test result strip (above the dialog footer) */
.tres { border-top:1px solid var(--seam); padding:10px 16px 12px; background:var(--panel); }
:root[data-theme="light"] .tres { background:var(--ground); }
.tres { --text-3:var(--text-3-base); }
.tres .th { display:flex; align-items:center; gap:8px; color:var(--text); font-weight:600; }
.tres .th .ok { color:var(--green); }
.tres .sub2 { color:var(--text-2); font-size:12.5px; margin:2px 0 0 22px; }
.tres .th .mono { font-weight:400; font-size:11.5px; color:var(--text-2); }
.diag { display:grid; grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr); column-gap:12px; row-gap:3px; margin-top:8px; font-size:12.5px; }
.diag dt { color:var(--text-2); margin:0; white-space:nowrap; }
.diag dd { margin:0; display:flex; align-items:center; gap:6px; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.diag dd .mono { font-size:11.5px; }
.diag dd svg { color:var(--green); }

/* NEW · Step trail: pipeline stages with done ✓ (green), running ■ (amber), failed ✕ (ink), pending (text-2) */
.trail { display:flex; align-items:center; column-gap:14px; flex-wrap:wrap; margin-top:8px; row-gap:2px; }
.trail .st { display:flex; align-items:center; gap:5px; height:20px; font-size:12px; color:var(--text-2); }
.trail .st .mono { font-size:11px; color:var(--text-2); }
.trail .st.done svg { color:var(--green); }
.trail .st.done { color:var(--text); }
.trail .st.fail { color:var(--text); font-weight:600; }
.trail .st.fail svg { color:var(--text); }
.trail .st.run2 { color:var(--text); }
.trail .st.pend .dot { width:7px; height:7px; border:1px solid var(--seam-2); display:block; }
.trail .sep { width:14px; height:1px; background:var(--seam-2); margin:0 6px; }

/* Error block */
.eb .eh { display:flex; gap:9px; align-items:flex-start; }
.eb .eh svg { margin-top:1px; color:var(--text); flex:none; }
.eb .eh .t1 { color:var(--text); font-weight:600; font-size:13px; line-height:1.35; }
.eb .eh .t2 { color:var(--text-2); font-size:12.5px; margin-top:3px; line-height:1.4; }
.eb .fixes { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; align-items:center; }
.eb .dbs { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
.eb .dbs .btn { font-family:"Fragment Mono", monospace; font-size:12px; font-weight:400; }
.eb .pwrow { display:flex; gap:8px; margin-top:10px; align-items:center; }
.eb .attempt { color:var(--text-2); font-size:12px; }
.tech { margin-top:10px; }
.tech .dsc { display:flex; align-items:center; gap:6px; border:0; background:transparent; padding:0; color:var(--text-2); cursor:pointer; font-size:12.5px; }
.tech .dsc:hover { color:var(--text); }
.tech .box { margin-top:8px; padding:8px 10px; border:1px solid var(--seam-2); border-radius:4px; background:var(--panel); font-size:12px; }
:root[data-theme="light"] .tech .box { background:var(--ground); }
.tech .box { --text-3:var(--text-3-base); }
.tech .kvx { display:grid; grid-template-columns:110px 1fr; row-gap:4px; column-gap:10px; }
.tech .kvx dt { color:var(--text-3); margin:0; }
.tech .kvx dd { margin:0; color:var(--text); min-width:0; overflow-wrap:anywhere; }
.tech .kvx dd.mono { font-size:11.5px; }
.tech .code { font:400 11px "Fragment Mono", monospace; border:1px solid var(--seam-2); border-radius:3px; padding:1px 4px; color:var(--text); }
.tech .copy { margin-top:8px; }

/* NEW · Choice list (radio rows) for the production-tag prompt */
.choices { border:1px solid var(--seam-2); border-radius:4px; overflow:hidden; margin:2px 0 10px; }
.choice { display:grid; grid-template-columns:14px 7px 1fr; column-gap:10px; align-items:center; width:100%; min-height:34px; padding:7px 10px;
  border:0; background:transparent; text-align:left; cursor:pointer; color:var(--text); }
.choice + .choice { border-top:1px solid var(--seam); }
.choice:hover { background:var(--hover); }
.choice[aria-checked="true"] { background:var(--blue-a); }
.choice:focus-visible { outline-offset:-2px; }
.choice .radio { width:14px; height:14px; border:1px solid var(--seam-2); border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--panel); }
:root[data-theme="light"] .choice .radio { background:var(--ground); }
.choice[aria-checked="true"] .radio { border-color:var(--blue); }
.choice[aria-checked="true"] .radio::after { content:""; width:6px; height:6px; border-radius:50%; background:var(--blue); }
.choice .cl { display:flex; flex-direction:column; min-width:0; }
.choice .cl b { font-weight:600; font-size:13px; }
.choice .cl span { color:var(--text-2); font-size:12.5px; }
.changes { margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:7px; }
.changes li { display:grid; grid-template-columns:16px 1fr; column-gap:8px; align-items:start; color:var(--text); font-size:12.5px; line-height:1.4; }
.changes li .m { height:17px; display:flex; align-items:center; justify-content:center; color:var(--text-2); }
.changes .prodword { color:var(--red); font-variant-caps:all-small-caps; letter-spacing:.09em; font-weight:700; }
.calm { color:var(--text-2); font-size:12.5px; margin:0; }
.suggest { color:var(--text-2); font-size:12px; display:flex; gap:6px; align-items:center; margin:-2px 0 8px; }

/* Certificate / fingerprint insets (DML-preview anatomy) */
.inset { padding:8px 10px; border:1px solid var(--seam-2); border-radius:4px; background:var(--panel); --text-3:var(--text-3-base); }
:root[data-theme="light"] .inset { background:var(--ground); }
.certkv { display:grid; grid-template-columns:120px 1fr; row-gap:5px; column-gap:10px; font-size:12.5px; margin-bottom:10px; }
.certkv dt { color:var(--text-2); margin:0; }
.certkv dd { margin:0; color:var(--text); min-width:0; }
.certkv dd.mono { font-size:11.5px; }
.fp { font:400 11.5px/17px "Fragment Mono", monospace; color:var(--text); letter-spacing:.02em; }
.fphead { display:flex; align-items:center; gap:6px; color:var(--text-2); font-size:12.5px; margin-bottom:5px; }
.chain { margin:10px 0 0; padding:0; list-style:none; font-size:12.5px; }
.chain li { height:22px; display:flex; align-items:center; gap:7px; white-space:nowrap; }
.chain li .mono { font-size:11.5px; color:var(--text); }
.chain li .d { color:var(--text-2); }
.chain li .tick { width:9px; height:11px; border-left:1px solid var(--seam-2); border-bottom:1px solid var(--seam-2); margin-top:-8px; flex:none; }
.chain li.l1 { padding-left:8px; } .chain li.l2 { padding-left:24px; }
.chain li svg { color:var(--text-2); }

/* SSH: route line + jump list */
.route { display:flex; align-items:center; flex-wrap:wrap; gap:6px; color:var(--text-2); font-size:12px; }
.route .mono { font-size:11.5px; color:var(--text); }
.route svg { color:var(--text-2); }
.hops { display:flex; flex-direction:column; gap:6px; flex:1; min-width:0; }
.hop { display:flex; align-items:center; gap:8px; }
.hop .ix { font:400 11px "Fragment Mono", monospace; color:var(--text-2); width:12px; text-align:right; flex:none; }

/* PopupMenu (existing): min 200px, rows 24px, radius 6, popover shadow */
.menu { position:absolute; z-index:60; min-width:200px; padding:4px; background:var(--raised); border:1px solid var(--seam-2); border-radius:6px; box-shadow:var(--shadow-pop); --text-3:var(--text-2); outline:none; }
.menu .mi { height:24px; display:flex; align-items:center; gap:12px; padding:0 10px; border-radius:3px; cursor:default; white-space:nowrap; color:var(--text); font-size:13px; }
.menu .mi .ck { width:12px; color:var(--blue); display:flex; }
.menu .mi .h { color:var(--text-2); font-size:12px; margin-left:auto; padding-left:16px; }
.menu .mi .k { font:400 11px "Fragment Mono", monospace; color:var(--text-2); margin-left:auto; padding-left:16px; }
.menu .mi.on { background:var(--hover); }
.menu .mi.dis { color:var(--text-2); }
.menu .mi.danger { color:var(--red); }
.menu .mi.mono2 .lab { font:400 12px "Fragment Mono", monospace; }
.menu .sep { height:1px; background:var(--seam); margin:4px 0; }
.menu .mh { padding:4px 10px 4px; color:var(--text-2); font-size:12px; }

/* Popover explanation (unencrypted badge) */
.pop { position:absolute; z-index:45; width:300px; padding:10px 12px; background:var(--raised); border:1px solid var(--seam-2); border-radius:6px; box-shadow:var(--shadow-pop); font-size:12.5px; color:var(--text-2); line-height:1.4; --text-3:var(--text-2); }
.pop b { color:var(--text); font-weight:600; display:flex; gap:7px; align-items:center; margin-bottom:4px; font-size:13px; }
.pop p { margin:0 0 6px; }

/* Toast (existing) + NEW sticky variant with actions */
.toasts { position:absolute; right:12px; bottom:36px; display:flex; flex-direction:column; gap:8px; z-index:50; }
.toast { width:320px; padding:8px 12px; background:var(--raised); border:1px solid var(--seam-2); border-radius:6px; box-shadow:var(--shadow-pop); display:flex; gap:8px; align-items:flex-start; font-size:12.5px; color:var(--text); --text-3:var(--text-2); }
.toast.wide { width:380px; }
.toast > svg { margin-top:1px; color:var(--text-2); }
.toast > svg.ok { color:var(--green); }
.toast .tb { flex:1; min-width:0; line-height:1.4; }
.toast .tb .t1 { font-weight:600; }
.toast .tb .l2 { color:var(--text-2); }
.toast .tb .mono { font-size:11.5px; overflow-wrap:anywhere; }
.toast .tb ul { margin:4px 0 0; padding:0 0 0 0; list-style:none; color:var(--text-2); }
.toast .tb li { display:flex; gap:6px; align-items:flex-start; }
.toast .tb li::before { content:""; width:3px; height:3px; background:var(--text-2); flex:none; margin-top:7px; }
.toast .acts { display:flex; gap:6px; margin-top:8px; }
.toast .x { border:0; background:transparent; padding:2px; color:var(--text-2); cursor:pointer; border-radius:3px; }
.toast .x:hover { color:var(--text); background:var(--hover); }

/* ───────── Mock notes drawer (mock only) ───────── */
.notes { position:fixed; top:34px; right:0; bottom:0; width:420px; z-index:80; background:var(--gutter); border-left:1px dashed var(--seam-2);
  display:none; flex-direction:column; font-size:12.5px; color:var(--text); }
.notes.on { display:flex; }
.notes .nh { height:30px; display:flex; align-items:center; gap:8px; padding:0 10px 0 12px; border-bottom:1px solid var(--seam); flex:none; }
.notes .nh .tag { font:400 11px "Fragment Mono", monospace; color:var(--text-2); border:1px dashed var(--seam-2); border-radius:3px; padding:1px 5px; }
.notes .nbody { overflow:auto; padding:10px 12px 20px; }
.notes h3 { margin:12px 0 6px; font-size:13.5px; color:var(--text-2); font-variant-caps:all-small-caps; letter-spacing:.075em; font-weight:600; }
.notes h3:first-child { margin-top:2px; }
.notes ul { margin:0; padding-left:16px; color:var(--text); line-height:1.45; }
.notes li { margin-bottom:4px; }
.notes li code, .notes p code { font:400 11.5px "Fragment Mono", monospace; color:var(--text); }
.notes p { margin:0 0 6px; color:var(--text-2); line-height:1.45; }
.notes table { width:100%; border-collapse:collapse; font-size:12px; table-layout:fixed; }
.notes td { border-top:1px solid var(--seam); padding:4px 4px 4px 0; vertical-align:top; overflow-wrap:anywhere; }
.notes td.k { font:400 11px "Fragment Mono", monospace; color:var(--text-2); width:30%; }
.notes td.en { color:var(--text-2); width:33%; }
.notes .por { font:400 10.5px "Fragment Mono", monospace; color:var(--amber); border:1px dashed var(--amber); border-radius:3px; padding:0 3px; white-space:nowrap; margin-left:4px; }
.notes .sample { display:flex; gap:6px; align-items:center; margin:6px 0; }
.notes .sample code { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:400 11px "Fragment Mono", monospace; border:1px solid var(--seam-2); border-radius:3px; padding:3px 5px; }
</style>

const frow = (label, cell, forId) => `<div class="frow"><span class="flab">${esc(label)}</span><div class="fcell">${cell}</div></div>`;
const hintrow = (html) => `<div class="hintrow"><span class="h">${html}</span></div>`;

function trailHTML(steps, cur, failAt) {
  return `<div class="trail">` + steps.map((s, i) => {
    let cls = "pend", mk = `<i class="dot"></i>`, msv = "";

    else if (i === cur && failAt == null) { cls = "run2"; mk = `<i class="run"></i>`; }
    return `<span class="st ${cls}">${mk}<span>${esc(t("step-" + s))}</span>${msv}</span>`;
  }).join("") + `</div>`;
}
function testHTML(L) {

  if (T.state === "ok") {
    const total = steps.reduce((a, s) => a + STEP_MS[s], 0);
    const ver = f.engine === "pg" ? "PostgreSQL 16.4" : f.engine === "mysql" ? "MySQL 8.4.3" : f.engine === "maria" ? "MariaDB 11.4.4" : "SQLite 3.47.2";

      ${trailHTML(steps, steps.length)}
      <dl class="diag"><dt>${esc(t("diag-server"))}</dt><dd><span class="mono">${esc(ver)}</span></dd><dt>${esc(t("diag-latency"))}</dt><dd><span>${esc(t("diag-latency-v", { ms: ms(f.ssh.on ? 31 : 4) }))}</span></dd>
      <dt>${esc(t("diag-auth"))}</dt><dd><span class="mono">${esc(f.engine === "sqlite" ? "—" : (f.user || "postgres") + " · " + (f.engine === "pg" ? "SCRAM-SHA-256" : "caching_sha2_password"))}</span></dd><dt>${esc(t("diag-warn"))}</dt><dd style="color:var(--text-2)">${esc(t("diag-none"))}</dd>

}

  url: { intent:"Paste is the fastest path in. The secret never lives in a URL: it is split off on paste and never written on copy.",
    points:["Paste a postgres://, mysql://, mariadb://, jdbc:… URL, a key=value DSN or a SQLite path into any field (not just the URL row).","The filled fields flash blue-tint for 1.6 s, then settle. The notice lists exactly what happened: password moved out, parameters mapped, unknown ones kept.","A URL for another engine never switches silently when the form already has input (HV-DRV-04). An untouched form switches and says so.","Unreadable text changes nothing and says which formats are accepted.","Copy as URL (row button, ⌘⇧C, Explorer menu) never includes the password, and says when the SSH tunnel was left out."],
    sample:true },
  errors: { intent:"An error is a sentence about the user's situation, a trail showing where it broke, and one-click fixes. The raw server text is one disclosure away, never the headline.",
    points:["Codes first (SQLSTATE, vendor code), never localized server text (HV-CONN-03). Turkish servers send \"HATA\"; the title still comes from the class.","The step trail reuses the Test anatomy: the user sees the stage that failed.","Auth: \"Enter password again\" opens an inline field and counts attempts (stops at 3 to avoid lockouts).","Unknown database: the fix lists the databases the user can actually open, as one-click buttons.","Server too old: \"Connect anyway\" is a ghost button, pending a PO decision (question 3).","Copy details produces English text for support, whatever the UI language."] },
  prod: { intent:"A quiet question, not an alarm: neutral title, no warning icon, the production consequences listed in plain words with harman's own marks.",

  capsule: { intent:"The capsule is the single source of where you are. It changes shape with the connection state, and it is never dimmed by a dialog.",

/* ═════════════ Flows ═════════════ */
function applyPaste(L, text, quiet) {
  const p = parseConn(text), f = L.form;
  if (p.kind !== "ok") { L.notice = { kind:"unrec" }; return; }
  const touched = !!(f.host || f.db || f.user || f.path);
  if (p.engine !== f.engine && touched) { L.notice = { kind:"switch", parsed:p, current:f.engine, text }; return; }
  fillFrom(L, p, p.engine !== f.engine ? p.engine : null);
}
function fillFrom(L, p, engineSet) {
  L.undo = clone(L.form);
  const f = L.form;
  if (engineSet || p.engine !== f.engine) { f.engine = p.engine; if (p.engine !== "pg" && f.auth === "pgpass") f.auth = "password"; }
  const filled = [];
  for (const [k, v] of Object.entries(p.fields)) { if (v !== "" && v != null) { f[k] = v; filled.push(k); } }
  if (p.secret) { f.password = p.secret; f.pwFrom = "url"; f.auth = "password"; filled.push("password"); }
  if (p.extras.length) f.extras = p.extras;
  if (!f.nameTouched) { f.name = suggestName(f); filled.push("name"); }
  if (f.engine === "sqlite") { f.env = "local"; }
  L.filled = filled;
  if (p.fields.tls && p.fields.tls !== "auto") L.open.tls = false;
  L.notice = { kind:"filled", secret: !!p.secret, ret: f.ret, mapped: p.mapped, extras: p.extras, engineSet };
  L.test = { state:"idle" };
}
function copyUrlToast(f) {
  const url = renderURL(f);
  try { navigator.clipboard?.writeText(url).catch(() => {}); } catch {}
  toast(`<div class="t1">${esc(t("toast-copied"))}</div><div class="mono">${esc(url)}</div><div class="l2">${esc(t("toast-nopw"))}${f.ssh && f.ssh.on ? " " + esc(t("toast-nossh")) : ""}</div>`, { icon:"copy", wide:true });
}

function runTest(L) {
  clearTimers();
  const steps = stepsFor(L.form), out = outcomeOf(L.form), failAt = out === "ok" ? -1 : steps.indexOf(FAIL_STEP[out]);
  L.test = { state:"running", step:0, elapsed:0, t0:performance.now() };
  renderLayers();
  TICK = setInterval(() => { if (L.test.state !== "running") return clearInterval(TICK); L.test.elapsed = (performance.now() - L.test.t0) / 1000; const n = document.querySelector(".tres .th .mono"); if (n) n.textContent = secs(L.test.elapsed, 2); }, 50);
  const stepDur = s => Math.max(140, Math.min(420, STEP_MS[s] * 2));
  let acc = 0;
  steps.forEach((s, i) => {
    acc += stepDur(s);
    later(() => {
      if (L.test.state !== "running") return;
      if (i === failAt) { L.test = { state:"fail", kind:out }; clearInterval(TICK); renderLayers(); return; }
      L.test.step = i + 1;
      if (i === steps.length - 1) { L.test = { state:"ok" }; clearInterval(TICK); }
      renderLayers();
    }, acc);
  });
}

function trySave(connectAfter) {
  const L = connLayer(); if (!L) return;
  const f = L.form;
  if (f.engine !== "sqlite" && !f.host) { document.querySelector('[data-fk="f-host"]')?.focus(); return; }
  if (!f.env) {
    if (f.engine === "sqlite" || isLocalHost(f.host)) f.env = "local";
    else { const sug = /prod|prd|live/i.test(f.host + " " + f.name); S.layers.push({ type:"prod", choice: sug ? "production" : null, suggested: sug, connect: connectAfter }); renderLayers(); focusInitial(); return; }
  }
  commitSave(L, connectAfter);
}
function commitSave(L, connectAfter) {
  const f = L.form, id = f.name || suggestName(f) || "connection";
  const rec = { id, engine:f.engine, ver: f.engine === "pg" ? "16.4" : f.engine === "mysql" ? "8.4.3" : f.engine === "maria" ? "11.4.4" : "3.47.2", env:f.env, ro:f.ro,
    host:f.host, port:+(f.port || ENG[f.engine].port || 0), db:f.db, user:f.user, auth:f.auth, ret:f.ret, path:f.path, tls: f.pin ? "pinned" : isLocalHost(f.host) || isPrivate(f.host) ? (f.tls === "auto" && isLocalHost(f.host) ? "none" : "verified") : "verified",
    ssh: f.ssh.on ? clone(f.ssh) : null, lat: f.ssh.on ? 31 : 5, outcome: outcomeOf(f), tlsMode:f.tls, app:f.app, extras:clone(f.extras) };
  if (L.mode === "edit") { const i = CONNS.findIndex(c => c.id === L.editId); if (i >= 0) CONNS[i] = { ...CONNS[i], ...rec }; } else { CONNS = CONNS.filter(c => c.id !== id); CONNS.push(rec); }
  S.layers = []; S.sel = id;
  renderAll();
  toast(`<div>${esc(t("toast-saved", { name:id }))}</div>`, { icon:"check", ok:true });
  if (connectAfter) connect(id);
}

function connect(id) {
  clearTimers();
  const c = conn(id); if (!c) return;
  const f = formFromConn(c); if (c.ssh) f.ssh = { ...f.ssh, on:true };
  const steps = stepsFor(f), out = c.outcome || (c.tls === "untrusted" ? "tlsAsk" : c.tls === "none-public" ? "plainAsk" : "ok");
  S.sel = id; S.cap = { state:"connecting", conn:id, stage:steps[0], elapsed:0, t0:performance.now() };
  S.pop = null; S.menu = null;
  renderTitle(); renderExplorer(); renderSheet(); renderStatus(); renderMenus();
  TICK = setInterval(() => { if (S.cap.state !== "connecting") return; S.cap.elapsed = (performance.now() - S.cap.t0) / 1000; const n = $("capClock"); if (n) n.textContent = secs(S.cap.elapsed, 2); }, 50);
  let acc = 0;
  steps.forEach((s, i) => {
    acc += Math.max(220, Math.min(520, STEP_MS[s] * 2.4));
    later(() => {
      if (S.cap.state !== "connecting" || S.cap.conn !== id) return;
      const next = steps[i + 1];
      if (s === "tls" && out === "tlsAsk") { S.layers.push({ type:"tls", conn:id }); renderLayers(); focusInitial(); return; }
      if (s === "tls" && out === "plainAsk") { S.layers.push({ type:"plain", conn:id, remember:false }); renderLayers(); focusInitial(); return; }
      if (["auth", "dns", "db", "old"].includes(out) && s === FAIL_STEP[out]) { failConnect(id, out); return; }
      if (!next) { S.cap = { state:"connected", conn:id }; clearInterval(TICK); renderTitle(); renderExplorer(); renderStatus(); toast(`<div>${esc(t("toast-connected", { name:id }))}</div>`, { icon:"check", ok:true }); return; }
      S.cap.stage = next; renderTitle(); renderStatus();
    }, acc);
  });
}
function resumeConnect(id, after) {
  // continue after an interaction (pin / plaintext / host key)
  const c = conn(id); if (after) after(c);
  S.layers = S.layers.filter(l => !["tls", "plain", "hostkey", "error"].includes(l.type));
  renderLayers();
  S.cap = { state:"connecting", conn:id, stage:"auth", elapsed:S.cap.elapsed || 0.1, t0:performance.now() - (S.cap.elapsed || 0.1) * 1000 };
  renderTitle(); renderStatus();
  later(() => { S.cap.stage = "check"; renderTitle(); }, 260);
  later(() => { clearInterval(TICK); S.cap = { state:"connected", conn:id }; renderTitle(); renderExplorer(); renderSheet(); renderStatus(); toast(`<div>${esc(t("toast-connected", { name:id }))}</div>`, { icon:"check", ok:true }); }, 560);
}
function failConnect(id, kind) {
  clearInterval(TICK);
  S.cap = { state:"failed", conn:id, kind };
  S.layers.push({ type:"error", conn:id, kind, db: kind === "db" ? conn(id).db : null });
  renderAll(); focusInitial();
}
function cancelConnect() {
  const id = S.cap.conn; clearTimers(); S.cap = { state:"none" }; S.layers = S.layers.filter(l => l.type === "conn");
  renderAll(); toast(`<div>${esc(t("toast-cancelled", { name:id }))}</div>`, { icon:"info" });
}

}

function closeTop() {
  if (S.menu) return closeMenu();
  const L = S.layers.pop();
  if (L && (L.type === "tls" || L.type === "plain" || L.type === "hostkey") && S.cap.state === "connecting" && !L.fromTest) { clearTimers(); S.cap = { state:"failed", conn:L.conn, kind: L.type === "tls" ? "tls" : "dns" }; renderAll(); return; }

}
function focusables(root) { return [...root.querySelectorAll('button:not([disabled]):not([tabindex="-1"]), input:not([tabindex="-1"]), [tabindex="0"]')].filter(el => el.offsetParent !== null); }

      e.preventDefault(); closeTop(); return;
    }

      if (e.code === "KeyT") { e.preventDefault(); return runTest(L); }

    }

    if (L.type === "error" && L.reenter && e.key === "Enter" && e.target.dataset.f === "errpw") { e.preventDefault(); return ACT.retryPw(); }

    const grp = e.target.closest(".seg, .choices");
    if (grp && ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.key)) {
      const bs = [...grp.querySelectorAll("button")], i = bs.indexOf(e.target), d = (e.key === "ArrowRight" || e.key === "ArrowDown") ? 1 : -1;
      const nb = bs[(i + d + bs.length) % bs.length]; e.preventDefault(); nb.click(); return;
    }
    if (e.target.classList?.contains("select") && (e.key === "ArrowDown" || e.key === " " || e.key === "Enter")) { e.preventDefault(); openSelect(e.target); return; }

  if (mod(e) && e.shiftKey && e.code === "KeyV") { e.preventDefault(); return ACT.pasteNew(); }
  if (inField) return;

  if (tree && S.sel) {
    const ids = ENV_ORDER.flatMap(env => CONNS.filter(c => c.env === env).map(c => c.id)), i = ids.indexOf(S.sel);
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); S.sel = ids[Math.max(0, Math.min(ids.length - 1, i + (e.key === "ArrowDown" ? 1 : -1)))]; renderExplorer(); renderSheet(); $("tree").focus(); document.querySelector(".row.sel")?.scrollIntoView({ block:"nearest" }); return; }

  }

});
function mockKeys(e) {
