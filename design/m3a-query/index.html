<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440, initial-scale=1">
<title>Hacivat Run a Query</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Fragment+Mono:ital@0;1&display=block" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   M3a "Run a query" — clickable mocks inside the approved harman world.
   The CSS below is the M2b mock's (design/m2b-secure, itself the M2a
   mock's), reused unchanged; M3a additions follow it, marked "M3a".
   Scale:  radius 0 · 3 · 4 · 6   seam 1px   spacing 2/4/6/8/10/12/14/16
           type 11 · 11.5 · 12 · 12.5 · 13 · 13.5 · 15
   GPUI:   solid fills, 1px borders, popover shadow only, no transforms,
           no blur, no filters, no masks.
   ═══════════════════════════════════════════════════════════════ */
:root, :root[data-theme="dark"] {
  --ground:#16181D; --panel:#1E2127; --side:#1E2127; --head:#1E2127; --gutter:#1A1D22;
  --raised:#252931; --hover:#23272E; --seam:#2A2E36; --seam-2:#363B45; --seam-soft:#23262D;
  --text:#C9D1D9; --text-2:#8B949E; --text-3:#828A96; --text-3-base:#828A96;
  --on-accent:#10141C; --on-red:#10141C; --cp-fill:#CE2C31; --on-cp-fill:#FFFFFF;
  --blue:#7AA2F7; --blue-a:rgba(122,162,247,.12); --blue-a2:rgba(122,162,247,.22); --blue-hover:#8DB0F8;
  --red:#E06C75; --red-a:rgba(224,108,117,.13); --red-line:rgba(224,108,117,.55);
  --green:#98C379; --green-fill:rgba(152,195,121,.55);
  --amber:#E5C07B; --amber-a:rgba(229,192,123,.13);
  --syn-kw:#B4A7F2; --syn-str:#98C379; --syn-num:#E5C07B;
  --scrim:rgba(22,24,29,.6);                       /* ground @ SCRIM_ALPHA 0.6 (shell/layers.rs) */
  --shadow-pop:0 10px 28px rgba(0,0,0,.34), 0 1px 2px rgba(0,0,0,.30);
  --tl-close:#FF5F57; --tl-min:#FEBC2E; --tl-max:#28C840;
  color-scheme:dark;
}
:root[data-theme="light"] {
  --ground:#F7F7F8; --panel:#FFFFFF; --side:#F7F7F8; --head:#F7F7F8; --gutter:#FAFAFB;
  --raised:#FFFFFF; --hover:#F1F1F3; --seam:#E5E5E9; --seam-2:#D8D8DE; --seam-soft:#EFEFF2;
  --text:#1B1B1F; --text-2:#55555E; --text-3:#6C6C76; --text-3-base:#6C6C76;
  --on-accent:#FFFFFF; --on-red:#FFFFFF; --cp-fill:#CE2C31; --on-cp-fill:#FFFFFF;
  --blue:#3B5FD9; --blue-a:rgba(59,95,217,.08); --blue-a2:rgba(59,95,217,.15); --blue-hover:#3352C4;
  --red:#CE2C31; --red-a:rgba(206,44,49,.08); --red-line:rgba(206,44,49,.45);
  --green:#1F7A50; --green-fill:rgba(31,122,80,.42);
  --amber:#A35C00; --amber-a:rgba(163,92,0,.10);
  --syn-kw:#4B57C2; --syn-str:#2B7A30; --syn-num:#B4530A;
  --scrim:rgba(247,247,248,.6);
  --shadow-pop:0 12px 32px -6px rgba(20,20,40,.20), 0 0 0 1px rgba(20,20,40,.04), 0 1px 2px rgba(20,20,40,.08);
  color-scheme:light;
}

/* ───────── Base (harman) ───────── */
* { box-sizing:border-box; }
html, body { margin:0; height:100%; }
body { background:var(--ground); color:var(--text); font:400 13px/1.35 "Source Sans 3", system-ui, sans-serif;
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased; overflow:hidden; }
::selection { background:var(--blue-a2); color:inherit; }
button { font:inherit; color:inherit; }
input { font:inherit; color:inherit; caret-color:var(--blue); }
.mono { font-family:"Fragment Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums; }
.sc { font-variant-caps:all-small-caps; letter-spacing:.075em; font-weight:600; }
svg.ic { width:14px; height:14px; flex:none; display:block; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
svg.ic.i12 { width:12px; height:12px; }
:focus { outline:none; }
:focus-visible { outline:1px solid var(--blue); outline-offset:1px; }
kbd { font:400 11px/1 "Fragment Mono", monospace; color:var(--text-3); border:1px solid var(--seam); border-radius:3px;
  padding:2px 4px; display:inline-flex; align-items:center; height:16px; background:transparent; flex:none; }
.grow { flex:1; }
.vsep { width:1px; height:18px; background:var(--seam); flex:none; }

/* Environment marks. Shape-coded first, hue only for production.
   local ○ (existing) · dev ◉ (NEW) · test ● (NEW) · staging □ (existing) · production ■ (existing) */
.env { width:7px; height:7px; border-radius:0; flex:none; display:inline-block; position:relative; }
.env.production { background:var(--red); }
.env.staging { border:1px solid var(--text-2); }
.env.test { background:var(--text-2); border-radius:50%; }
.env.dev { border:1px solid var(--text-2); border-radius:50%; }
.env.dev::after { content:""; position:absolute; left:1px; top:1px; width:3px; height:3px; border-radius:50%; background:var(--text-2); }
.env.local { border:1px solid var(--text-3); border-radius:50%; }

/* ───────── Mock bar (mock only, not product) ───────── */
.mockbar { height:34px; display:flex; align-items:center; gap:8px; padding:0 10px; background:var(--gutter);
  border-bottom:1px dashed var(--seam-2); white-space:nowrap; color:var(--text-2); font-size:12px; overflow:hidden; }
.mockbar .tag { font:400 11px "Fragment Mono", monospace; color:var(--text-2); border:1px dashed var(--seam-2); border-radius:3px; padding:2px 6px; }
.mockbar .lbl { color:var(--text-3); font-size:11.5px; }
.mseg { display:flex; height:24px; border:1px solid var(--seam-2); border-radius:4px; overflow:hidden; flex:none; }
.mseg button { border:0; background:transparent; padding:0 8px; color:var(--text-2); cursor:pointer; display:flex; align-items:center; gap:5px; font-size:12px; }
.mseg button + button { border-left:1px solid var(--seam-2); }
.mseg button[aria-pressed="true"] { background:var(--raised); color:var(--text); }
:root[data-theme="light"] .mseg button[aria-pressed="true"] { background:var(--panel); }
.mseg button:hover { color:var(--text); }
.mseg button .n { font:400 11px "Fragment Mono", monospace; color:var(--text-3); }
.mseg.lang button { font:400 11.5px "Fragment Mono", monospace; }

/* ───────── Window ───────── */
.win { position:relative; width:100vw; height:calc(100vh - 34px); display:grid; grid-template-rows:40px 1fr 24px; background:var(--ground); min-height:620px; }
.titlebar { display:flex; align-items:center; padding:0 10px 0 14px; border-bottom:1px solid var(--seam); background:var(--ground);
  user-select:none; white-space:nowrap; min-width:0; position:relative; z-index:40; }
.lights { display:flex; gap:8px; margin-right:18px; }
.lights i { width:12px; height:12px; border-radius:50%; display:block; border:.5px solid rgba(0,0,0,.25); }
.lights i:nth-child(1){background:var(--tl-close);} .lights i:nth-child(2){background:var(--tl-min);} .lights i:nth-child(3){background:var(--tl-max);}
.brand { display:flex; align-items:center; gap:8px; color:var(--text); padding-right:14px; }
.brand .word { font-size:14.5px; letter-spacing:.09em; }
.mark { width:16px; height:16px; display:block; color:var(--text-2); }

/* Capsule (harman) + M2a states */
.capsule { display:flex; align-items:stretch; height:26px; margin-left:12px; padding:0; border:1px solid var(--seam-2); border-radius:4px;
  overflow:hidden; background:var(--panel); cursor:pointer; font-size:13px; flex:none; }
.capsule > span { display:flex; align-items:center; gap:6px; padding:0 9px; }
.capsule > span + span { border-left:1px solid var(--seam-2); }
.capsule:hover > span:not(.cp-env) { background:var(--hover); }
.cp-env { background:var(--cp-fill); color:var(--on-cp-fill); padding:0 10px 0 9px !important; font-size:13.5px; }
.cp-env .sc { letter-spacing:.09em; font-weight:700; }
.cp-tag { color:var(--text-2); }
.cp-name b { font-weight:600; color:var(--text); }
.cp-name .dim { color:var(--text-2); }
.cp-ro svg { color:var(--text-2); }   /* M2b: red only on production, see .cp-ro.prod */
.cp-rw { color:var(--text-2); }
.cp-path svg.direct { color:var(--green); }
.cp-path svg.ssh { color:var(--text-2); }
.cp-path .mono { font-size:11.5px; color:var(--text-2); }
.cp-unenc { color:var(--text); }
.cp-unenc svg { color:var(--text-2); }
.cp-chev { color:var(--text-3); padding:0 6px !important; }
.cp-none { color:var(--text-2); }
.cp-run { color:var(--text); }
.cp-run .mono { font-size:11.5px; color:var(--text-2); min-width:44px; }
.run { width:7px; height:7px; background:var(--amber); display:block; flex:none; }          /* splash run marker */
.cp-fail { color:var(--text); }
.cp-fail svg { color:var(--text); }
.cp-retry { color:var(--text-2); }
.capsule:hover .cp-retry { color:var(--text); }

.palette { margin:0 4px 0 auto; flex:0 1 290px; min-width:170px; height:26px; display:flex; align-items:center; gap:8px; padding:0 6px 0 9px;
  border:1px solid var(--seam); border-radius:4px; color:var(--text-3); background:transparent; cursor:text; overflow:hidden; }
.palette:hover { border-color:var(--seam-2); }
.palette span { flex:1; text-align:left; overflow:hidden; text-overflow:ellipsis; }

/* Tiles */
.tiles { position:relative; display:grid; grid-template-columns:276px 1fr; gap:1px; background:var(--seam); min-height:0; }
.col { display:grid; gap:1px; min-height:0; background:var(--seam); }
.col.left { grid-template-rows:1fr 205px; }
.panel { background:var(--panel); min-height:0; min-width:0; display:flex; flex-direction:column; position:relative; overflow:hidden; }
.panel.side { background:var(--side); }
.ph { height:30px; flex:none; display:flex; align-items:center; gap:10px; padding:0 10px 0 12px; border-bottom:1px solid var(--seam); white-space:nowrap; background:var(--head); }
.ph .t { color:var(--text-2); font-size:13.5px; }
.ph .meta { color:var(--text-3); font-size:12px; }
.ph .id { color:var(--text); font-size:12.5px; }
.ph .ibtn { margin-right:-4px; }

/* Explorer */
.xfilter { display:flex; align-items:center; gap:7px; height:28px; margin:8px 8px 4px; padding:0 6px 0 8px; border:1px solid var(--seam); border-radius:4px; color:var(--text-3); background:var(--panel); }
:root[data-theme="dark"] .xfilter { background:transparent; }
.xfilter input { flex:1; min-width:0; border:0; background:transparent; outline:none; font-size:12.5px; }
.xfilter input::placeholder { color:var(--text-3); }
.tree { padding:2px 0 8px; overflow:auto; flex:1; outline:none; }
.grp { height:26px; display:flex; align-items:center; gap:7px; padding:6px 10px 0 12px; color:var(--text-3); font-size:13px; }
.grp .rule { flex:1; height:1px; background:var(--seam-soft); }
:root[data-theme="light"] .grp .rule { background:var(--seam); }
.grp .n { font-size:11px; color:var(--text-3); }
.row { height:23px; display:flex; align-items:center; gap:6px; padding:0 10px 0 12px; cursor:default; white-space:nowrap; color:var(--text); position:relative; }
.row:hover { background:var(--hover); }
.row.sel { background:var(--blue-a); }
.row.sel::before { content:""; position:absolute; left:0; top:0; bottom:0; width:1px; background:var(--blue); }
.tree:focus-visible .row.sel { outline:1px solid var(--blue); outline-offset:-1px; }
.row .ic { color:var(--text-2); }
.row.sel > .ic { color:var(--blue); }
.row .lbl { overflow:hidden; text-overflow:ellipsis; }
.row .lbl.on { font-weight:600; }
.row .flags { display:flex; align-items:center; gap:5px; color:var(--text-2); }
.row .flags .ro { color:var(--red); }
.row .meta { color:var(--text-3); font-size:11px; display:flex; align-items:center; gap:4px; }
.row .meta .ok { color:var(--green); }
.row .run { width:7px; height:7px; }
.xempty { flex:1; display:flex; flex-direction:column; align-items:flex-start; padding:18px 14px 0 14px; gap:8px; }
.xempty .h { font-weight:600; color:var(--text); font-size:13px; display:flex; align-items:center; gap:8px; }
.xempty .h svg { color:var(--text-2); }
.xempty p { margin:0 0 4px; color:var(--text-2); font-size:12.5px; line-height:1.4; }
.xempty .acts { display:flex; flex-direction:column; align-items:stretch; gap:6px; width:100%; }
.xempty .acts .btn { justify-content:flex-start; }
.xempty .acts .btn .k { margin-left:auto; }

/* Connection sheet */
.sheet { padding:6px 0 0; margin:0; }
.kv { display:grid; grid-template-columns:92px 1fr; align-items:center; height:22px; padding:0 12px; column-gap:10px; font-size:12.5px; white-space:nowrap; }
.kv dt { color:var(--text-3); margin:0; overflow:hidden; text-overflow:ellipsis; }
.kv dd { margin:0; display:flex; align-items:center; gap:6px; min-width:0; overflow:hidden; }
.kv dd .mono { font-size:11.5px; overflow:hidden; text-overflow:ellipsis; }
.kv .r { color:var(--red); font-weight:600; }
.kv .d { color:var(--text-2); }
.kv .g { color:var(--green); }

/* Center: empty workspace */
.home { flex:1; display:flex; align-items:center; justify-content:center; }
.home .box { width:420px; display:flex; flex-direction:column; gap:14px; }
.home .h { color:var(--text-2); font-size:13.5px; }
.home .keys { display:grid; grid-template-columns:1fr auto; row-gap:9px; column-gap:24px; font-size:13px; }
.home .keys span { color:var(--text-2); }
.home .keys .k { display:flex; gap:3px; justify-content:flex-end; }
.home .hint { color:var(--text-3); font-size:12px; }

/* Buttons (harman) */
.btn { height:24px; display:inline-flex; align-items:center; gap:6px; padding:0 9px; border:1px solid var(--seam-2); border-radius:4px; background:transparent;
  color:var(--text); font-size:12.5px; font-weight:500; cursor:pointer; white-space:nowrap; flex:none; }
.btn:hover { background:var(--hover); }
.btn .k { font:400 11px "Fragment Mono", monospace; color:var(--text-3); }
.btn.primary { background:var(--blue); border-color:var(--blue); color:var(--on-accent); font-weight:600; }
.btn.primary .k { color:var(--on-accent); opacity:.7; }
.btn.primary:hover { background:var(--blue-hover); border-color:var(--blue-hover); }
.btn.ghost { border-color:transparent; color:var(--text-2); }
.btn.ghost:hover { color:var(--text); }
.btn.icon { padding:0 6px; }
.btn[disabled], .btn[disabled]:hover { cursor:not-allowed; color:var(--text-3); border-color:var(--seam-2); background:transparent; }
.btn.ghost[disabled], .btn.ghost[disabled]:hover { border-color:transparent; }
.btn.danger { color:var(--red); border-color:var(--red-line); background:transparent; }
.btn.danger:hover, .btn.danger:focus-visible { background:var(--red); border-color:var(--red); color:var(--on-red); outline:none; }
.void { display:flex; align-items:center; gap:8px; margin-right:28px; padding-right:12px; border-right:1px solid var(--seam); height:20px; flex:none; }

/* Status bar (harman) */
.status { display:flex; align-items:stretch; border-top:1px solid var(--seam); background:var(--ground); font-size:12px; color:var(--text-2); white-space:nowrap; position:relative; z-index:1; }
.status .s { display:flex; align-items:center; gap:6px; padding:0 10px; border-right:1px solid var(--seam); }
.status .s.r { border-right:0; border-left:1px solid var(--seam); }
.status .envseg { background:var(--red-a); color:var(--red); font-weight:600; padding-left:12px; }
.status .envseg.np { background:transparent; color:var(--text); font-weight:400; }
.status .g svg { color:var(--green); }
.status .mono { font-size:11px; }
.status button.s { background:transparent; border-top:0; border-bottom:0; border-right:0; cursor:pointer; color:var(--text-2); }
.status button.s:hover { color:var(--text); background:var(--hover); }
.status .lang b { color:var(--text); font-weight:600; }
.status .run { width:7px; height:7px; }

/* ───────── Layers: scrim + dialogs ─────────
   The scrim starts below the title bar: the capsule is never dimmed (decision M2a-1). */
.layer { position:absolute; left:0; right:0; top:40px; bottom:0; background:var(--scrim); display:flex; align-items:center; justify-content:center; z-index:30; }
.dlg { position:relative; background:var(--raised); border:1px solid var(--seam-2); border-radius:6px; box-shadow:var(--shadow-pop);
  display:flex; flex-direction:column; max-height:calc(100% - 32px); --text-3:var(--text-2); }    /* Raised Ink Rule */
.dlg.w420 { width:420px; } .dlg.w480 { width:480px; } .dlg.w640 { width:640px; }
.dlg .dhead { display:flex; align-items:flex-start; gap:12px; padding:16px 16px 0; }
.dlg .dhead .tt { flex:1; min-width:0; }
.dlg .dhead .title { font-weight:600; font-size:13px; color:var(--text); }
.dlg .dhead .sub { color:var(--text-2); font-size:12.5px; margin-top:2px; display:flex; gap:6px; align-items:center; }
.dlg .x { border:0; background:transparent; padding:4px; border-radius:4px; color:var(--text-3); cursor:pointer; margin:-3px -4px 0 0; }
.dlg .x:hover { background:var(--hover); color:var(--text); }
.dlg .dbody { padding:12px 16px 0; color:var(--text-2); font-size:13px; }
.dlg .dbody p { margin:0 0 10px; line-height:1.4; }
.dlg .dbody p.strong { color:var(--text); }
.dlg .dfoot { display:flex; align-items:center; gap:8px; padding:12px 16px 16px; }
.dlg .dfoot .grow { flex:1; }
.dlg.form .dhead { padding:12px 14px 12px 16px; border-bottom:1px solid var(--seam); align-items:center; }
.dlg.form .dscroll { overflow:auto; padding:12px 16px 14px; min-height:0; }
.dlg.form .dfoot { border-top:1px solid var(--seam); padding:12px 16px; }

/* Form rows */
.frow { display:grid; grid-template-columns:140px 1fr; align-items:center; column-gap:12px; min-height:26px; }
.frow + .frow, .frow + .notice, .notice + .frow, .frow + .hintrow, .hintrow + .frow { margin-top:8px; }
.flab { color:var(--text-2); font-size:13px; line-height:1.25; }
.fcell { display:flex; align-items:center; gap:8px; min-width:0; }
.hintrow { display:grid; grid-template-columns:140px 1fr; column-gap:12px; margin-top:4px; }
.hintrow .h { grid-column:2; color:var(--text-2); font-size:12px; display:flex; gap:6px; align-items:center; line-height:1.35; }
.hintrow .h svg { flex:none; }
.inl { color:var(--text-2); font-size:13px; flex:none; }
.secth { display:flex; align-items:center; gap:7px; height:22px; margin:14px 0 8px; color:var(--text-2); font-size:13px; }
.secth .rule { flex:1; height:1px; background:var(--seam); }

/* TextInput (existing): 26px, seam-strong, radius 4, padding 0 6 0 9; field well = panel (dark) / ground (light) like the harman query box */
.in { height:26px; display:flex; align-items:center; gap:6px; padding:0 6px 0 9px; border:1px solid var(--seam-2); border-radius:4px; background:var(--panel);
  min-width:0; flex:1; --text-3:var(--text-3-base); transition:background-color 240ms cubic-bezier(.16,1,.3,1); }
:root[data-theme="light"] .in { background:var(--ground); }
.in input { flex:1; min-width:0; border:0; background:transparent; outline:0; font-size:13px; color:var(--text); padding:0; height:24px; }
.in input::placeholder { color:var(--text-3); }
.in.mono input::placeholder { font-family:"Source Sans 3", system-ui, sans-serif; font-size:13px; }
.in.mono input { font:400 12px "Fragment Mono", monospace; }
.in:focus-within { outline:1px solid var(--blue); outline-offset:1px; }
.in.filled { background:var(--blue-a2); }
.in .tail { color:var(--text-3); font-size:12px; flex:none; display:flex; gap:4px; align-items:center; }
.in .tail .btn { height:20px; padding:0 5px; margin-right:-3px; }
.in.port { flex:0 0 76px; }
.in.short { flex:0 0 96px; }
.in.err { border-color:var(--text-2); }

/* Segmented (existing). Inside a raised dialog it sits in a field well; pressed = raised (dark) / panel (light). */
.seg { display:flex; height:26px; border:1px solid var(--seam-2); border-radius:4px; overflow:hidden; flex:none; background:var(--panel); }
:root[data-theme="light"] .seg { background:var(--ground); }
.seg button { border:0; background:transparent; padding:0 9px; color:var(--text-2); cursor:pointer; display:flex; align-items:center; gap:6px; font-size:13px; }
.seg button + button { border-left:1px solid var(--seam-2); }
.seg button[aria-pressed="true"] { background:var(--raised); color:var(--text); font-weight:600; }
:root[data-theme="light"] .seg button[aria-pressed="true"] { background:var(--panel); }
.seg button:hover { color:var(--text); }
.seg button:focus-visible { outline:1px solid var(--blue); outline-offset:-2px; }
.seg.unset button[aria-pressed="false"] { color:var(--text-2); }

/* NEW · Checkbox: 14px, radius 3, 1px seam-strong; checked = blue fill + on-accent check */
.cb { display:inline-flex; align-items:center; gap:8px; cursor:pointer; color:var(--text); font-size:13px; border:0; background:transparent; padding:0; text-align:left; }
.cb .box { width:14px; height:14px; border:1px solid var(--seam-2); border-radius:3px; background:var(--panel); display:flex; align-items:center; justify-content:center; flex:none; color:var(--on-accent); }
:root[data-theme="light"] .cb .box { background:var(--ground); }
:root .cb[aria-checked="true"] .box, :root[data-theme="light"] .cb[aria-checked="true"] .box { background:var(--blue); border-color:var(--blue); }
.cb .box svg { width:12px; height:12px; stroke-width:2.2; visibility:hidden; }
.cb[aria-checked="true"] .box svg { visibility:visible; }
.cb .sub { color:var(--text-2); }

/* NEW · Select: field-shaped button that opens a PopupMenu */
.select { height:26px; display:inline-flex; align-items:center; gap:8px; padding:0 6px 0 9px; border:1px solid var(--seam-2); border-radius:4px; background:var(--panel);
  color:var(--text); cursor:pointer; font-size:13px; min-width:0; text-align:left; }
:root[data-theme="light"] .select { background:var(--ground); }
.select .v { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.select svg { color:var(--text-2); }
.select:hover { border-color:var(--text-3-base); }

/* NEW · Disclosure: 30px row, chevron swaps right/down (no rotation), small-caps title, summary at text-2 */
.disc { width:100%; height:32px; display:flex; align-items:center; gap:8px; border:0; border-top:1px solid var(--seam); background:transparent; padding:0 2px 0 0; cursor:pointer; text-align:left; margin-top:14px; }
.disc + .dbox + .disc, .disc + .disc { margin-top:0; }
.disc .chev { color:var(--text-2); width:14px; display:flex; justify-content:center; }
.disc .ttl { color:var(--text); font-size:13px; font-weight:600; }
.disc .sum { flex:1; text-align:right; color:var(--text-2); font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:flex; justify-content:flex-end; gap:6px; align-items:center; }
.disc:hover .ttl { color:var(--text); }
.disc:focus-visible { outline-offset:-1px; }
.dbox { padding:4px 0 12px 22px; }

/* NEW · Inline notice: bordered inset, icon carries meaning only when it is a result */
.notice { display:flex; gap:9px; align-items:flex-start; padding:8px 10px; border:1px solid var(--seam-2); border-radius:4px; background:var(--panel); color:var(--text); font-size:12.5px; line-height:1.4; }
:root[data-theme="light"] .notice { background:var(--ground); }
.notice > svg { margin-top:1px; color:var(--text-2); }
.notice .nb { flex:1; min-width:0; }
.notice .nb .l2 { color:var(--text-2); }
.notice .nb ul { margin:4px 0 0; padding:0; list-style:none; }
.notice .nb li { display:flex; gap:6px; align-items:baseline; color:var(--text-2); }
.notice .nb li .mono { font-size:11.5px; color:var(--text); }
.notice .acts { display:flex; gap:6px; margin-top:8px; }
.notice.ok > svg { color:var(--green); }
.notice .mono { font-size:11.5px; }

/* Test result strip (above the dialog footer) */
.tres { border-top:1px solid var(--seam); padding:10px 16px 12px; background:var(--panel); }
:root[data-theme="light"] .tres { background:var(--ground); }
.tres { --text-3:var(--text-3-base); }
.tres .th { display:flex; align-items:center; gap:8px; color:var(--text); font-weight:600; }
.tres .th .ok { color:var(--green); }
.tres .sub2 { color:var(--text-2); font-size:12.5px; margin:2px 0 0 22px; }
.tres .th .mono { font-weight:400; font-size:11.5px; color:var(--text-2); }
.diag { display:grid; grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr); column-gap:12px; row-gap:3px; margin-top:8px; font-size:12.5px; }
.diag dt { color:var(--text-2); margin:0; white-space:nowrap; }
.diag dd { margin:0; display:flex; align-items:center; gap:6px; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.diag dd .mono { font-size:11.5px; }
.diag dd svg { color:var(--green); }

/* NEW · Step trail: pipeline stages with done ✓ (green), running ■ (amber), failed ✕ (ink), pending (text-2) */
.trail { display:flex; align-items:center; column-gap:14px; flex-wrap:wrap; margin-top:8px; row-gap:2px; }
.trail .st { display:flex; align-items:center; gap:5px; height:20px; font-size:12px; color:var(--text-2); }
.trail .st .mono { font-size:11px; color:var(--text-2); }
.trail .st.done svg { color:var(--green); }
.trail .st.done { color:var(--text); }
.trail .st.fail { color:var(--text); font-weight:600; }
.trail .st.fail svg { color:var(--text); }
.trail .st.run2 { color:var(--text); }
.trail .st.pend .dot { width:7px; height:7px; border:1px solid var(--seam-2); display:block; }
.trail .sep { width:14px; height:1px; background:var(--seam-2); margin:0 6px; }

/* Error block */
.eb .eh { display:flex; gap:9px; align-items:flex-start; }
.eb .eh svg { margin-top:1px; color:var(--text); flex:none; }
.eb .eh .t1 { color:var(--text); font-weight:600; font-size:13px; line-height:1.35; }
.eb .eh .t2 { color:var(--text-2); font-size:12.5px; margin-top:3px; line-height:1.4; }
.eb .fixes { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; align-items:center; }
.eb .dbs { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
.eb .dbs .btn { font-family:"Fragment Mono", monospace; font-size:12px; font-weight:400; }
.eb .pwrow { display:flex; gap:8px; margin-top:10px; align-items:center; }
.eb .attempt { color:var(--text-2); font-size:12px; }
.tech { margin-top:10px; }
.tech .dsc { display:flex; align-items:center; gap:6px; border:0; background:transparent; padding:0; color:var(--text-2); cursor:pointer; font-size:12.5px; }
.tech .dsc:hover { color:var(--text); }
.tech .box { margin-top:8px; padding:8px 10px; border:1px solid var(--seam-2); border-radius:4px; background:var(--panel); font-size:12px; }
:root[data-theme="light"] .tech .box { background:var(--ground); }
.tech .box { --text-3:var(--text-3-base); }
.tech .kvx { display:grid; grid-template-columns:110px 1fr; row-gap:4px; column-gap:10px; }
.tech .kvx dt { color:var(--text-3); margin:0; }
.tech .kvx dd { margin:0; color:var(--text); min-width:0; overflow-wrap:anywhere; }
.tech .kvx dd.mono { font-size:11.5px; }
.tech .code { font:400 11px "Fragment Mono", monospace; border:1px solid var(--seam-2); border-radius:3px; padding:1px 4px; color:var(--text); }
.tech .copy { margin-top:8px; }

/* NEW · Choice list (radio rows) for the production-tag prompt */
.choices { border:1px solid var(--seam-2); border-radius:4px; overflow:hidden; margin:2px 0 10px; }
.choice { display:grid; grid-template-columns:14px 7px 1fr; column-gap:10px; align-items:center; width:100%; min-height:34px; padding:7px 10px;
  border:0; background:transparent; text-align:left; cursor:pointer; color:var(--text); }
.choice + .choice { border-top:1px solid var(--seam); }
.choice:hover { background:var(--hover); }
.choice[aria-checked="true"] { background:var(--blue-a); }
.choice:focus-visible { outline-offset:-2px; }
.choice .radio { width:14px; height:14px; border:1px solid var(--seam-2); border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--panel); }
:root[data-theme="light"] .choice .radio { background:var(--ground); }
.choice[aria-checked="true"] .radio { border-color:var(--blue); }
.choice[aria-checked="true"] .radio::after { content:""; width:6px; height:6px; border-radius:50%; background:var(--blue); }
.choice .cl { display:flex; flex-direction:column; min-width:0; }
.choice .cl b { font-weight:600; font-size:13px; }
.choice .cl span { color:var(--text-2); font-size:12.5px; }
.changes { margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:7px; }
.changes li { display:grid; grid-template-columns:16px 1fr; column-gap:8px; align-items:start; color:var(--text); font-size:12.5px; line-height:1.4; }
.changes li .m { height:17px; display:flex; align-items:center; justify-content:center; color:var(--text-2); }
.changes .prodword { color:var(--red); font-variant-caps:all-small-caps; letter-spacing:.09em; font-weight:700; }
.calm { color:var(--text-2); font-size:12.5px; margin:0; }
.suggest { color:var(--text-2); font-size:12px; display:flex; gap:6px; align-items:center; margin:-2px 0 8px; }

/* Certificate / fingerprint insets (DML-preview anatomy) */
.inset { padding:8px 10px; border:1px solid var(--seam-2); border-radius:4px; background:var(--panel); --text-3:var(--text-3-base); }
:root[data-theme="light"] .inset { background:var(--ground); }
.certkv { display:grid; grid-template-columns:120px 1fr; row-gap:5px; column-gap:10px; font-size:12.5px; margin-bottom:10px; }
.certkv dt { color:var(--text-2); margin:0; }
.certkv dd { margin:0; color:var(--text); min-width:0; }
.certkv dd.mono { font-size:11.5px; }
.fp { font:400 11.5px/17px "Fragment Mono", monospace; color:var(--text); letter-spacing:.02em; }
.fphead { display:flex; align-items:center; gap:6px; color:var(--text-2); font-size:12.5px; margin-bottom:5px; }
.chain { margin:10px 0 0; padding:0; list-style:none; font-size:12.5px; }
.chain li { height:22px; display:flex; align-items:center; gap:7px; white-space:nowrap; }
.chain li .mono { font-size:11.5px; color:var(--text); }
.chain li .d { color:var(--text-2); }
.chain li .tick { width:9px; height:11px; border-left:1px solid var(--seam-2); border-bottom:1px solid var(--seam-2); margin-top:-8px; flex:none; }
.chain li.l1 { padding-left:8px; } .chain li.l2 { padding-left:24px; }
.chain li svg { color:var(--text-2); }

/* SSH: route line + jump list */
.route { display:flex; align-items:center; flex-wrap:wrap; gap:6px; color:var(--text-2); font-size:12px; }
.route .mono { font-size:11.5px; color:var(--text); }
.route svg { color:var(--text-2); }
.hops { display:flex; flex-direction:column; gap:6px; flex:1; min-width:0; }
.hop { display:flex; align-items:center; gap:8px; }
.hop .ix { font:400 11px "Fragment Mono", monospace; color:var(--text-2); width:12px; text-align:right; flex:none; }

/* PopupMenu (existing): min 200px, rows 24px, radius 6, popover shadow */
.menu { position:absolute; z-index:60; min-width:200px; padding:4px; background:var(--raised); border:1px solid var(--seam-2); border-radius:6px; box-shadow:var(--shadow-pop); --text-3:var(--text-2); outline:none; }
.menu .mi { height:24px; display:flex; align-items:center; gap:12px; padding:0 10px; border-radius:3px; cursor:default; white-space:nowrap; color:var(--text); font-size:13px; }
.menu .mi .ck { width:12px; color:var(--blue); display:flex; }
.menu .mi .h { color:var(--text-2); font-size:12px; margin-left:auto; padding-left:16px; }
.menu .mi .k { font:400 11px "Fragment Mono", monospace; color:var(--text-2); margin-left:auto; padding-left:16px; }
.menu .mi.on { background:var(--hover); }
.menu .mi.dis { color:var(--text-2); }
.menu .mi.danger { color:var(--red); }
.menu .mi.mono2 .lab { font:400 12px "Fragment Mono", monospace; }
.menu .sep { height:1px; background:var(--seam); margin:4px 0; }
.menu .mh { padding:4px 10px 4px; color:var(--text-2); font-size:12px; }

/* Popover explanation (unencrypted badge) */
.pop { position:absolute; z-index:45; width:300px; padding:10px 12px; background:var(--raised); border:1px solid var(--seam-2); border-radius:6px; box-shadow:var(--shadow-pop); font-size:12.5px; color:var(--text-2); line-height:1.4; --text-3:var(--text-2); }
.pop b { color:var(--text); font-weight:600; display:flex; gap:7px; align-items:center; margin-bottom:4px; font-size:13px; }
.pop p { margin:0 0 6px; }

/* Toast (existing) + NEW sticky variant with actions */
.toasts { position:absolute; right:12px; bottom:36px; display:flex; flex-direction:column; gap:8px; z-index:50; }
.toast { width:320px; padding:8px 12px; background:var(--raised); border:1px solid var(--seam-2); border-radius:6px; box-shadow:var(--shadow-pop); display:flex; gap:8px; align-items:flex-start; font-size:12.5px; color:var(--text); --text-3:var(--text-2); }
.toast.wide { width:380px; }
.toast > svg { margin-top:1px; color:var(--text-2); }
.toast > svg.ok { color:var(--green); }
.toast .tb { flex:1; min-width:0; line-height:1.4; }
.toast .tb .t1 { font-weight:600; }
.toast .tb .l2 { color:var(--text-2); }
.toast .tb .mono { font-size:11.5px; overflow-wrap:anywhere; }
.toast .tb ul { margin:4px 0 0; padding:0 0 0 0; list-style:none; color:var(--text-2); }
.toast .tb li { display:flex; gap:6px; align-items:flex-start; }
.toast .tb li::before { content:""; width:3px; height:3px; background:var(--text-2); flex:none; margin-top:7px; }
.toast .acts { display:flex; gap:6px; margin-top:8px; }
.toast .x { border:0; background:transparent; padding:2px; color:var(--text-2); cursor:pointer; border-radius:3px; }
.toast .x:hover { color:var(--text); background:var(--hover); }

/* ───────── Mock notes drawer (mock only) ───────── */
.notes { position:fixed; top:34px; right:0; bottom:0; width:420px; z-index:80; background:var(--gutter); border-left:1px dashed var(--seam-2);
  display:none; flex-direction:column; font-size:12.5px; color:var(--text); }
.notes.on { display:flex; }
.notes .nh { height:30px; display:flex; align-items:center; gap:8px; padding:0 10px 0 12px; border-bottom:1px solid var(--seam); flex:none; }
.notes .nh .tag { font:400 11px "Fragment Mono", monospace; color:var(--text-2); border:1px dashed var(--seam-2); border-radius:3px; padding:1px 5px; }
.notes .nbody { overflow:auto; padding:10px 12px 20px; }
.notes h3 { margin:12px 0 6px; font-size:13.5px; color:var(--text-2); font-variant-caps:all-small-caps; letter-spacing:.075em; font-weight:600; }
.notes h3:first-child { margin-top:2px; }
.notes ul { margin:0; padding-left:16px; color:var(--text); line-height:1.45; }
.notes li { margin-bottom:4px; }
.notes li code, .notes p code { font:400 11.5px "Fragment Mono", monospace; color:var(--text); }
.notes p { margin:0 0 6px; color:var(--text-2); line-height:1.45; }
.notes table { width:100%; border-collapse:collapse; font-size:12px; table-layout:fixed; }
.notes td { border-top:1px solid var(--seam); padding:4px 4px 4px 0; vertical-align:top; overflow-wrap:anywhere; }
.notes td.k { font:400 11px "Fragment Mono", monospace; color:var(--text-2); width:30%; }
.notes td.en { color:var(--text-2); width:33%; }
.notes .por { font:400 10.5px "Fragment Mono", monospace; color:var(--amber); border:1px dashed var(--amber); border-radius:3px; padding:0 3px; white-space:nowrap; margin-left:4px; }
.notes .sample { display:flex; gap:6px; align-items:center; margin:6px 0; }
.notes .sample code { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:400 11px "Fragment Mono", monospace; border:1px solid var(--seam-2); border-radius:3px; padding:3px 5px; }

/* ═══════════════════════════════════════════════════════════════
   M2b additions. Everything above this line is the M2a mock's CSS,
   copied unchanged except two rules marked "M2b". Everything below
   reuses harman tokens only; NOTES.md lists each one.
   ═══════════════════════════════════════════════════════════════ */

/* Linux window chrome (vault scenarios): no traffic lights, controls on the right */
.titlebar.linux .lights { display:none; }
.wctl { display:flex; gap:2px; margin-left:6px; }
.wctl span { width:28px; height:24px; display:flex; align-items:center; justify-content:center; border-radius:4px; color:var(--text-2); }

/* Dialog bodies scroll when the window is short; 480 rows use a 120px label column */
.dlg .dbody { overflow:auto; min-height:0; }
.dlg.w480 .frow, .dlg.w480 .hintrow, .dlg.w420 .frow, .dlg.w420 .hintrow { grid-template-columns:120px 1fr; }
.dlg .dbody p.small { font-size:12.5px; }
.dlg .lead { color:var(--text-2); font-size:13px; margin:0 0 6px; }
.static { font:400 12px "Fragment Mono", monospace; color:var(--text); overflow-wrap:anywhere; }
.btn.danger[disabled], .btn.danger[disabled]:hover { color:var(--text-3); border-color:var(--seam-2); background:transparent; }

/* Key comparison: two fingerprint insets, labelled by fact, no hue */
.fpstack { display:flex; flex-direction:column; gap:8px; margin:2px 0 10px; }
.fphead .alg { font:400 11.5px "Fragment Mono", monospace; color:var(--text); }
.fphead .btn.icon { height:20px; margin:-3px -5px -3px 0; }
.src { display:flex; gap:6px; align-items:baseline; margin-top:6px; padding-top:6px; border-top:1px solid var(--seam); font-size:12px; color:var(--text-2); }
.src .mono { font-size:11.5px; color:var(--text); }

/* Copyable command (ssh-keygen -R) and SQL snippet: the fingerprint-inset anatomy */
.cmd { display:flex; align-items:center; gap:8px; }
.cmd code { flex:1; min-width:0; font:400 11.5px/17px "Fragment Mono", monospace; color:var(--text); overflow-wrap:anywhere; }
/* SQL inset: Task 5's remediation() string as is. One block per line; a long line wraps inside the inset (no clip,
   no horizontal scroll) and lines are 4px apart, so a wrapped continuation reads as part of its statement. */
:root, :root[data-theme="dark"] { --syn-cm:#828A96; }
:root[data-theme="light"] { --syn-cm:#7C7C86; }
.sql { margin:0; font:400 11.5px/17px "Fragment Mono", monospace; color:var(--text); }
.sql .sl { white-space:pre-wrap; overflow-wrap:anywhere; padding-left:2ch; text-indent:-2ch; }   /* wrapped continuations hang 2ch (N2) */
.sql .sl + .sl { margin-top:4px; }
.sql .kw { color:var(--syn-kw); }
.sql .str { color:var(--syn-str); }
.sql .phd { color:var(--text-2); font-style:italic; }
.sql .cm { color:var(--syn-cm); font-style:italic; }
/* Role-probe findings in the popover: the sticky-toast list anatomy (3px square text-2 bullets) */
.pop .warns { margin:0 0 6px; padding:0; list-style:none; }
.pop .warns li { display:flex; gap:7px; align-items:flex-start; color:var(--text); font-size:12px; line-height:1.4; }
.pop .warns li::before { content:""; width:3px; height:3px; background:var(--text-2); flex:none; margin-top:7px; }
.pop .warns li + li { margin-top:2px; }
.pop .warns .mono { font-size:11.5px; }
.pop .nofix { margin:0; }
.pop:focus { outline:none; }
.pop:focus-visible { outline:1px solid var(--blue); outline-offset:1px; }
.cp-ro:focus-visible { outline:1px solid var(--blue); outline-offset:-2px; }

/* Keyboard-interactive: server text in its own field, prompts stacked (labels are server text too) */
.srv .cap2 { color:var(--text-2); font-size:12px; margin-bottom:4px; }
/* The caption stays put; only the server's text scrolls, capped at 119px = 7 mono lines (the whole inset stays ≤ 160px),
   with M2a's 4px seam-strong thumb (N4). A hostile or chatty server can't push the prompts out of the dialog. */
.srvscroll { max-height:119px; overflow-y:auto; padding-right:6px; }
/* M2a's scroll thumb (DESIGN.md "Minimum window"): 4px, seam-strong, radius 3, no track */
.srvscroll::-webkit-scrollbar, .pop .pbody::-webkit-scrollbar { width:4px; }
.srvscroll::-webkit-scrollbar-track, .pop .pbody::-webkit-scrollbar-track { background:transparent; }
.srvscroll::-webkit-scrollbar-thumb, .pop .pbody::-webkit-scrollbar-thumb { background:var(--seam-2); border-radius:3px; }
/* Popover height cap (N5): title and Copy SQL stay in view, the body scrolls */
.pop { display:flex; flex-direction:column; }
.pop > b { flex:none; }
.pop .pbody { flex:1 1 auto; min-height:0; overflow-y:auto; margin-right:-6px; padding-right:6px; }
.pop .pacts { flex:none; margin-top:6px; }
.srvtext { font:400 11.5px/17px "Fragment Mono", monospace; color:var(--text); white-space:pre-wrap; overflow-wrap:anywhere; }
.srvtext + .srvtext { margin-top:4px; color:var(--text-2); }
.srvtext.none { font-family:"Source Sans 3", system-ui, sans-serif; font-size:12.5px; color:var(--text-2); }
.kp { margin-top:10px; }
.kp .kl { display:block; font:400 11.5px/16px "Fragment Mono", monospace; color:var(--text); white-space:pre-wrap; overflow-wrap:anywhere; margin-bottom:4px; }
.kp .in { width:100%; }
.metaline { display:flex; flex-wrap:wrap; gap:4px 12px; align-items:center; margin-top:10px; font-size:12px; color:var(--text-2); }
.metaline .lft { display:flex; gap:6px; align-items:center; color:var(--text); }

/* Hop route: the current hop is boxed (no hue); in errors each hop shows done / failed / pending */
.route .cur { border:1px solid var(--seam-2); border-radius:3px; padding:0 4px; }
.route .dim { color:var(--text-2) !important; }
.hroute { display:flex; align-items:center; flex-wrap:wrap; gap:4px 6px; margin-top:6px; font-size:12px; color:var(--text-2); }
.hroute .h { display:flex; align-items:center; gap:5px; height:20px; }
.hroute .h .mono { font-size:11.5px; }
.hroute .h.done svg { color:var(--green); }
.hroute .h.done .mono { color:var(--text); }
.hroute .h.fail .mono { color:var(--text); font-weight:600; }
.hroute .h.fail svg { color:var(--text); }
.hroute .h.pend .dot { width:7px; height:7px; border:1px solid var(--seam-2); display:block; }
.rs { display:flex; align-items:center; gap:6px; white-space:nowrap; }     /* an arrow travels with the stop after it */

/* ═══════════════════════════════════════════════════════════════
   M3a additions. Everything above this line is the M2b mock's CSS

/* Mock frame: a two-row mock bar; the window can be pinned to 1280 × 800 or 960 × 600 (mock only) */

.mockbar { height:auto; flex-direction:column; align-items:stretch; gap:0; padding:0; }

.sketch { font:400 10.5px "Fragment Mono", monospace; color:var(--text-2); border:1px dashed var(--seam-2); border-radius:3px; padding:0 4px; white-space:nowrap; }
.mocknote { position:absolute; z-index:70; font:400 11px/1.35 "Fragment Mono", monospace; color:var(--text-2); border:1px dashed var(--seam-2); border-radius:4px; padding:6px 8px; background:var(--gutter); pointer-events:none; }

/* Centre column: the 322 px editor tile over the results tile (shell/tiles.rs) */
.col.center { grid-template-rows:322px 1fr; }

/* Console tabs (harman tabs; the active tab joins the raised toolbar) */
.etabs { height:30px; flex:none; display:flex; align-items:stretch; border-bottom:1px solid var(--seam); background:var(--head); white-space:nowrap; position:relative; }
.etabs .tabs { display:flex; align-items:stretch; min-width:0; overflow:hidden; }
.tab { display:flex; align-items:center; gap:7px; padding:0 10px 0 12px; height:30px; color:var(--text-2); border-right:1px solid var(--seam); cursor:pointer; font-size:13px; position:relative; flex:none; }

/* Production hairline: 1 px red across the top of an editor pane bound to production (harman .editor::before) */

.lines { position:relative; flex:1; min-width:0; overflow:hidden; color:var(--syn-id); }

.lines .bands { z-index:0; }

.caret { position:absolute; top:1px; width:2px; height:16px; background:var(--blue); z-index:3; }

@media (prefers-reduced-motion: reduce) { .caret.blink { animation:none; } }
.ime { text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:3px; text-decoration-color:var(--text); }

.lines .phold { color:var(--text-3); font-family:"Source Sans 3", system-ui, sans-serif; font-size:13px; }
/* Syntax classes, scoped to the code area (the status bar's segments are also ".s") */

:root[data-theme="light"] .xc { background:var(--seam-soft); }
.xd { color:var(--syn-com); font-style:normal; }
.ctl { font:400 11px/14px "Fragment Mono", monospace; color:var(--text-2); background:var(--seam-soft); border-radius:3px; padding:0 2px; margin:0 1px; vertical-align:1px; }
/* End-of-line status (harman .eol): micro 11.5 text-3, numbers in mono 11; on the panel, never on raised */

.hscroll { position:absolute; left:calc(58px + var(--gx, 0) * 1ch); right:0; bottom:0; height:8px; }

/* Inline notice inside the editor tile (DESIGN.md Inline notice; panel well, so text-3 allowed but not needed) */
.edbanner { margin:8px 10px 2px 10px; }
.edbanner .notice { padding:6px 10px; }

/* Results tile */
.rtabs { display:flex; height:30px; align-items:stretch; }
.rtab { display:flex; align-items:center; gap:7px; padding:0 12px; color:var(--text-2); cursor:pointer; border-right:1px solid var(--seam); position:relative; font-size:13px; flex:none; }
.rtab:hover { color:var(--text); background:var(--hover); }

.rbody { flex:1; min-height:0; display:flex; flex-direction:column; position:relative; }

.gridwrap { position:relative; flex:1; overflow:hidden; min-height:0; }
.grid { position:absolute; left:0; top:0; right:9px; bottom:0; overflow:hidden; font-size:13px; }
.gh, .gr { display:flex; position:relative; }

.gr { height:21px; }

.gc > .v { overflow:hidden; text-overflow:ellipsis; min-width:0; }

.gh .gc .hn { display:flex; align-items:center; gap:6px; font-weight:600; color:var(--text); line-height:15px; overflow:hidden; }
.gh .gc .hn span { overflow:hidden; text-overflow:ellipsis; }
.gh .gc .ht { display:block; font:400 11px/13px "Fragment Mono", monospace; color:var(--text-3); margin-top:1px; overflow:hidden; text-overflow:ellipsis; }
.gh .gc.num .hn { justify-content:flex-end; } .gh .gc.num .ht { text-align:right; }

.gc.rn { width:var(--rnw, 46px); justify-content:flex-end; color:var(--text-3); background:var(--gutter); font-size:11.5px; padding-right:9px; padding-left:4px; border-right:1px solid var(--seam); }
.gh .gc.rn { background:var(--head); }

.gc.num { justify-content:flex-end; }
.gc.ctr { justify-content:center; }
.gr:hover .gc { background:var(--hover); }

.gc.insel, .gr:hover .gc.insel { background:var(--blue-a); }

.gc.rn.selrn { color:var(--blue); }
.gh .gc.colsel { background:var(--blue-a); }
.gc.frz { border-right-color:var(--seam-2); }
.null { font-variant-caps:all-small-caps; letter-spacing:.08em; color:var(--text-3); font-weight:600; font-size:13px; }
.empty { font:400 11.5px "Fragment Mono", monospace; color:var(--text-3); }
.ts { font:400 11.5px "Fragment Mono", monospace; color:var(--text-2); }
.gm { font:400 11.5px "Fragment Mono", monospace; color:var(--text); }
.trc { flex:none; font:400 11px/14px "Fragment Mono", monospace; color:var(--text-2); border:1px solid var(--seam-2); border-radius:3px; padding:0 4px; }
.derr { display:flex; align-items:center; gap:5px; color:var(--text-2); }
.derr svg { color:var(--text); }
.sk { display:block; height:7px; border-radius:0; background:var(--seam-soft); }
:root[data-theme="light"] .sk { background:var(--seam); }
.gnorows { position:absolute; left:0; right:0; top:44px; text-align:center; color:var(--text-3); font-size:12.5px; }
.selbox { position:absolute; border:1px solid var(--blue); pointer-events:none; z-index:3; }
.selbox::after { content:""; position:absolute; right:-3px; bottom:-3px; width:5px; height:5px; background:var(--blue); border:1px solid var(--panel); }
.vscroll { position:absolute; right:0; top:37px; bottom:0; width:9px; border-left:1px solid var(--seam); background:var(--gutter); }
.vscroll .thumb { position:absolute; left:2px; right:2px; border-radius:3px; background:var(--text-3); opacity:.6; }
.vscroll .pref { position:absolute; left:3px; right:3px; border-radius:0; background:var(--green-fill); opacity:.6; }
/* Cursor strip (harman .gfoot): 26 px, raised, caption text-2 */
.strip { height:26px; flex:none; display:flex; align-items:center; gap:8px; padding:0 10px 0 12px; border-top:1px solid var(--seam); background:var(--raised); color:var(--text-2); font-size:12px; white-space:nowrap; --text-3:var(--text-2); overflow:hidden; }

.menu.chooser { width:460px; max-width:calc(100% - 16px); }
.menu.chooser .mi { gap:10px; }
.menu.chooser .mi .kind { flex:none; width:128px; overflow:hidden; text-overflow:ellipsis; }
.menu.chooser .mi .lab { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; font:400 12px "Fragment Mono", monospace; color:var(--text-2); }
.menu.chooser .mi .cnt { flex:none; color:var(--text-2); font-size:12px; }
.menu.chooser .mi.on { background:var(--blue-a2); }
.menu.chooser .mi.on .lab { color:var(--text); }
.menu .mfoot { display:flex; align-items:center; gap:12px; height:24px; margin:4px -4px -4px; padding:0 10px; border-top:1px solid var(--seam); color:var(--text-2); font-size:11.5px; background:var(--head); border-radius:0 0 6px 6px; }
.menu .mfoot span { display:flex; align-items:center; gap:5px; }
.menu .mfoot kbd { color:var(--text-2); }
.menu .unc { padding:6px 10px 8px; font-size:12.5px; color:var(--text-2); line-height:1.4; white-space:normal; }
.menu .unc b { display:flex; align-items:center; gap:7px; color:var(--text); font-weight:600; font-size:13px; margin-bottom:4px; }
.menu .unc b svg { color:var(--text); }
.menu .unc .r { color:var(--text); margin:0 0 4px; }
.menu .unc .mono { font-size:11.5px; }
.menu .mi .k2 { display:flex; gap:3px; margin-left:auto; padding-left:16px; }
.menu .mi.dis .k { color:var(--text-3); }
.menu .mi .sk2 { margin-left:8px; }
/* Tooltip on the gutter (popover anatomy) */
.tip { position:absolute; z-index:46; width:320px; padding:8px 10px; background:var(--raised); border:1px solid var(--seam-2); border-radius:6px; box-shadow:var(--shadow-pop); font-size:12.5px; color:var(--text-2); line-height:1.4; --text-3:var(--text-2); }
.tip .th { display:flex; align-items:center; gap:7px; color:var(--text); font-weight:600; font-size:13px; }
.tip .th .chip { font:400 11px/14px "Fragment Mono", monospace; border:1px solid var(--seam-2); border-radius:3px; padding:0 4px; color:var(--text); font-weight:400; }
.tip .srvbox { margin:6px 0 6px; padding:6px 8px; border:1px solid var(--seam-2); border-radius:4px; background:var(--panel); }
:root[data-theme="light"] .tip .srvbox { background:var(--ground); }
.tip .srvbox .cap2 { font-size:12px; color:var(--text-2); margin-bottom:2px; }
.tip .srvbox code { font:400 11.5px/17px "Fragment Mono", monospace; color:var(--text); white-space:pre-wrap; overflow-wrap:anywhere; }
.tip .row2 { display:flex; align-items:center; gap:7px; color:var(--text); }
.tip .row2 + .row2 { margin-top:4px; }
.tip .row2 .g { color:var(--green); display:flex; }
.tip .row2 .mono { font-size:11px; color:var(--text-2); }
.tip .hint { margin-top:2px; font-size:12px; }
/* Copy toasts reuse the Toast; the IME candidate window is the OS's (mock annotation only) */
.candwin { position:absolute; z-index:44; width:190px; padding:4px; border:1px dashed var(--seam-2); border-radius:6px; background:var(--gutter); font:400 12px/20px "Source Sans 3", sans-serif; color:var(--text-2); }
.candwin div { padding:0 6px; }
.candwin .on { background:var(--hover); color:var(--text); border-radius:3px; }
.candwin .cap3 { font:400 10.5px "Fragment Mono", monospace; color:var(--text-2); padding:0 6px 2px; }
/* Dialog footers for the open-transaction prompt */
.dlg .dfoot .btn.cancel { min-width:72px; justify-content:center; }
</style>

/* ═════════════ Lexer (mock stand-in for sql-lexer TokenClass) ═════════════ */
const KW = new Set("SELECT FROM WHERE AND OR NOT IN AS JOIN ON GROUP BY ORDER LIMIT DESC ASC INSERT INTO VALUES UPDATE SET DELETE BEGIN COMMIT ROLLBACK CREATE FUNCTION RETURNS LANGUAGE TABLE WITH INTERVAL NULL IS CASE WHEN THEN ELSE END VACUUM ANALYZE DISTINCT HAVING LEFT INNER UNION ALL EXISTS BETWEEN LIKE TRUE FALSE SHOW SQL_NO_CACHE".split(" "));
const asciiUpper = w => w.replace(/[a-z]/g, c => String.fromCharCode(c.charCodeAt(0) - 32));      /* INV-3: ASCII casing only */
function lexLine(s, st) {
  const out = [], n = s.length; let i = 0, m;
  const push = (c, x) => { if (x) out.push([c, x, st.xc]); };
  while (i < n) {
    const rest = s.slice(i), ch = s[i];
    if (st.com) { const j = s.indexOf("*/", i); if (j < 0) { push("c", rest); i = n; } else { push("c", s.slice(i, j + 2)); i = j + 2; st.com = false; } continue; }
    if (st.xc && rest.startsWith("*/")) { push("xd", "*/"); st.xc = false; i += 2; continue; }
    if (rest.startsWith("--")) { push("c", rest); break; }
    if ((m = /^\/\*!\d*/.exec(rest))) { st.xc = true; push("xd", m[0]); i += m[0].length; continue; }
    if (rest.startsWith("/*")) { const j = s.indexOf("*/", i + 2); if (j < 0) { push("c", rest); st.com = true; i = n; } else { push("c", s.slice(i, j + 2)); i = j + 2; } continue; }
    if (ch === "'") { let j = i + 1; while (j < n) { if (s[j] === "'") { if (s[j + 1] === "'") { j += 2; continue; } break; } j++; } const e = Math.min(j + 1, n); push("s", s.slice(i, e)); i = e; continue; }
    if (ch === '"') { const j = s.indexOf('"', i + 1), e = j < 0 ? n : j + 1; push("qi", s.slice(i, e)); i = e; continue; }
    if ((m = /^\d+(\.\d+)?/.exec(rest))) { push("n", m[0]); i += m[0].length; continue; }
    if ((m = /^[A-Za-z_À-ɏ][\wÀ-ɏ]*/.exec(rest))) { const w = m[0]; push(KW.has(asciiUpper(w)) ? "k" : s[i + w.length] === "(" ? "f" : "id", w); i += w.length; continue; }
    if ((m = /^@@?\w+/.exec(rest))) { push("id", m[0]); i += m[0].length; continue; }
    if ((m = /^\s+/.exec(rest))) { push("ws", m[0]); i += m[0].length; continue; }

}
/* tokens → HTML, split at decoration boundaries (IME clauses, control glyphs) */
function lineHTML(tokens, decos = []) {
  let pos = 0, h = "";
  for (const [c, x, xc] of tokens) {
    let a = 0;
    while (a < x.length) {
      const abs = pos + a, d = decos.find(d => abs >= d.from && abs < d.to);
      const bounds = decos.flatMap(d => [d.from - pos, d.to - pos]).filter(b => b > a && b < x.length);
      const end = bounds.length ? Math.min(...bounds) : x.length, piece = x.slice(a, end);
      const inner = esc(piece).replace(/\u0000/g, `<span class="ctl">NUL</span>`);
      const cls = [c === "id" || c === "ws" ? "" : c, xc ? "xc" : "", d ? d.cls : ""].filter(Boolean).join(" ");
      h += cls ? `<span class="${cls}">${inner}</span>` : inner;
      a = end;
    }
    pos += x.length;
  }
  return h;
}

const NOTES = {
  editor:{ intent:"The console is a real editor bound to one connection. It shows where you are (environment, connection), what you typed (lexical colour), and where the caret is, without any ambient motion.",
    points:["Lexical colours are DESIGN.md's syntax tokens. Comments are italic. A MySQL executable comment (/*! … */) is code, so it keeps code colours on the inlay well (seam-soft) with its delimiters in comment ink, not italic.","Turkish identifiers (\"müşteri adı\") and strings ('İzmir', 'Şanlıurfa') are data: lexed as written, never case-folded.","Focused: a 2 × 16 px blue caret and a blue-tint-strong selection. Unfocused: no caret and a neutral seam-strong selection (macOS's inactive selection), so it never reads as the Run preview.","The gutter is 58 px for up to 3 digits and grows by one Fragment Mono advance per extra digit (4, 5 and 7-digit scenarios). The current line number is text ink; the others text-3 on the panel.","IME: the composition carries a 1 px text underline and the active clause 2 px. The OS draws the candidate window under the composed range (bounds_for_range); the dashed box only marks where it goes.","Empty bound console: one quiet placeholder line in text-3 with the Run chord; it disappears with the first keystroke.","Production: a 1 px red hairline over the whole pane, the 7 px swatch on the tab, the connection name in mono, and the read-only notice in the toolbar. No filled block.","An unbound console is exactly the M2 home (R-M3-37)."] },
  toolbar:{ intent:"Run and Stop, where it runs (the connection label) and whether it can write, on one 32 px raised bar that never truncates a label.",
    points:["Run is the one primary button. While running it becomes Stop (an outline button, square icon, ⌘.), followed by the 7 px amber run marker, Running and a mono clock that repaints once a second. The slot keeps its width so nothing jumps.","After Stop: Cancelling… with a hollow amber marker; Stop is disabled until the server answers. Never red (Hue Is Meaning).","The connection label is the env mark plus the name in mono; the database follows after a chevron and is the first thing to hide when the bar is short.","A read-only connection shows its M2b access label as a lock chip (lock in text-2). Production shows the notice \"Production is read-only in this version\" with a red lock; it opens a 300 px explanation popover.","Waiting: \"Waiting for a free connection to orders-dev (4 of 4 in use)\" with a hollow pending marker and Cancel; Run is disabled.","Overflow Rule at 960 in Turkish: the database crumb hides first, then the notice collapses to the lock chip and its explanation moves into the ⋯ menu, then the waiting sentence takes its short form. No label ever truncates."] },
  preview:{ intent:"Before you press Run you can see exactly what it would send. Uncertain boundaries are drawn as uncertain and send nothing.",
    points:["A statement that owns its lines gets harman's full-row band (blue-tint at .55 dark / .8 light) and a 1 px blue gutter bar.","Two statements on one line: the exact-range tint, on the statement's characters only, without the terminator (the strict range is what is sent). A full row there would claim the other statement runs too (rejected variant shown).","A selection runs as separate statements: one gutter bar per unit with a 2 px gap, and 1 of 3 / 2 of 3 / 3 of 3 at the end of each unit's first line.","Ask, preselected: the band shows the candidate Enter would run, and \"2 choices\" at the end of its line says Run will ask.","Nothing: no band; the status bar says \"Nothing to run here\".","Uncertain: a neutral (hover) fill with a dashed text-2 gutter bar and \"boundary uncertain\" with the ink alert glyph. Never blue, because nothing runs.","No connection: the same geometry in the neutral fill with a text-3 bar and \"not connected\".","While a composition is active the preview is frozen at its last resolved range; it resolves again after the commit."] },
  chooser:{ intent:"When Run has more than one candidate (D-011), a popup at the caret lists them in resolve order and previews each one; Enter runs the highlighted item.",
    points:["PopupMenu anatomy (raised, 6 px, popover shadow) at EditorView::caret_bounds(). A header line, then 24 px rows: the kind (Statement, Largest statement, From caret, Whole script) and the whitespace-collapsed SQL label in mono, ellipsized; multi-statement items add the count.","No access keys: labels are SQL; typing a letter never runs anything (P15).","The kind remembered for this console carries the blue check and starts highlighted.","Hover or ↑↓ moves the preview band to that candidate; Escape restores it.","Boundary uncertain: no run item at all. The popup says why and how to run exactly a selection (R-M3-24)."] },
  gutter:{ intent:"Every statement you ran keeps its outcome in the gutter and at the end of its first line, in words as well as glyphs.",
    points:["Queued: a 7 px hollow seam-strong square. Running: the 7 px amber run marker and \"running · 3 s\" (once a second; nothing under 50 ms).","Succeeded: green check, a 1 px green bar over the statement, \"executed · 42 ms · 100 rows\". DML: \"12 rows affected · 38 ms\".","Failed: the ink alert glyph, \"failed\" and the SQLSTATE chip. Its tooltip shows the server message verbatim in its own mono field. Never red.","Cancelling: a hollow amber square. Cancelled: the ban glyph in text-2. Skipped (StopOnError, R-M3-26): skip-forward in text-2.","Stale: the check and bar dim to text-3 with \"edited since execution\".","Two marks on one row: the worse glyph with a 3 px text-2 dot; the end of line lists both; the tooltip lists both.","A long line (or a narrow window): when the status would come within 12 px of its line's text it moves onto a panel pad over the line's tail and shows its short form; the full text is in the tooltip and the Output tab."] },
  status:{ intent:"The status bar follows the focused console and its active result tab (Status Follows The Tab), and says when a transaction or a cursor is open.",

    { label:t("hv-console-run"), k:KEY_RUN, act:"run" }, { label:t("hv-editor-describe-range"), act:"describe" }, { sep:true }, { label:t("hui-editor-find"), k:"⌘F", dis:true, sketch:true }];

/* ═════════════ Flows ═════════════ */
function runNow(k, units) {
  const c = conn(k.conn);
  if (W.live[c.id] !== "connected") { W.sbmsg = t("hv-console-connect-first", { name:c.id }); W.live[c.id] = "connecting"; renderWork(); later(() => { W.live[c.id] = "connected"; W.sbmsg = null; k.ed.preview = { ...k.ed.preview, kind:"band", hints:{ 0:"choices" } }; renderWork(); }, 1400); return; }
  const isWrite = units.some(u => /^\s*(UPDATE|INSERT|DELETE)/.test(k.ed.lines[u.a.l].slice(u.a.c)));
  if (c.env === "production" && isWrite) {
    k.ed.marks = k.ed.marks.filter(m => !units.some(u => u.a.l === m.l)).concat(units.map(u => ({ l:u.a.l, st:"deny", eol:{ k:"denied" } })));

    k.res.log.push({ g:"deny", k:"exec-deny-read-only-input" }); k.res.active = "out"; renderWork(); return;
  }

  later(() => { const R = k.res.results.r1; R.state = "streaming"; R.loaded = 3500; renderWork(); }, 1300);
  later(() => { if (k.tb.state !== "running") return; k.tb = { state:"idle" }; clearInterval(TICK);
    k.ed.marks = units.map(u => ({ l:u.a.l, st:"ok", range:[u.a.l, u.b.l], eol:{ k:"rows", rows:nf(10000) + "+", ms:2131 } }));
    const R = k.res.results.r1; R.state = "suspended"; R.loaded = 10000; R.ms = 2131; k.res.log.push({ g:"ok", k:"exec-rows-retrieved-more", v:{ rows:10000, duration:2131 } }); renderWork(); }, 2600);
}
function doRun() {
  const k = K(); if (!k || !k.conn || k.tb.state === "running" || k.tb.state === "waiting") return;
  const E = k.ed;
  if (E.sel) return runNow(k, E.preview ? E.preview.units : []);
  if (E.preview && E.preview.kind === "unc") return openChooser(true);
  if (!E.preview) { W.sbmsg = t("hv-editor-nothing-to-run"); renderStatus(); return; }
  if (E.preview.hints && E.preview.hints[0] === "choices") return openChooser(false);

}
function doStop() {
  const k = K(); if (k.tb.state !== "running") return; clearTimers(); k.tb = { state:"cancelling", elapsed:k.tb.elapsed };
  k.ed.marks.forEach(m => { if (m.st === "run") { m.st = "cancelling"; m.eol = { k:"cancelling" }; } }); renderWork();
  later(() => { k.tb = { state:"idle" }; k.ed.marks.forEach(m => { if (m.st === "cancelling") { m.st = "cancelled"; m.eol = { k:"cancelled", ms:(k.tb.elapsed || 3) * 1000 + 212 }; } });
    const R = k.res.results.r1; if (R) { R.state = "cancelled"; R.loaded = R.loaded || 3500; } k.res.log.push({ g:"cancel", k:"exec-cancelled", v:{ duration:3212 } }); renderWork(); }, 900);
}
function closeMenu() { const M = W.menu; if (M && M.type === "chooser") { K().ed.preview = M.savedPreview; W.menu = null; renderEditor(); } W.menu = null; renderMenus(); }
function pickMenu(i) {
  const M = W.menu, it = M.items[i]; if (!it || it.sep || it.dis) return;
  if (M.type === "chooser") { W.menu = null; renderMenus(); return runNow(K(), it.units); }
  closeMenu();
  if (it.act === "run") doRun();
  if (it.act === "describe") { W.sbmsg = t("hv-editor-describe-one", { from:nf(12), to:nf(14), label:"SELECT o.id, c.full_name, c.city, o.total, o.placed_at, …" }); renderStatus(); }
  if (it.act === "prodPop") { W.pop = "prod"; renderEditor(); renderMenus(); }
  if (it.act === "copyText") toast(`<div>${te("hui-editor-copy")} ✓</div>`, { icon:"copy" });
}
function previewChooser(i) { const M = W.menu; if (!M || M.type !== "chooser") return; M.active = i; K().ed.preview = { kind:"band", units:M.items[i].units }; renderEditor(); renderMenus(); }

/* ═════════════ Events ═════════════ */
const ACT = {
  surf: a => go(+a.dataset.i), scen: a => go(S.surface, a.dataset.k),
  lang: a => { LANG = a.dataset.v; rerender(); }, theme: a => { S.theme = a.dataset.v; rerender(); },
  toggleLang: () => { LANG = LANG === "en" ? "tr" : "en"; rerender(); },
  notes: () => { S.notes = !S.notes; renderMockbar(); renderNotes(); syncUrl(); },
  size: a => { S.size = a.dataset.v; rerender(); }, blink: a => { S.blink = a.dataset.v === "1"; rerender(); },
  run: () => doRun(), stop: () => doStop(),
  ktab: a => { W.active = a.dataset.id; W.pop = null; W.sbmsg = null; renderWork(); },
  kclose: (a, e) => { e.stopPropagation(); const k = W.consoles.find(x => x.id === a.dataset.id); if (k.tx) { W.layers = [{ type:"txclose", console:k.id, quit:false }]; renderLayers(); focusInitial(); } else toast(`<div>${te("hui-tab-close")}: ${esc(tabTitle(k))}</div>`, { icon:"x" }); },
  rtab: a => { const k = K(); k.res.active = a.dataset.id; if (a.dataset.id === "out") k.res.tabs[0].unread = false; renderResults(); renderStatus(); },
  prodPop: (a, e) => { e?.stopPropagation(); W.pop = W.pop === "prod" ? null : "prod"; renderEditor(); renderMenus(); if (W.pop) $("pop")?.focus({ preventScroll:true }); },
  ovf: (a, e) => { e?.stopPropagation(); if (W.menu && W.menu.type === "ovf") closeMenu(); else openOvf(); },
  waitCancel: () => { const k = K(); k.tb = { state:"idle" }; renderWork(); },
  closeCursor: () => { const R = KR() || Object.values(K().res.results).find(r => r.state === "suspended" || r.state === "memory"); if (!R) return; R.state = "closed"; R.reason = "user-closed"; R.rolledBack = false; renderResults(); renderStatus(); },
  fetchMore: () => { const R = KR(); R.loaded += 10000; R.state = "streaming"; renderResults(); renderStatus(); later(() => { R.state = "suspended"; renderResults(); renderStatus(); }, 700); },
  fetchAll: () => { const R = KR(); R.state = "streaming"; R.loaded = 180000; renderResults(); renderStatus(); later(() => { R.state = "memory"; R.loaded = 412880; renderResults(); renderStatus(); }, 1100); },
  fetchAnyway: () => { const R = KR(); R.state = "streaming"; renderResults(); renderStatus(); later(() => { R.state = "complete"; R.loaded = 1000000; R.total = 1000000; R.ms = 48210; renderResults(); renderStatus(); }, 1200); },

    if (cells > 1000000) toast(`<div class="t1">${te("hv-copy-refused-title")}</div><div class="l2">${te("hv-copy-refused-body", { cells:nf(cells), max:nf(1000000), size:mbs(100) })}</div>`, { icon:"circle-alert", wide:true });
    else toast(`<div class="t1">${te("hv-copy-done", { rows:nf(d[0]), cols:nf(d[1]) })}</div><div class="l2">${te("hv-copy-done-line")}</div>`, { icon:"copy-check" }); },
  logClear: () => { K().res.log = []; renderResults(); }, logCopy: () => toast(`<div>${te("hv-results-copy")} ✓</div>`, { icon:"copy" }), logEnd: () => {},
  logErr: a => { const k = K(), l = +a.dataset.unit; k.ed.sel = { a:{ l, c:0 }, b:{ l, c:(k.ed.lines[l] || "").length } }; k.ed.caret = { l, c:(k.ed.lines[l] || "").length }; W.focus = "editor"; renderEditor(); renderStatus(); },
  tipFail: (a, e) => { e?.stopPropagation(); const l = +a.dataset.l, m = K().ed.marks.find(x => x.l === l); openTip(l, m && m.more ? "two" : "fail"); },
  cell: (a, e) => { const R = KR(), r = +a.dataset.r, c = +a.dataset.c; W.focus = "results";
    if (e.shiftKey && R.sel && R.sel.kind === "range") R.sel = { ...R.sel, r0:Math.min(R.sel.ar, r), r1:Math.max(R.sel.ar, r), c0:Math.min(R.sel.ac, c), c1:Math.max(R.sel.ac, c) };
    else R.sel = { kind:"range", r0:r, r1:r, c0:c, c1:c, ar:r, ac:c };
    renderEditor(); renderResults(); renderStatus(); },
  rowHead: a => { const R = KR(), r = +a.dataset.r; R.sel = { kind:"rows", r0:r, r1:r }; W.focus = "results"; renderResults(); },
  colHead: a => { const R = KR(), c = +a.dataset.c; R.sel = { kind:"cols", c0:c, c1:c }; W.focus = "results"; renderResults(); },
  selAll: () => { const R = KR(); R.sel = { kind:"all" }; W.focus = "results"; renderResults(); },
  txCommit: () => { W.layers = []; const k = K(); k.tx = null; k.res.log.push({ g:"tx", k:"exec-tx-committed" }); renderLayers(); renderWork(); },
  txRollback: () => { W.layers = []; const k = K(); k.tx = null; k.res.log.push({ g:"tx", k:"exec-tx-rolled-back" }); renderLayers(); renderWork(); },
  closeLayer: () => { W.layers.pop(); renderLayers(); },

};
function rerender() { renderAll(); afterRender(); syncUrl(); }
document.addEventListener("click", e => {
  const mi = e.target.closest("[data-mi]"); if (mi) { pickMenu(+mi.dataset.mi); return; }
  if (W.menu && !e.target.closest("#menu")) { closeMenu(); if (!e.target.closest("[data-act]")) return; }
  if (W.tip && !e.target.closest(".tip")) { W.tip = null; renderMenus(); }
  if (W.pop && !e.target.closest(".pop") && !e.target.closest("[data-act=prodPop]")) { W.pop = null; renderEditor(); renderMenus(); }
  const a = e.target.closest("[data-act]");
  if (a && ACT[a.dataset.act] && !a.disabled) { e.preventDefault(); ACT[a.dataset.act](a, e); return; }

});
document.addEventListener("contextmenu", e => { if (!e.target.closest("#code")) return; e.preventDefault(); const W0 = winRect(); openContext(e.clientX - W0.left, e.clientY - W0.top); });
document.addEventListener("mouseover", e => { const mi = e.target.closest(".menu.chooser [data-mi]"); if (mi && W.menu && W.menu.active !== +mi.dataset.mi) previewChooser(+mi.dataset.mi); });
function focusInitial() { document.querySelector('.layer:last-child [data-fk="txcancel"]')?.focus({ preventScroll:true }); }
document.addEventListener("keydown", e => {
  const meta = e.metaKey || e.ctrlKey;
  if (W.menu) {
    const M = W.menu, n = M.items.length;
    if ((e.key === "ArrowDown" || e.key === "ArrowUp") && n) { e.preventDefault(); let i = M.active; do { i = (i + (e.key === "ArrowDown" ? 1 : -1) + n) % n; } while (M.items[i].sep || M.items[i].dis); M.type === "chooser" ? previewChooser(i) : (M.active = i, renderMenus()); return; }
    if (e.key === "Enter" && !e.repeat) { e.preventDefault(); if (M.active >= 0) pickMenu(M.active); return; }
    if (e.key === "Escape") { e.preventDefault(); closeMenu(); return; }
    if (M.type === "chooser" && !meta && e.key.length === 1) { e.preventDefault(); return; }    /* no access keys: a letter never runs a statement (P15) */
  }
  if (W.layers.length) {
    if (e.key === "Escape" || (e.key === "Enter" && !e.repeat && !meta)) { e.preventDefault(); ACT.closeLayer(); return; }   /* Enter acts on Cancel, the focused default */

  }

  if (meta && (e.key === "c" || e.key === "C") && W.focus === "results") { e.preventDefault(); ACT.copy(); return; }
  if (meta || e.altKey || e.target.tagName === "INPUT") return;
  const k = e.key, order = "1234567890-=";
  if (order.includes(k) && order.indexOf(k) < SURF.length) return go(order.indexOf(k));
  if (k === "]" || k === "[") { const s = SURF[S.surface], i = s.sc.findIndex(x => x[0] === (S.sc[s.id] || s.sc[0][0])); return go(S.surface, s.sc[(i + (k === "]" ? 1 : -1) + s.sc.length) % s.sc.length][0]); }
  if (k === "t" || k === "T") { S.theme = S.theme === "dark" ? "light" : "dark"; return rerender(); }
  if (k === "l" || k === "L") { LANG = LANG === "en" ? "tr" : "en"; return rerender(); }
  if (k === "n" || k === "N") { S.notes = !S.notes; renderMockbar(); renderNotes(); return syncUrl(); }
  if (k === "w" || k === "W") { S.size = { fit:"1280", "1280":"960", "960":"fit" }[S.size]; return rerender(); }
});
window.addEventListener("resize", () => { if (!W) return; renderAll(); afterRender(); });

/* ═════════════ Navigation, deep links, boot ═════════════ */
function go(surface, sc) {
  S.surface = surface; const s = SURF[surface]; S.sc[s.id] = sc || S.sc[s.id] || s.sc[0][0];
  setup(s.id, S.sc[s.id]); renderAll(); afterRender(); syncUrl();
}
function syncUrl() {
  if (S.shot) return;
  const u = new URLSearchParams(); u.set("s", S.surface + 1); u.set("sc", S.sc[SURF[S.surface].id]); u.set("theme", S.theme); u.set("lang", LANG);
  if (S.size !== "fit") u.set("size", S.size); if (!S.bar) u.set("bar", "0"); if (!S.blink) u.set("caret", "static"); if (S.notes) u.set("notes", "1");
  history.replaceState(null, "", "?" + u.toString());
}
(() => {
  const P = new URLSearchParams(location.search);
  S.theme = P.get("theme") === "light" ? "light" : "dark";
  LANG = P.get("lang") === "tr" ? "tr" : "en";
  S.notes = P.get("notes") === "1"; S.bar = P.get("bar") !== "0"; S.size = ["1280", "960"].includes(P.get("size")) ? P.get("size") : "fit";
  S.shot = P.get("shot") === "1"; S.blink = P.get("caret") !== "static" && !S.shot;
  const s = Math.max(1, Math.min(SURF.length, +(P.get("s") || 1))) - 1;
  const forcedLang = P.get("lang"), forcedSize = P.get("size");
  go(s, P.get("sc") || undefined);
  /* a scenario may pin TR or 960; an explicit deep-link value wins */
  if (forcedLang && LANG !== forcedLang) { LANG = forcedLang; rerender(); }
  if (forcedSize && S.size !== forcedSize) { S.size = forcedSize; rerender(); }
  /* re-run the scenario once the fonts have loaded, so anchored popups sit on the real glyph metrics */
  if (document.fonts) document.fonts.ready.then(() => { const l = LANG, z = S.size; go(S.surface, S.sc[SURF[S.surface].id]); if (LANG !== l || S.size !== z) { LANG = l; S.size = z; rerender(); } });
})();
