/* Window sizes for M4: 1440 × 900 (reference) and 960 × 600 (minimum) */

/* ───────── Explorer tree (DESIGN.md Explorer Tree; tree spike row anatomy) ─────────
   Every row is 23 px (the spike's flat, virtualized model); depth indents 14 px from an 8 px base.
   A row: chevron (12) · kind icon (12) · label · type text · badges · flags · pill · meta (right). */
.xtree { position:relative; flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; outline:none; }
.xtree::-webkit-scrollbar { width:8px; }
.xtree::-webkit-scrollbar-thumb { background:var(--seam-2); border-radius:3px; border:2px solid var(--side); }
.xspace { position:relative; }
.xr { position:absolute; left:0; right:0; height:23px; display:flex; align-items:center; gap:6px; padding-right:10px; white-space:nowrap; color:var(--text); cursor:default; font-size:13px; }
.xr:hover { background:var(--hover); }
.xr.sel { background:var(--blue-a); }
.xr.sel::before { content:""; position:absolute; left:0; top:0; bottom:0; width:1px; background:var(--blue); }
.xr.sel > .ki { color:var(--blue); }
.xtree.kb .xr.cur::after { content:""; position:absolute; inset:0; outline:1px solid var(--blue); outline-offset:-1px; pointer-events:none; }   /* keyboard focus: a 1 px blue ring overlay, no layout shift */
.xr .chev { width:12px; height:12px; flex:none; color:var(--text-2); display:flex; align-items:center; justify-content:center; }
.xr .chev:hover { color:var(--text); }
.xr .ki { color:var(--text-2); flex:none; }
.xr .lbl { flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; unicode-bidi:isolate; }
.xr .lbl.on { font-weight:600; }
.xr .lbl mark { background:var(--blue-a2); color:inherit; }
.xr .ty { font:400 11px/14px "Fragment Mono", monospace; color:var(--text-2); flex:0 1000 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; }
.xr .flags { display:flex; align-items:center; gap:5px; color:var(--text-2); flex:none; }
.xr .flags .ro.prod { color:var(--red); }
.xr .grow { flex:1 1 0; min-width:4px; }
.xr .meta { flex:0 10000 auto; min-width:0; display:flex; align-items:center; gap:4px; color:var(--text-3); font:400 11px/14px "Fragment Mono", monospace; overflow:hidden; }
.xr .meta .mt { overflow:hidden; text-overflow:ellipsis; min-width:0; }
.xr .meta .ok { color:var(--green); flex:none; }
.xr .meta svg { flex:none; }
.xr .meta .run, .xr .st-run { width:7px; height:7px; background:var(--amber); display:block; flex:none; }
.xr.dim > .lbl, .xr.dim > .ki { color:var(--text-3); }
.xr.anc > .lbl { color:var(--text-2); }
.xr.broken > .lbl { color:var(--text-2); }
.xr .alert { color:var(--text); flex:none; display:flex; }
/* Group headers (kind groups and environments): small caps at text-3, a seam-soft rule, a mono count. Focusable, never selected (R-M4-49). */
.xr.hdr { color:var(--text-3); }
.xr.hdr .hl { font-size:13px; font-variant-caps:all-small-caps; letter-spacing:.075em; font-weight:600; flex:0 1 auto; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.xr.hdr .rule { flex:1 1 0; height:1px; background:var(--seam-soft); min-width:6px; }
:root[data-theme="light"] .xr.hdr .rule { background:var(--seam); }
.xr.hdr .n { font:400 11px/14px "Fragment Mono", monospace; color:var(--text-3); flex:none; }
.xr.envh:hover { background:transparent; }
/* Status child rows (ChildState::Loading / Failed / empty): text-2, no motion; a static run marker while a pass runs */
.xr.st { color:var(--text-2); font-size:12.5px; }
.xr.st .mono { font-size:11.5px; color:var(--text-2); }
.xr.st .lbl { color:var(--text-2); }
.xr.st:hover { background:transparent; }
.xr.st .btn { height:20px; padding:0 7px; font-size:12px; }
/* Outlined badge (micro 11.5): never filled (One Filled Badge). Collapses to its glyph when the row is crowded. */
.xb { display:inline-flex; align-items:center; gap:4px; height:16px; padding:0 5px; border:1px solid var(--seam-2); border-radius:3px; font-size:11.5px; line-height:14px; color:var(--text-2); flex:0 100 auto; min-width:0; overflow:hidden; cursor:default; }
.xb .bt { overflow:hidden; text-overflow:ellipsis; }
.xb svg { flex:none; }
.xb.c { padding:0 2px; gap:0; }
.xb.c .bt { display:none; }
/* Introspection-level pill (datagrip/04 §3.1): outline only; blue = set on this node, grey = inherited or automatic */
.pill { height:16px; display:inline-flex; align-items:center; padding:0 5px; border:1px solid var(--seam-2); border-radius:3px; font:500 11px/14px "Source Sans 3", system-ui, sans-serif; color:var(--text-3); flex:none; background:transparent; cursor:pointer; }
.pill:hover { color:var(--text); border-color:var(--text-3); }
.pill.ex { border-color:var(--blue); color:var(--blue); }
.pill.ex:hover { color:var(--blue-hover); border-color:var(--blue-hover); }
/* Out-of-scope rows: dimmed; "Add to scope" shows on hover and selection (also in the menu) */
.xr .addsc { display:none; height:18px; padding:0 6px; border:1px solid var(--seam-2); border-radius:4px; background:transparent; color:var(--text); font-size:12px; flex:none; align-items:center; cursor:pointer; }
.xr:hover .addsc, .xr.sel .addsc { display:inline-flex; }
.xr .addsc:hover { background:var(--hover); }
/* Pending stamp (amber = waits for COMMIT) */
.xr .stamp { width:7px; height:7px; background:var(--amber); display:block; flex:none; }

/* Explorer filter: the 28 px field; Turkish-tolerant toggle inside the well (the M3c find toggle) */
.xfilter .cnt { font:400 11px "Fragment Mono", monospace; color:var(--text-3); flex:none; }
.xfilter .ftog { margin-right:-2px; }
.xfilter.err { border-color:var(--text-2); }
.xfhint { margin:0 8px 4px 10px; display:flex; gap:6px; align-items:flex-start; color:var(--text-2); font-size:12px; line-height:1.35; }
.xfhint svg { flex:none; margin-top:1px; }
.xnone { padding:14px 14px 0; display:flex; flex-direction:column; gap:6px; align-items:flex-start; }
.xnone .h { font-weight:600; color:var(--text); font-size:13px; }
.xnone p { margin:0 0 4px; color:var(--text-2); font-size:12.5px; line-height:1.4; overflow-wrap:anywhere; }
/* Cached notice: the inline-notice anatomy under the filter, following the selection's connection */
.xcache { margin:0 8px 6px; padding:6px 8px; font-size:12.5px; }
.xcache .nb .hd { display:flex; align-items:center; gap:6px; }
.xcache .nb .hd .mono { font-size:11.5px; color:var(--text); overflow:hidden; text-overflow:ellipsis; min-width:0; }
.xcache .nb .hd .grow { flex:1; }
.xcache .btn { height:20px; padding:0 7px; font-size:12px; }
.xcache .l2 { margin-top:2px; }

/* Tooltip (the gutter tooltip / popover anatomy) for tree rows, badges and pills */
.xtip { position:absolute; z-index:46; max-width:300px; padding:7px 10px; background:var(--raised); border:1px solid var(--seam-2); border-radius:6px; box-shadow:var(--shadow-pop); font-size:12.5px; color:var(--text-2); line-height:1.4; --text-3:var(--text-2); pointer-events:none; }
.xtip .th { color:var(--text); font-weight:600; font-size:13px; display:flex; gap:7px; align-items:center; margin-bottom:2px; }
.xtip .th svg { flex:none; color:var(--text); }
.xtip .srvbox { margin:6px 0 2px; padding:5px 8px; border:1px solid var(--seam-2); border-radius:4px; background:var(--panel); }
:root[data-theme="light"] .xtip .srvbox { background:var(--ground); }
.xtip .srvbox .cap2 { font-size:12px; color:var(--text-2); }
.xtip .srvbox code { font:400 11.5px/17px "Fragment Mono", monospace; color:var(--text); white-space:pre-wrap; overflow-wrap:anywhere; }
.xtip .mono { font-size:11.5px; color:var(--text); }

/* Menus: a submenu opens beside its row; a disabled row with its reason as the hint (text-2) */
.menu .mi .sub { margin-left:auto; padding-left:16px; color:var(--text-2); display:flex; }
.menu .mi.dis .h { color:var(--text-2); }
.menu .mi .ico2 { color:var(--text-2); display:flex; }
.menu .mi.danger .ico2 { color:var(--red); }
.menu .mi .lab { overflow:hidden; text-overflow:ellipsis; }
.menu .mh .mono { font-size:11.5px; color:var(--text); }
.menu.lv .mi .h { margin-left:0; padding-left:10px; }
.menu.lv .mi { gap:0; }
.menu.lv .mi .lab { min-width:0; }

/* ───────── DDL view tab (center column; read-only code) ───────── */
.dtool .crumb { margin-left:0; padding-left:0; border-left:0; min-width:0; flex:0 1 auto; }
.dtool .crumb .mono { overflow:hidden; text-overflow:ellipsis; min-width:0; }
.dopts .src { color:var(--text-2); font-size:12px; flex:none; display:flex; align-items:center; gap:6px; border:0; margin:0; padding:0; }
.dtool .btn { height:22px; }
.dopts { height:34px; flex:none; display:flex; align-items:center; gap:8px; padding:0 10px 0 12px; border-bottom:1px solid var(--seam); background:var(--panel); white-space:nowrap; overflow:hidden; }
.dopts > * { flex:none; }
.dopts > .grow { flex:1 1 0; min-width:6px; }
.dopts .ol { color:var(--text-2); font-size:12.5px; flex:none; }
.dopts .seg { height:22px; }
.dopts .seg button { font-size:12.5px; padding:0 8px; }
.dopts .select { height:22px; font-size:12.5px; }
.dopts .cb { font-size:12.5px; flex:none; }
.dopts .vsep { height:14px; margin:0 2px; }
.dopts [hidden], .dtool [hidden] { display:none !important; }
.ddlnote { margin:8px 10px 2px 10px; }
.ddlnote .notice .acts { margin-top:6px; }
.ddlnote .notice .acts .btn { height:22px; }
.code.ro .lines { cursor:text; }
.code.gone .lines .inner { opacity:1; }
.code.gone .gut { color:var(--text-3); }
.dempty { flex:1; padding:16px 14px; }
/* The kind icon on a DDL tab */
.tab .tk { color:var(--text-2); }

/* ───────── Scope editor (connection dialog, "Schemas" section) ───────── */
.sctree { border:1px solid var(--seam-2); border-radius:4px; background:var(--panel); padding:4px 0; max-height:178px; overflow:auto; --text-3:var(--text-3-base); }
:root[data-theme="light"] .sctree { background:var(--ground); }
.scr { height:22px; display:flex; align-items:center; gap:7px; padding-right:10px; font-size:13px; color:var(--text); white-space:nowrap; }
.scr .chev { width:12px; display:flex; color:var(--text-2); flex:none; }
.scr .ki { color:var(--text-2); flex:none; }
.scr .mono { font-size:12px; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.scr .h2 { color:var(--text-2); font-size:12px; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.scr.dim .mono { color:var(--text-2); }
.scr .cb .box { flex:none; }
:root .cb[aria-checked="mixed"] .box, :root[data-theme="light"] .cb[aria-checked="mixed"] .box { background:var(--blue); border-color:var(--blue); }
.cb[aria-checked="mixed"] .box svg { visibility:visible; }
.scbar { display:flex; align-items:center; gap:10px; margin:0 0 8px; }
.scbar .grow { flex:1; }
.dlg .in.err { border-color:var(--text-2); }
.errline { display:flex; gap:6px; align-items:flex-start; color:var(--text); font-size:12px; line-height:1.35; }
.errline svg { flex:none; margin-top:1px; color:var(--text); }
.dlg .frow.top { align-items:flex-start; }
.dlg .frow.top .flab { padding-top:4px; }
.dlg .fcell.fcol { flex-direction:column; align-items:stretch; gap:6px; }
.pathint { color:var(--text-2); font-size:12px; line-height:1.35; }
.pathint .mono { font-size:11.5px; color:var(--text); }
.costq .acts { flex-wrap:wrap; }

/* ───────── Mass deletion (alertdialog) ───────── */
.goneList { margin:0 0 10px; padding:8px 10px; border:1px solid var(--seam-2); border-radius:4px; background:var(--panel); list-style:none; display:flex; flex-direction:column; gap:3px; --text-3:var(--text-3-base); }
:root[data-theme="light"] .goneList { background:var(--ground); }
.goneList li { display:flex; gap:7px; align-items:center; font-size:12.5px; color:var(--text); min-width:0; }
.goneList li .mono { font-size:11.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.goneList li svg { color:var(--text-2); flex:none; }
.goneList li.more { color:var(--text-2); padding-left:19px; }

/* ───────── Status bar: the rejected introspection segment (surface 14, comparison only) ───────── */
.status .s.isg { color:var(--text); }
.status .s.isg .run { width:7px; height:7px; background:var(--amber); display:block; }

/* Explorer column hidden (⌘1) */
.tiles.noexp { grid-template-columns:1fr; }
.tiles.noexp .col.left { display:none; }

/* Output rows used by surface 9 (the M3a log anatomy, compact) */
.olog { flex:1; overflow:hidden; padding:4px 0; font-size:12.5px; }
.olog .ol { height:21px; display:flex; align-items:center; gap:8px; padding:0 12px; color:var(--text); white-space:nowrap; }
.olog .ol .tm { font:400 11px "Fragment Mono", monospace; color:var(--text-3); flex:none; width:60px; }
.olog .ol svg { color:var(--text-2); flex:none; }
.olog .ol .g { color:var(--green); }
.olog .ol .stamp { width:7px; height:7px; background:var(--amber); display:block; flex:none; }
.olog .ol .mono { font-size:11.5px; }
/* Settings navigation: the new Metadata section carries the dashed mock tag (mock only), like M3c's */
.snav .ni.m4::after { content:"M4"; margin-left:auto; font:400 10.5px "Fragment Mono", monospace; color:var(--text-2); border:1px dashed var(--seam-2); border-radius:3px; padding:0 3px; }
.srows { overflow:auto; }
.xr.st .cnt { flex:none; margin-left:2px; }
.xr.hdr .hidf { color:var(--text-3); display:flex; flex:none; }
.xr.st .chev.alert { color:var(--text); }
.xr.st .lbl { font-size:12px; }
.xr.st .cnt { font-size:11px; }


/* ═══════════════════════════════════════════════════════════════
   M4b additions ("Script workspace (local)"). Everything above this
   line is the M4 mock's CSS (design/m4-explorer), copied unchanged.
   Everything below uses DESIGN.md tokens only; NOTES.md lists each
   primitive. No new hue, no new filled block, no transforms, filters,
   blur or masks. Red stays production and destruction; amber is an
   uncommitted change or a run in progress; green is a check.
   ═══════════════════════════════════════════════════════════════ */

/* ───────── Scripts node and its rows (surface 1) ─────────
   The shipped row order (hacivat_ui::tree TreeRowData): chevron · icon · name · type text · badge · flags · status · pill · meta.
   The git status slot (RowStatus) is a mono glyph after the flags; it never shrinks and is never red. */
.xr .gst { flex:none; font:400 11px/14px "Fragment Mono", monospace; min-width:8px; text-align:center; cursor:default; }
.xr .gst.m, .xr .gst.n { color:var(--amber); }          /* an uncommitted change: Pending Amber */
.xr .gst.c { color:var(--text); }                        /* a conflict: ink, like every refusal */
.xr .gst.u { color:var(--text-3); }                      /* unknown: never guessed */
.xr .gst.d { color:var(--text-2); font-weight:400; }     /* a folder that contains changes */
.xr.diagrow > .lbl { color:var(--text); }
.xr.diagrow .alert { color:var(--text); }
.xr.lnk > .lbl, .xr.lnk > .ki { color:var(--text-3); }
.xr .meta .run { width:7px; height:7px; }
/* Inline new-name / rename field: the TextInput anatomy at 19 px inside the 23 px row, mono, blue focus ring */
.xr .rn { flex:1 1 auto; min-width:0; height:19px; display:flex; align-items:center; border:1px solid var(--seam-2); border-radius:3px; background:var(--panel); padding:0 4px; outline:1px solid var(--blue); outline-offset:0; }
:root[data-theme="light"] .xr .rn { background:var(--ground); }
.xr .rn.err { border-color:var(--text-2); }
.xr .rn input { flex:1; min-width:0; border:0; background:transparent; outline:0; padding:0; font:400 12px "Fragment Mono", monospace; color:var(--text); height:17px; }
.xr .rn input::selection { background:var(--blue-a2); }
/* The rename error: the tooltip anatomy, pinned under the field (never red) */
.xerr { position:absolute; z-index:47; max-width:260px; padding:6px 9px; background:var(--raised); border:1px solid var(--seam-2); border-radius:6px; box-shadow:var(--shadow-pop); font-size:12px; color:var(--text); line-height:1.35; display:flex; gap:6px; align-items:flex-start; --text-3:var(--text-2); }
.xerr svg { flex:none; margin-top:1px; color:var(--text); }
.xtip .tl { display:flex; gap:6px; align-items:baseline; }
.xtip .tl + .tl { margin-top:3px; }
.xtip .tl .mono { overflow-wrap:anywhere; }
.xtip .gl { font:400 11px "Fragment Mono", monospace; flex:none; }
.xtip .gl.m, .xtip .gl.n { color:var(--amber); }
.xtip .gl.c { color:var(--text); }
.xtip .envl { display:inline-flex; align-items:center; gap:5px; }

/* ───────── Script tabs (surface 5) ───────── */
.tab .dot { width:6px; height:6px; border-radius:50%; background:var(--text-2); display:block; flex:none; }
.tab.on .dot { background:var(--text); }
.tab .x.hov { display:none; }
.tab:hover .dot.dx { display:none; }
.tab:hover .x.hov { display:flex; }
.tab .tt { overflow:hidden; text-overflow:ellipsis; min-width:0; }
.etabs .tabs .tab:not(.on):not(.script) { flex:0 1 auto; min-width:0; }
.etabs .tabs .tab.script:not(.on) { flex:0 1 auto; }
/* The title of a script tab: the file name ellipsizes (at least 4 characters stay), the separator and the connection never do */
.tab .ttl { display:flex; min-width:0; white-space:pre; font:400 12px "Fragment Mono", monospace; }
.tab .ttl .tf { overflow:hidden; text-overflow:ellipsis; min-width:4ch; }
.tab .ttl .tc { flex:none; }
.tab.io .ttl, .tab.io .dot { display:none; }
/* Danger isolation (DESIGN: 28 px plus a seam): a Danger button stands alone at the footer's far left */
.dlg .dfoot .dangergrp { display:flex; align-items:center; padding-right:28px; margin-right:0; border-right:1px solid var(--seam); }
.etabs .tabs .tab.on { flex:0 0 auto; }
.tab .sub { color:var(--text-2); }
/* The tab tooltip: the explanation popover anatomy, mono path first */
.xtip .pth { font:400 11.5px/16px "Fragment Mono", monospace; color:var(--text); word-break:break-all; margin-bottom:3px; }
.xtip .tl2 + .tl2 { margin-top:3px; }
.qbar .rds { display:flex; align-items:center; gap:6px; color:var(--text-2); font-size:12.5px; flex:none; }
.qbar .btn[disabled] { pointer-events:auto; }

/* Editor notices: the inline notice under the toolbar, buttons in its action row (Tab stops) */
.edbanner .notice .acts { margin-top:6px; flex-wrap:wrap; }
.edbanner .notice .acts .btn { height:22px; }
.edbanner .notice .hd2 { font-weight:600; }
.edbanner .notice .mono { font-size:11.5px; }
.edbanner .notice .encsel { display:flex; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap; }
.edbanner .notice .encsel .flab { font-size:12.5px; }
.edbanner .notice .encsel .select { height:24px; font-size:12.5px; width:236px; }
.code[tabindex] { outline:none; }
.code[tabindex]:focus-visible { outline:1px solid var(--blue); outline-offset:-1px; }
.code.ro .lines .tx .rep { color:var(--text-2); }
.edempty.pad { align-items:flex-start; padding-top:22px; }

/* Run as script progress strip (surface 9): the cursor-strip anatomy (26 px, raised) under the toolbar */
.strip.rstrip { border-top:0; border-bottom:1px solid var(--seam); }
.strip.rstrip .run { width:7px; height:7px; background:var(--amber); display:block; flex:none; }
.strip.rstrip .mono { color:var(--text); }
.strip.rstrip .lbl.strong { color:var(--text); }
.strip.rstrip .alert { color:var(--text); display:flex; flex:none; }

/* ───────── Go to script and the connection chooser (surface 7): the shipped palette (536 px) ───────── */
.pal { position:absolute; z-index:62; top:48px; left:50%; width:536px; max-width:calc(100% - 32px); margin-left:-268px; background:var(--raised); border:1px solid var(--seam-2); border-radius:6px; box-shadow:var(--shadow-pop); --text-3:var(--text-2); display:flex; flex-direction:column; }
.pal .pin { padding:8px; }
.pal .pin .in > svg { color:var(--text-2); }
.pal .phead { height:23px; display:flex; align-items:center; gap:6px; padding:0 12px; color:var(--text-2); font-size:12.5px; white-space:nowrap; overflow:hidden; }
.pal .phead .mono { font-size:11.5px; color:var(--text); overflow:hidden; text-overflow:ellipsis; min-width:0; }
.pal .plist { padding:4px 0; }
.pal .pr { height:23px; display:flex; align-items:center; gap:8px; padding:0 12px; color:var(--text); white-space:nowrap; position:relative; cursor:default; font-size:13px; }
.pal .pr:hover { background:var(--hover); }
.pal .pr.on { background:var(--blue-a2); }
.pal .pr.on::before { content:""; position:absolute; left:0; top:0; bottom:0; width:1px; background:var(--blue); }
.pal .pr > svg { color:var(--text-2); }
.pal .pr .fname { font:400 12px "Fragment Mono", monospace; flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; unicode-bidi:isolate; }
.pal .pr .fname u { text-decoration:underline; text-decoration-color:var(--blue); text-underline-offset:2px; }
.pal .pr .fold { font:400 11px "Fragment Mono", monospace; color:var(--text-2); flex:0 1000 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:5px; }
.pal .pr .lib { color:var(--text-2); font-size:12px; flex:0 10000 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; }
.pal .pr .cn { font:400 12px "Fragment Mono", monospace; flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; }
.pal .pr .dbn { font:400 11px "Fragment Mono", monospace; color:var(--text-2); flex:0 100 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; }
.pal .pr .tg { flex:none; height:16px; display:inline-flex; align-items:center; padding:0 5px; border:1px solid var(--seam-2); border-radius:3px; font-size:11.5px; color:var(--text-2); }
.pal .pr .eng { flex:none; font:400 11px "Fragment Mono", monospace; color:var(--text-2); }
.pal .pr.none { color:var(--text-2); }
.pal .pr.unb > svg { color:var(--text-2); }
.pal .pnote { padding:2px 12px 8px 32px; color:var(--text-2); font-size:12px; line-height:1.35; }
.pal .pfoot { display:flex; align-items:center; gap:12px; height:24px; padding:0 12px; border-top:1px solid var(--seam); color:var(--text-2); font-size:11.5px; background:var(--head); border-radius:0 0 6px 6px; white-space:nowrap; overflow:hidden; }
.pal .pfoot span { display:flex; align-items:center; gap:5px; flex:none; }
.pal .pfoot kbd { color:var(--text-2); }
.pal .pfoot .pn { flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; display:block; }

/* ───────── Secret warning (surface 8) ───────── */
.gut .mk.sec { color:var(--text-2); cursor:default; }
.lines .sq { text-decoration:underline dotted var(--text-2); text-underline-offset:3px; }
.seclist { margin:0 0 10px; padding:6px 10px; border:1px solid var(--seam-2); border-radius:4px; background:var(--panel); list-style:none; display:flex; flex-direction:column; gap:3px; --text-3:var(--text-3-base); }
:root[data-theme="light"] .seclist { background:var(--ground); }
.seclist li { display:flex; gap:8px; align-items:center; font-size:12.5px; color:var(--text); min-width:0; }
.seclist li .mono { font-size:11.5px; color:var(--text-2); flex:none; min-width:64px; }
.seclist li svg { color:var(--text-2); flex:none; }
.dlg .dbody .hint2 { display:flex; gap:6px; align-items:flex-start; color:var(--text-2); font-size:12px; line-height:1.4; margin:0 0 10px; }
.dlg .dbody .hint2 svg { flex:none; margin-top:1px; }
.dlg .dbody .mono { font-size:11.5px; color:var(--text); }

/* ───────── Attach dialog (surface 3) ───────── */
.dlg .frow.r120 { grid-template-columns:120px 1fr; }
.dlg .hintrow.r120 { grid-template-columns:120px 1fr; }
.dlg .static { font:400 11.5px "Fragment Mono", monospace; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; flex:1; }
.tomlbox { margin-top:6px; }
.tomlbox .fphead .mono { color:var(--text); font-size:11.5px; }
.tomlbox .fp { white-space:pre; overflow:hidden; }
.tomlbox .fp .k2 { color:var(--syn-kw); }
.tomlbox .fp .s2 { color:var(--syn-str); }
.tomlbox .fp .n2 { color:var(--syn-num); }
.tomlbox .fp .c2 { color:var(--syn-com); font-style:italic; }
.tomlbox .fp .add { background:var(--blue-a); }
.under { display:flex; flex-wrap:wrap; gap:4px 12px; align-items:center; font-size:12.5px; color:var(--text); min-width:0; }
.under .u1 { display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
.under .mono { font-size:11.5px; }
.dlg .notice + .frow, .dlg .frow + .tomlbox, .dlg .notice + .tomlbox { margin-top:10px; }
.dlg .cbrow { margin-top:12px; }
.dlg .cb .cbl { display:flex; flex-direction:column; gap:1px; }
.dlg .cb .cbl .sub { font-size:12px; }
.dlg .dbody .notice { margin-bottom:10px; }

/* ───────── Settings › Script libraries (surface 4) ───────── */
.snav .ni.m4b::after { content:"M4b"; margin-left:auto; font:400 10.5px "Fragment Mono", monospace; color:var(--text-2); border:1px dashed var(--seam-2); border-radius:3px; padding:0 3px; }
.libbar { display:flex; align-items:center; gap:8px; padding:4px 12px 8px; }
.libbar .snote { color:var(--text-2); font-size:12px; line-height:1.35; flex:1; min-width:0; }
.libs { margin:0 12px; border:1px solid var(--seam-2); border-radius:4px; }
.lrow { display:flex; align-items:flex-start; gap:10px; padding:7px 10px; min-width:0; }
.lrow + .lrow { border-top:1px solid var(--seam); }
.lrow > svg { color:var(--text-2); margin-top:2px; flex:none; }
.lrow .lmain { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.lrow .lname { display:flex; align-items:center; gap:8px; min-width:0; }
.lrow .lname .mono { font-size:12px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
.lrow .lbind { color:var(--text-2); font-size:12px; line-height:1.35; }
.lrow .lbind .mono { font-size:11.5px; color:var(--text); overflow-wrap:anywhere; }

.lrow .lpath { font:400 11px "Fragment Mono", monospace; color:var(--text-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.lrow .lst { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-2); flex-wrap:wrap; }
.lrow .lst .s1 { display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
.lrow .lst .s1.ink { color:var(--text); }
.lrow .lst .s1.ink svg { color:var(--text); }
.lrow .lacts { display:flex; gap:6px; flex:none; align-items:center; }
.lrow .lacts .btn { height:22px; }
.shead2 { height:30px; display:flex; align-items:center; padding:6px 12px 0; color:var(--text-2); font-size:13.5px; }
.mrow2 { display:flex; align-items:center; gap:8px; padding:5px 10px; font-size:12.5px; min-width:0; }
.mrow2 + .mrow2 { border-top:1px solid var(--seam); }
.mrow2 .mono { font-size:11.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
.mrow2 .d { color:var(--text-2); white-space:nowrap; }
.mrow2 svg { color:var(--text-2); flex:none; }
.mrow2 .btn { height:22px; margin-left:auto; }
.smain .sscroll { flex:1; min-height:0; overflow:auto; padding-bottom:12px; }

/* ───────── Diagnostics popover (surface 11): the explanation popover, a list of problems ───────── */
.pop.diag2 { width:320px; max-height:calc(100% - 80px); overflow:auto; }
.pop .dgl { margin:6px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px; }
.pop .dgl li { display:flex; gap:7px; align-items:flex-start; color:var(--text); }
.pop .dgl li > svg { flex:none; margin-top:2px; color:var(--text-2); }
.pop .dgl li .l2 { color:var(--text-2); font-size:12px; margin-top:1px; }
.pop .dgl li .mono { font-size:11.5px; }
.pop .dgl .srvbox { margin:4px 0 0; padding:5px 8px; border:1px solid var(--seam-2); border-radius:4px; background:var(--panel); }
:root[data-theme="light"] .pop .dgl .srvbox { background:var(--ground); }
.pop .dgl .srvbox code { font:400 11.5px/17px "Fragment Mono", monospace; color:var(--text); white-space:pre-wrap; overflow-wrap:anywhere; }
.pop .dgl .srvbox .cap2 { font-size:12px; color:var(--text-2); }
.pop .pfa { display:flex; justify-content:flex-end; margin-top:10px; }
.pop .pfa .btn { height:22px; }

/* Status bar: the encoding segment (a button that opens its menu) and the one-line message */
.status .s.msg svg { color:var(--text-2); }
.status button.s.encs { gap:6px; }
#sheet .ph .id { overflow:hidden; text-overflow:ellipsis; min-width:0; }
.palette.mag { flex:none; width:26px; min-width:26px; padding:0; justify-content:center; }
.palette.mag span, .palette.mag kbd { display:none; }
#capslot { flex:0 1 auto; }
.capsule.squeeze { flex:0 1 auto; min-width:0; }
.capsule.squeeze .cp-name { min-width:0; flex:0 1 auto; }
.capsule.squeeze .cp-name b { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
.capsule.squeeze .cp-name .dim { display:none; }
.etabs .tabs .tab.script.on { flex:none; }
.status button.s.encs .mono { font-size:11px; }

</style>

function renderNotes() {
  const el = $("notes"); el.classList.toggle("on", S.notes); if (!S.notes) return;
  const s = SURF[S.surface], N = NOTES[s.id];
  const keys = Object.keys(NEW.en).filter(k => !k.includes("#") && KEY_PREFIX[s.id].some(p => k.startsWith(p)));
  el.innerHTML = `<div class="nh"><span class="tag">MOCK NOTES</span><span style="color:var(--text-2)">${s.n || surfNo(S.surface)} · ${esc(s.label)}</span><span class="grow"></span><button class="btn ghost icon" data-act="notes" title="N">${ic("x","i12")}</button></div>
  <div class="nbody"><h3>Intent</h3><p style="color:var(--text)">${esc(N.intent)}</p><h3>Decisions</h3><ul>${N.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul>
  <h3>Strings on this surface</h3><p>Fluent ids. Turkish strings carry a <span class="por">PO review</span> marker until the PO signs them off.</p>
  <table>${keys.map(k => `<tr><td class="k">${esc(k)}</td><td class="en">${esc(NEW.en[k])}</td><td>${esc(NEW.tr[k] ?? "")}<span class="por">PO review</span></td></tr>`).join("")}</table>
  <h3>Mock keys</h3><p><code>1</code>–<code>9</code>, <code>0</code>, <code>-</code>, <code>=</code> the first twelve surfaces (the bar reaches all) · <code>[</code> <code>]</code> scenario · <code>T</code> theme · <code>L</code> language · <code>N</code> notes · <code>W</code> window size (when no field or the tree has the focus). Deep links: <code>?s=7&amp;sc=chooser&amp;theme=light&amp;lang=tr&amp;size=960&amp;bar=0</code>.</p></div>`;
}
