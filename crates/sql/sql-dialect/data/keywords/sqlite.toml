# SQLite keywords (SQL-LEX-01), written once by hand from the public-domain list at
# https://sqlite.org/lang_keywords.html; `cargo xtask gen-sql-tables` turns it into
# `src/generated/keywords_sqlite.rs`.
#
# Row: `word` (ASCII upper case), `category`, `source` (a key of [sources]), `since`/`until`:
# the server versions the row holds for (inclusive/exclusive, "" = unbounded). One
# snapshot, so no row is gated.

