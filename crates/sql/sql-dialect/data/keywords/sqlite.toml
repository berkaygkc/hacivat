line = "3.0"
text = "https://sqlite.org/lang_keywords.html (public domain), read on 2026-11-14: 147 keywords, the list `sqlite3_keyword_name` gives for the SQLite 3.54.1 that rusqlite bundles. The page does not classify them, so every row is recorded reserved (SQLite's documentation advises quoting any keyword used as a name)"
