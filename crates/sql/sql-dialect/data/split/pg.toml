# every start word continues a GRANT (a missed split sends what the server rejects)
[[case]]
id = "head-GRANT"
covers = ["head:GRANT"]
input = "GRANT INSERT ON t TO r\nGRANT SELECT ON u TO r"
editor = ["GRANT INSERT ON t TO r\nGRANT SELECT ON u TO r"]

