[[case]]
id = "routine-FUNCTION"
covers = ["skip:OR", "skip:REPLACE", "routine:FUNCTION"]
input = "CREATE OR REPLACE FUNCTION f() RETURNS int LANGUAGE sql BEGIN ATOMIC SELECT 1; SELECT 2; END; SELECT 3"
editor = ["CREATE OR REPLACE FUNCTION f() RETURNS int LANGUAGE sql BEGIN ATOMIC SELECT 1; SELECT 2; END", "SELECT 3"]

[[case]]
id = "routine-PROCEDURE"
covers = ["routine:PROCEDURE"]
input = "CREATE PROCEDURE p() LANGUAGE sql BEGIN ATOMIC INSERT INTO t VALUES (1); END; SELECT 2"
editor = ["CREATE PROCEDURE p() LANGUAGE sql BEGIN ATOMIC INSERT INTO t VALUES (1); END", "SELECT 2"]

# BEGIN ATOMIC only opens a block in a routine; elsewhere BEGIN is a transaction
[[case]]
id = "routine-not-atomic-elsewhere"
covers = ["routine:FUNCTION"]
input = "CREATE TABLE f (a int); BEGIN; SELECT 1; END;"
editor = ["CREATE TABLE f (a int)", "BEGIN", "SELECT 1", "END"]

