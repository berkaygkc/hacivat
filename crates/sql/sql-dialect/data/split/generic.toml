# Splitter-table fixtures for the `generic` profile (`sql-dialect/src/split_profile/generic.rs`; M3a
# Task 8): every table row has at least one case that covers it (`covers`), and the meta-test in
# `sql-split/tests/split.rs` fails when a row has none. Expectations come from `alg/10`
# SQL-SPLIT-01..03. Cases marked "synthetic" isolate a row from the head rules with a `SELECT`
# head; they test the splitter, not SQL validity. Fields: `sql-testkit/src/split.rs`.

dialects = ["generic"]

[[case]]
id = "start-SELECT"
covers = ["start:SELECT"]
input = "SELECT 1\nSELECT 2"
editor = ["SELECT 1", "SELECT 2"]
exec = ["SELECT 1\nSELECT 2"]
heuristic = true
ambiguous = ["MissingSemicolon"]

[[case]]
id = "start-INSERT"
covers = ["start:INSERT"]
input = "SELECT 1\nINSERT INTO t VALUES (1)"
editor = ["SELECT 1", "INSERT INTO t VALUES (1)"]
exec = ["SELECT 1\nINSERT INTO t VALUES (1)"]
heuristic = true
ambiguous = ["MissingSemicolon"]

