# The PostgreSQL statement table (`alg/13` SQL-SAFE-02 "Statement tables: PostgreSQL";
# M3b Task 9): one row per statement message of libpg_query's `pg_query.proto` (every
# `pb::node::Node` variant whose message name ends in `Stmt`, `RawStmt` excepted), with the
# statement's `StmtKind` and its base effects. The PG backend unions the deep walk's effects
# (functions, operators, casts, locking clauses, `INTO`, nested statements) with these.
# A test checks that the rows and the statement messages are the same set.
#
# - `kind`: a `StmtKind` name (`Explain`: the backend decides `analyze`; `Grant` and `Begin`:
#   the backend refines to `Revoke`, `Commit`, `Rollback` or `Savepoint`).
# - `effects`: `EffectSet` flag names. Empty only where the backend decides the effects
#   itself (`COPY`, `CREATE TABLE`/`SEQUENCE`/`VIEW`, `CREATE TABLE AS`, `DECLARE`: temp or
#   not, direction, inner query); a statement that ends with no effect is `UNKNOWN`.
# - `flags`, `reasons`: `RiskFlags` names and `ReasonCode` names (optional).
# - `deferred = true`: the statement's sub-statements do not run now (a routine body, a rule
#   action, a prepared statement, a view's query): their effects still count (conservative),
#   but they give no destructive reason (`alg/13` SAFE-07 step 6).
# Departures from `alg/13`'s table, all toward caution: `CREATE`/`ALTER SUBSCRIPTION` and
# `IMPORT FOREIGN SCHEMA` also reach the network (`EXTERNAL_IO`); `ALTER ROLE … SET` and
# `DROP OWNED` also change privileges; `SetOperationStmt` and `PLAssignStmt` never occur in a
# raw top-level parse and are `UNKNOWN`. Owner: M3b Task 9.
rows = [
  # Reads
  { node = "SelectStmt", kind = "Select", effects = ["READ"] },
  { node = "VariableShowStmt", kind = "Show", effects = ["READ"] },
  { node = "ExplainStmt", kind = "Explain", effects = ["READ"] },
  { node = "ReturnStmt", kind = "Other", effects = ["READ"] },
  { node = "SetOperationStmt", kind = "Other", effects = ["UNKNOWN"], reasons = ["EffectsUnknown"] },
  { node = "PLAssignStmt", kind = "Other", effects = ["UNKNOWN"], reasons = ["EffectsUnknown"] },
  # Data changes
  { node = "InsertStmt", kind = "Insert", effects = ["WRITE_DATA"] },
