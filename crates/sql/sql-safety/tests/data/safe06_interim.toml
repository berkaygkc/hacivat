# SQL-SAFE-06 run A, offline, for the interim backend (Task 10): the `alg/13` bypass catalogue
# rows M1-M19 (MySQL/MariaDB) and L1-L9 (SQLite) copied from the spec, one case per example.
# `read_only` is the decision `decide(report, ReadOnly, Human)` must give (run A: "every case
# must be denied before execution"); rows the catalogue marks as not a classifier denial say
# `allow` with the reason in `note`. Task 18 replaces this with the bypass TOML and the Docker
# legs (run A', run B).
version = 1

[[row]]
id = "M1"
dialect = "mysql"
sql = "SELECT 1 /*!50000 , (SELECT GET_LOCK('x', 10)) */"
read_only = "deny"

