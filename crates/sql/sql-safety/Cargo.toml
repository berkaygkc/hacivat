[package]
name = "sql-safety"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "The SQL classifier: effects, reasons, the policy table and GateClass over the PG and interim backends (SQL-SAFE-01..07)"

# Core layer, `crates/sql`: no runtime, no `hacivat-l10n`, no core crate. The only crate that
# may depend on `sqlparser` (`BackendOutsideOwner`); no `sqlparser` type in its public API.
# Pure and synchronous: the classifier thread pool is `hacivat-exec::classify_pool` (R-M3-53).
[dependencies]
sql-ident.workspace = true
sql-dialect.workspace = true
sql-text.workspace = true
sql-lexer.workspace = true
sql-split.workspace = true
sql-oracle-pg.workspace = true
sqlparser.workspace = true
bitflags.workspace = true
smallvec.workspace = true
# The `data/*.toml` tables, compiled in with `include_str!` (Task 3, Task 4).
toml.workspace = true
serde.workspace = true
# `SafetyReport.classified_hash`: XXH3-64 of the bytes classified (P-M3b-2).
twox-hash.workspace = true

[dev-dependencies]
proptest.workspace = true
# The PG coverage walk (Task 9).
serde_json.workspace = true
# Integration tests (`tests/*`) only, never `#[cfg(test)]` units in `src/` (P-M3b-34).
sql-testkit.workspace = true

[lints]
workspace = true
