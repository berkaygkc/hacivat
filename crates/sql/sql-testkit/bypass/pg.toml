# SQL-SAFE-06 bypass catalogue, PostgreSQL (M3b Task 18; `alg/13` SQL-SAFE-06). Data, read by
# path: run A (`sql-safety/tests/bypass_run_a.rs`, classifier on, offline), run A′
# (`hacivat-exec/tests/docker_m3b_bypass.rs`, the real pool on Docker) and run B
# (`hacivat-session/tests/docker_m2b_bypass.rs`, no classifier on Docker).
#
# Each row:
# - `id`: the catalogue row (P/M/L/X, `SAFE02-n` for the SQL-SAFE-02 test table, `n-3` and
#   `M7/I-2` for run B's review rows);
# - `sql`: the statement; `{victim}` (another backend's ID), `{tro}` (the engine's transaction
#   read-only variable) and `{d}` (a scratch directory) are filled in where it runs;
# - `classifier`: run A's verdict under `ReadOnlyPlusExplain` for a human and the report's
#   reason codes (sorted, unique), with the session's lexing modes known (the dialect's
#   defaults unless `modes` names others; `modes = "unknown"`: not known);
# - `server_off`: run B's outcomes that count as stopped with no classifier (a server code, `1a`,
#   `protocol`, `function`, `gap`, `refused`); empty for a neutralised row (it may run, and
#   must leave nothing);
# - `accounts`: who runs it in Docker (`hv_ro`, `owner` = the test account); empty: run A only;
# - `kind`: `server_blocked | neutralised | privilege_only | non_transactional`;
# - `anchor`: where the row comes from;
# - optional `search_path`, `allowlist` (the profile's function allowlist), `note`, and on
#   MariaDB `observed`: run B's recorded outcome per account (C19, R-M3-58).

