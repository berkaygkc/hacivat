classifier = { verdict = "deny", reasons = ["WriteData"] }
server_off = ["refused"]
accounts = ["read_only_file"]
kind = "server_blocked"
anchor = "docker_m2b_bypass (run B), Docker #sqlite-ro (no server: every PR)"

