[package]
name = "sql-testkit"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Dev-only: the SQL corpora and the D-011 golden loader and runner (ALG-TEST-01)"

# Dev-only (a dev-dependency of the SQL crates), never shipped. `SqlNotRuntimeFree` skips it;
# `SqlReachesCore` still applies.
[dependencies]
sql-split.workspace = true
sql-lexer.workspace = true
sql-dialect.workspace = true
serde.workspace = true
toml.workspace = true
# ## m3b-t01a-seams (fix round 1, M5): the PG differential (Task 20) only, behind the
# `differential` feature, so the lexer's and splitter's plain test loops do not build
# libpg_query through this crate. No `sql-safety` edge: Task 18's bypass corpus is data
# (`bypass/*.toml`) read by path.
sql-oracle-pg = { workspace = true, optional = true }

[features]
# ## m3b-t01a-seams: `src/differential/**` (Task 20); the nightly `sql-differential` job turns
# it on.
differential = ["dep:sql-oracle-pg"]

[lints]
workspace = true
