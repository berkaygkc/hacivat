dialect = "mysql"
input = "?1"
kinds = ["QuestionParam", "Number"]

[[case]]
id = "MY-client-command-backslash"
source = "alg/10 SQL-SPLIT-01: \\G is the client's (the lexer sees a lone backslash)"
dialect = "mysql"
input = "SELECT 1\\G"
kinds = ["Word", "Whitespace", "Number", "Unknown", "Word"]
