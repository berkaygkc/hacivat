# --- variables, parameters, operators ---

[[case]]
id = "MY-variables"
source = "alg/10 SQL-LEX-02 rule 8 and edge cases: @@, @, @1"
dialect = "mysql"
input = "@a @@session @1 @@ ?"
kinds = ["UserVar", "Whitespace", "SystemVar", "Whitespace", "UserVar", "Whitespace", "Op", "Op", "Whitespace", "QuestionParam"]

[[case]]
id = "MY-user-variable-dot"
source = "MySQL manual: user variable names may hold ."
dialect = "mysql"
input = "@a.b"
kinds = ["UserVar"]

[[case]]
id = "MY-system-variable-scope"
source = "alg/10 SQL-LEX-02 rule 8"
dialect = "mysql"
input = "@@SESSION.sql_mode"
kinds = ["SystemVar", "Dot", "Word"]

[[case]]
id = "MY-account-name"
source = "MySQL manual: 'user'@'host'"
dialect = "mysql"
input = "'u'@'localhost'"
kinds = ["String", "Op", "String"]

[[case]]
id = "MY-operators"
source = "alg/10 SQL-LEX-02 rule 10 (MySQL's fixed set)"
dialect = "mysql"
input = "a<=>b->>'$.x' c:=1 d&&e||f !g"
kinds = ["Word", "Op", "Word", "Op", "String", "Whitespace", "Word", "Op", "Number", "Whitespace", "Word", "Op", "Word", "Op", "Word", "Whitespace", "Op", "Word"]
texts = ["a", "<=>", "b", "->>", "'$.x'", " ", "c", ":=", "1", " ", "d", "&&", "e", "||", "f", " ", "!", "g"]

[[case]]
id = "MY-question-number"
