expect.labels = [
    "SELECT c.id, c.full_name, c.city, o.id AS order_id, o.status, o.ordered_at, oi.sku, oi.qty, oi.unit_price FROM customers c JOIN orders o ON o.customer_id = c.id JOIN order_items oi ON oi.order_id = o.id WHERE c.is_active AND o.status IN ('paid', 'shipped') ORDER BY o.ordered_at DESC, c.full_name",
    "SELECT c.id, c.full_name, c.city, o.id AS order_id, o.status, o.ordered_at, oi.sku, oi.qty, oi.unit_price FROM customers c JOIN orders o ON o.customer_id = c.id JOIN order_items oi ON oi.order_id = o.id WHERE c.is_active AND o.status IN ('paid', 'shipped') ORDER BY o.ordered_at DESC, c.full_name; SELECT 2",
]
sources = ["alg/20 HV-EXEC-02 step 3 (whitespace collapsed; the popup truncates at its width)", "plan M3a Task 13 (the UI truncates)"]

