expect.label_starts = "-- FX-CARET-01 nested subquery and CTE (PostgreSQL) WITH recent AS ( SELECT id,"
sources = ["alg/10 SQL-SPLIT-04 test cases (chooser → [statement, whole script] after dedupe)", "alg/20 HV-EXEC-02 steps 1–4", "divergences.toml CHOOSE-01"]

