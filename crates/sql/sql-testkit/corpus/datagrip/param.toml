# The PARAM family (bind parameters and template variables) of
# `docs/research/datagrip/13-behavioral-test-corpus.md` §3 (rows 01–06, 12–15, 18–20), as
# Hacivat goldens for PostgreSQL and MySQL (M3b Task 6, SQL-PARAM-01/-02). Clean room: the
# inputs are the corpus's Hacivat-authored SQL; every expectation comes from Hacivat's specs
# (alg/10 SQL-PARAM-01/-02, alg/20 HV-EXEC-03, D-053, D-08), never from DataGrip. Where the
# corpus presumes DataGrip's behaviour and Hacivat differs on purpose, `divergence` says how
# and why.
#
# Read by `sql-split/tests/params.rs` with a small line reader (no TOML crate there), so the
# file keeps to one subset: `[[case]]` headers, `key = value` on one line, basic strings with
# `\\`, `\"` and `\n` escapes, one-line arrays of basic strings, `true`/`false`.
#
# Fields:
# - `id`, `dialect` (`postgres` | `mysql`), `input` (the unit);
# - `pg_question_marks` (optional, default false): the D-08 setting;
# - `bindable`: the source text of every bindable placeholder, in text order;
# - `unbindable`: the source text of every placeholder that is not bindable (refused);
# - `final`: the rewritten text the driver receives; absent when nothing is rewritten
#   (`rewritten` is `None`: no placeholder, or the unit is refused);
# - `templates`: the names of the template variables detected (never substituted, D-053);
# - `diags`: the `ParamDiag` names reported, in text order;
# - `divergence`: how and why Hacivat's answer differs from the corpus's DataGrip column;
# - `sources`.

[[case]]
id = "PARAM-01"
dialect = "postgres"
input = "SELECT * FROM customers WHERE id = ?"
bindable = []
unbindable = []
templates = []
diags = ["QuestionMarkOff"]
divergence = "DataGrip binds `?` on PostgreSQL. Hacivat reads it as an operator by default (it is also the jsonb key operator), sends nothing as a parameter, and hints that the setting is off."
sources = ["D-08", "alg/10 SQL-PARAM-01 step 3 (PG `?` only with pg_question_marks)"]

[[case]]
id = "PARAM-01"
dialect = "postgres"
pg_question_marks = true
input = "SELECT * FROM customers WHERE id = ?"
bindable = ["?"]
unbindable = []
final = "SELECT * FROM customers WHERE id = $1"
templates = []
diags = []
sources = ["D-08 (opt-in)", "alg/10 SQL-PARAM-01 step 4 (PG rewrite to $1..$n)"]

