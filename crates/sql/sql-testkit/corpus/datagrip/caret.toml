# The CARET family (caret → execution range) of `docs/research/datagrip/13-behavioral-test-corpus.md`
# §3.6, as Hacivat goldens (M3a Task 13). Fields: `sql-testkit/src/golden/mod.rs`.
#
# Clean room (ALG-TEST-01): the scenarios (input, caret, policy) are that Hacivat-authored
# document's; the fixtures are its §3.3 SQL, verbatim, in `corpus/fixtures/`. Every expectation
# comes from Hacivat's own specs, named in `sources` (`alg/10` SQL-SPLIT-04 aligned to D-011,
# `alg/20` HV-EXEC-01), never from the document's "Expected hint" column.
#
# `requires = ["cst"]`: the case needs a parse tree (M5). M3a runs `expect_without_cst`, where
# "smallest subquery or statement" falls back to the statement; `expect` is M5's answer.

[[case]]
id = "CARET-01"
fixture = "FX-CARET-01"
caret = { after = "SELECT c.full_name" }
policy = { inside = "smallest_statement" }
expect.units = [{ stmt = 0 }]
sources = ["alg/10 SQL-SPLIT-04 step 4 (SmallestStatement: the top-level item)", "alg/10 SQL-SPLIT-04 test cases (FX-CARET-01)"]

