[[case]]
sql = "create foreign table ft (a int) server srv"
ddl = ["create table ft"]

[[case]]
sql = "drop table a, b, c"
ddl = ["drop table a", "drop table b", "drop table c"]

[[case]]
sql = "drop table if exists s.t cascade"
ddl = ["drop-cascade table s.t"]

[[case]]
sql = "drop foreign table ft"
ddl = ["drop table ft"]

[[case]]
sql = "alter table t add column a int"
ddl = ["alter table t"]

[[case]]
sql = "alter table t add foreign key (a) references u(b)"
ddl = ["alter table t refs=u"]

[[case]]
sql = "alter table t add constraint fk foreign key (a) references s.u(b)"
ddl = ["alter table t refs=s.u"]

[[case]]
sql = "alter table t add column b int references u"
ddl = ["alter table t refs=u"]

[[case]]
sql = "alter table p attach partition p1 for values in (1)"
ddl = ["alter table p refs=p1"]

[[case]]
sql = "alter table p detach partition p1"
ddl = ["alter table p refs=p1"]

[[case]]
sql = "alter table t inherit base"
ddl = ["alter table t refs=base"]

[[case]]
sql = "alter table t owner to r"
ddl = ["alter table t"]

[[case]]
sql = "alter table t rename to t2"
ddl = ["rename-to:t2 table t"]

[[case]]
sql = 'alter table "Sales"."Ürün" rename to "Ürünler"'
ddl = ['rename-to:"Ürünler" table "Sales"."Ürün"']

[[case]]
sql = "alter table t rename column a to b"
ddl = ["alter table t"]

[[case]]
sql = "alter table t rename constraint c to d"
