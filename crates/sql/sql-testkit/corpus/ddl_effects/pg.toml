# owner: Task 6 (M4; sql-testkit corpus, new file). The catalog effects (`StmtReport.ddl`,
# HV-INTRO-12 step 2) `classify` gives each PostgreSQL statement, read by
# `sql-safety/tests/ddl_effects.rs` (`corpus_ddl_effects`). Hacivat-authored statements.
#
# Each case: `sql` (one statement) and `ddl`, its effects in order, one string each:
#   `<action> <kind> <name>[ on=<name>][ refs=<name>,<name>][ temp][ concurrently]`, or `opaque`;
# - action: create | alter | drop | drop-cascade | rename-to:<ident> | set-schema:<ident> |
#   comment | grant | revoke | other;
# - kind: database schema table view matview index sequence routine trigger type domain
#   extension policy rule event role other;
# - name: the parts as written, joined by `.`; a quoted part is `"…"` (inner `"` doubled);
#   `-` for none. Names are never folded.

# Tables.
[[case]]
sql = "create table s1.t(x int)"
ddl = ["create table s1.t"]

[[case]]
sql = "CREATE TABLE S1.T (x int)"
ddl = ["create table S1.T"]

[[case]]
sql = 'create table "Sales"."Ürün" (x int)'
ddl = ['create table "Sales"."Ürün"']

[[case]]
sql = 'create table "a""b" (x int)'
ddl = ['create table "a""b"']

[[case]]
sql = "create temp table t(a int)"
ddl = ["create table t temp"]

[[case]]
sql = "create temporary table t(a int)"
ddl = ["create table t temp"]

[[case]]
sql = "create table pg_temp.t(a int)"
ddl = ["create table pg_temp.t temp"]

[[case]]
sql = "create unlogged table u(a int)"
ddl = ["create table u"]

[[case]]
sql = "create table if not exists t(a int)"
ddl = ["create table t"]

[[case]]
sql = "create table c(a int references p(id))"
ddl = ["create table c refs=p"]

[[case]]
sql = "create table c(a int, foreign key (a) references s.p(id))"
ddl = ["create table c refs=s.p"]

[[case]]
sql = "create table p1 partition of p for values in (1)"
ddl = ["create table p1 refs=p"]

[[case]]
sql = "create table t2 as select 1"
ddl = ["create table t2"]

[[case]]
sql = "create temp table t2 as select 1"
ddl = ["create table t2 temp"]

[[case]]
sql = "create materialized view mv as select 1"
ddl = ["create matview mv"]

[[case]]
sql = "select 1 into t3"
