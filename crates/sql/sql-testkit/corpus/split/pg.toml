# The PostgreSQL splitter corpus (M3a Task 8): `alg/10` SQL-SPLIT-01, -02 and -03 test cases,
# the R-M3-5 errata, and the `datagrip/13` §3.3 FX-SPLIT-PG fixtures with Hacivat's own
# expectations (never DataGrip's "Expected hint"). Fields: `sql-testkit/src/split.rs`. A carriage
# return is generated by `crlf = true`, never written raw (P15).

dialects = ["postgres"]

# --- alg/10 SQL-SPLIT-02 test cases ---

[[case]]
id = "SPLIT02-1a"
source = "alg/10 SQL-SPLIT-02 test 1"
input = "select 1; select 2"
editor = ["select 1", "select 2"]

[[case]]
id = "SPLIT02-1b"
source = "alg/10 SQL-SPLIT-02 test 1"
input = "select ';'; select $$;$$;"
editor = ["select ';'", "select $$;$$"]

[[case]]
id = "SPLIT02-2"
source = "alg/10 SQL-SPLIT-02 test 2 (BEGIN ATOMIC)"
input = "create function f() returns int language sql begin atomic select 1; select 2; end; select 3;"
editor = ["create function f() returns int language sql begin atomic select 1; select 2; end", "select 3"]

[[case]]
id = "SPLIT02-3"
source = "alg/10 SQL-SPLIT-02 test 3"
input = "begin; select 1; commit;"
editor = ["begin", "select 1", "commit"]

[[case]]
id = "SPLIT02-4"
source = "alg/10 SQL-SPLIT-02 test 4"
input = "grant select on t to r; with x as (select 1) select * from x;"
editor = ["grant select on t to r", "with x as (select 1) select * from x"]

[[case]]
id = "SPLIT02-5a"
source = "alg/10 SQL-SPLIT-02 test 5 (SPLIT-PG-12: a line comment hides the ;)"
input = "SELECT 'a' -- ; c\n, 'b';"
editor = ["SELECT 'a' -- ; c\n, 'b'"]
crlf = true

[[case]]
id = "SPLIT02-5b"
source = "alg/10 SQL-SPLIT-02 test 5 (SPLIT-PG-13: CREATE RULE parentheses carry ;)"
input = "CREATE RULE r AS ON INSERT TO audit_log DO ALSO (SELECT 1; SELECT 2);"
editor = ["CREATE RULE r AS ON INSERT TO audit_log DO ALSO (SELECT 1; SELECT 2)"]

[[case]]
id = "SPLIT02-5c"
source = "alg/10 SQL-SPLIT-02 test 5 (SPLIT-PG-09: empty statements)"
input = "SELECT 1;;;SELECT 2;"
editor = ["SELECT 1", "SELECT 2"]
empty = 2

[[case]]
id = "SPLIT02-5d"
source = "alg/10 SQL-SPLIT-02 test 5 (SPLIT-PG-17)"
input = 'SELECT "a;b" FROM (SELECT 1 AS "a;b") t;'
editor = ['SELECT "a;b" FROM (SELECT 1 AS "a;b") t']

[[case]]
id = "SPLIT02-5e"
source = "alg/10 SQL-SPLIT-02 test 5 (SPLIT-PG-18)"
input = "SELECT 1 /* ; */ ; SELECT 2"
editor = ["SELECT 1", "SELECT 2"]

[[case]]
id = "SPLIT02-10a"
source = "alg/10 SQL-SPLIT-02 test 10 (two dollar-quoted functions, a blank line between)"
input = '''
CREATE FUNCTION a() RETURNS int AS $$ BEGIN PERFORM 1; RETURN 1; END; $$ LANGUAGE plpgsql;

CREATE FUNCTION b() RETURNS int AS $$ BEGIN PERFORM 2; RETURN 2; END; $$ LANGUAGE plpgsql;
'''
editor = [
    "CREATE FUNCTION a() RETURNS int AS $$ BEGIN PERFORM 1; RETURN 1; END; $$ LANGUAGE plpgsql",
    "CREATE FUNCTION b() RETURNS int AS $$ BEGIN PERFORM 2; RETURN 2; END; $$ LANGUAGE plpgsql",
]
crlf = true

[[case]]
id = "SPLIT02-10b"
source = "alg/10 SQL-SPLIT-02 test 10 (begin transaction is a transaction)"
input = "begin transaction;\nselect 1 from dual;"
editor = ["begin transaction", "select 1 from dual"]

[[case]]
id = "SPLIT02-10c"
source = "alg/10 SQL-SPLIT-02 test 10 (a statement across line breaks)"
input = "DROP TABLE\nIF\nEXISTS dim_appt;"
editor = ["DROP TABLE\nIF\nEXISTS dim_appt"]
crlf = true

[[case]]
id = "SPLIT02-11"
source = "alg/10 SQL-SPLIT-02 test 11: execution mode refuses a missing semicolon"
input = "select * from t\n\nselect 1"
editor = ["select * from t", "select 1"]
exec = ["select * from t\n\nselect 1"]
heuristic = true
ambiguous = ["MissingSemicolon"]
diag = ["split.missing-semicolon-suspected"]

[[case]]
id = "SPLIT02-12"
source = "alg/10 SQL-SPLIT-02 test 12 (stability rule; SPLIT-PG-15)"
input = "select 'abc\nselect 1;\nselect 2;\n"
editor = ["select 'abc", "select 1", "select 2"]
exec = ["select 'abc\nselect 1;\nselect 2;\n"]
heuristic = true
ambiguous = ["UnterminatedConstruct"]

[[case]]
id = "SPLIT02-12b"
source = "alg/10 SQL-SPLIT-02 test 12 (stability rule for a dollar quote; SPLIT-PG-16)"
input = "DO $$ BEGIN\nselect 1;\nselect 2;\n"
editor = ["DO $$ BEGIN", "select 1", "select 2"]
exec = ["DO $$ BEGIN\nselect 1;\nselect 2;\n"]
heuristic = true
ambiguous = ["UnterminatedConstruct"]

[[case]]
id = "SPLIT02-12c"
source = "alg/10 SQL-SPLIT-02 step 5 (a parenthesis still open at the end: the stability rule)"
input = "SELECT (1;\nSELECT 2;\nSELECT 3;"
editor = ["SELECT (1;", "SELECT 2", "SELECT 3"]
exec = ["SELECT (1;\nSELECT 2;\nSELECT 3;"]
heuristic = true
ambiguous = ["UnterminatedConstruct"]
diag = ["split.unterminated-block"]

# --- R-M3-5 errata ---

[[case]]
id = "ERRATUM-a-pg"
source = "R-M3-5 erratum (a): END at statement start with an empty stack is COMMIT"
input = "BEGIN; SELECT 1; END; SELECT 2"
editor = ["BEGIN", "SELECT 1", "END", "SELECT 2"]

[[case]]
id = "ERRATUM-a-pg-work"
source = "R-M3-5 erratum (a): END WORK / END TRANSACTION"
input = "BEGIN WORK; UPDATE t SET a = 1; END WORK; START TRANSACTION; END TRANSACTION;"
editor = ["BEGIN WORK", "UPDATE t SET a = 1", "END WORK", "START TRANSACTION", "END TRANSACTION"]

[[case]]
id = "ERRATUM-a-pg-case-end"
source = "R-M3-5 erratum (a): a CASE's END at top level is no block end and no diagnostic"
input = "SELECT CASE WHEN 1 = 1 THEN 2 END; SELECT 3"
editor = ["SELECT CASE WHEN 1 = 1 THEN 2 END", "SELECT 3"]
diag = []

[[case]]
id = "ATOMIC-case"
source = "alg/10 SQL-SPLIT-02 edge: BEGIN ATOMIC with a nested CASE … END"
input = "CREATE FUNCTION f(a int) RETURNS int LANGUAGE sql BEGIN ATOMIC SELECT CASE WHEN a > 0 THEN 1 ELSE 2 END; SELECT 3; END; SELECT 4;"
editor = [
    "CREATE FUNCTION f(a int) RETURNS int LANGUAGE sql BEGIN ATOMIC SELECT CASE WHEN a > 0 THEN 1 ELSE 2 END; SELECT 3; END",
    "SELECT 4",
]

[[case]]
id = "ATOMIC-empty"
source = "alg/10 SQL-SPLIT-02 edge: an empty BEGIN ATOMIC END"
input = "CREATE PROCEDURE p() LANGUAGE sql BEGIN ATOMIC END; SELECT 1"
editor = ["CREATE PROCEDURE p() LANGUAGE sql BEGIN ATOMIC END", "SELECT 1"]

[[case]]
id = "RULE-nothing"
source = "alg/10 SQL-SPLIT-02 edge: CREATE RULE … DO INSTEAD NOTHING"
input = "CREATE RULE r AS ON DELETE TO t DO INSTEAD NOTHING; SELECT 1;"
editor = ["CREATE RULE r AS ON DELETE TO t DO INSTEAD NOTHING", "SELECT 1"]

[[case]]
id = "SEMIS"
source = "alg/10 SQL-SPLIT-02 edge: ;;; and a comment-only statement"
input = ";;; -- only a comment\n;"
editor = []
empty = 4

[[case]]
id = "TRAILING"
source = "alg/10 SQL-SPLIT-02 edge: a trailing statement without ;"
input = "SELECT 1;\nSELECT 2"
editor = ["SELECT 1", "SELECT 2"]

[[case]]
id = "UNBALANCED-CLOSE"
source = "alg/10 SQL-SPLIT-02 edge: an unbalanced ) at depth 0 changes no boundary"
input = "SELECT 1); SELECT 2"
editor = ["SELECT 1)", "SELECT 2"]
diag = ["split.unbalanced-close"]

# --- alg/10 SQL-SPLIT-03 test cases ---

[[case]]
id = "SPLIT03-34731"
source = "alg/10 SQL-SPLIT-03 (DBeaver Issue 34731: a blank line inside parentheses)"
input = "select *\nfrom (values(random())\n   \n) as s(v)\nwhere s.v is not null\n"
editor = ["select *\nfrom (values(random())\n   \n) as s(v)\nwhere s.v is not null"]

[[case]]
id = "SPLIT03-34815"
source = "alg/10 SQL-SPLIT-03 (DBeaver Issue 34815)"
input = "select *\nfrom film_actor\n\nshow search_path;"
editor = ["select *\nfrom film_actor", "show search_path"]
exec = ["select *\nfrom film_actor\n\nshow search_path"]
heuristic = true
ambiguous = ["MissingSemicolon"]

[[case]]
id = "SPLIT03-26843"
source = "alg/10 SQL-SPLIT-03 (DBeaver Issue 26843: continuation after a ;)"
input = "SELECT *\nFROM foo\nWHERE 1=1;\n\nAND bar=1"
editor = ["SELECT *\nFROM foo\nWHERE 1=1", "AND bar=1"]

[[case]]
id = "SPLIT03-blank-continues"
source = "alg/10 SQL-SPLIT-03 (a blank line alone never splits)"
input = "select a,\n\n b from t"
editor = ["select a,\n\n b from t"]

[[case]]
id = "SPLIT-PG-10"
source = "datagrip/13 SPLIT-PG-10 with alg/10 SQL-SPLIT-03's expectation"
input = "SELECT 1\nSELECT 2"
editor = ["SELECT 1", "SELECT 2"]
exec = ["SELECT 1\nSELECT 2"]
heuristic = true
ambiguous = ["MissingSemicolon"]

[[case]]
id = "SPLIT-PG-08"
source = "datagrip/13 SPLIT-PG-08 with alg/10's expectation"
input = "SELECT ';' ; SELECT 2"
editor = ["SELECT ';'", "SELECT 2"]

[[case]]
id = "SPLIT-PG-11"
source = "datagrip/13 SPLIT-PG-11: a parameter is a token, not a boundary"
input = "SELECT $1::int"
editor = ["SELECT $1::int"]

[[case]]
id = "INSERT-SELECT"
source = "alg/10 SQL-SPLIT-02 statement-start exceptions (INSERT … SELECT)"
input = "INSERT INTO t (a)\nSELECT a FROM u;\nUPDATE t\nSET a = 1\nWHERE a = 2;"
editor = ["INSERT INTO t (a)\nSELECT a FROM u", "UPDATE t\nSET a = 1\nWHERE a = 2"]

[[case]]
id = "WITH-PATTERNS"
source = "alg/10 SQL-SPLIT-02 statement-start exceptions (WITH ORDINALITY, WITH (…))"
input = "SELECT * FROM unnest(a)\nWITH ORDINALITY AS t(x, n);\nCREATE TABLE t (a int)\nWITH (fillfactor = 70);"
editor = ["SELECT * FROM unnest(a)\nWITH ORDINALITY AS t(x, n)", "CREATE TABLE t (a int)\nWITH (fillfactor = 70)"]

[[case]]
id = "WITH-STARTS"
source = "alg/10 SQL-SPLIT-03 step 1: WITH and a CTE name start a statement"
input = "SELECT 1\nWITH x AS (SELECT 2) SELECT * FROM x"
editor = ["SELECT 1", "WITH x AS (SELECT 2) SELECT * FROM x"]
exec = ["SELECT 1\nWITH x AS (SELECT 2) SELECT * FROM x"]
heuristic = true
ambiguous = ["MissingSemicolon"]

# --- comments and smart ranges are checked in tests/split.rs ---

# --- FX-SPLIT-PG fixtures (datagrip/13 §3.3, verbatim) ---

[[case]]
id = "FX-SPLIT-PG-01"
source = "datagrip/13 FX-SPLIT-PG-01; alg/10 SQL-SPLIT-02 test 5 (2 statements)"
fixture = "FX-SPLIT-PG-01"
editor = ["DO $$\nBEGIN\n  RAISE NOTICE 'a;b';\n  PERFORM 1;\nEND\n$$", "SELECT 1"]
crlf = true

[[case]]
id = "FX-SPLIT-PG-02"
source = "datagrip/13 FX-SPLIT-PG-02; alg/10 SQL-SPLIT-02 test 5 (2 statements)"
fixture = "FX-SPLIT-PG-02"
editor = [
    "CREATE OR REPLACE FUNCTION hv_f() RETURNS text LANGUAGE plpgsql AS $body$\nDECLARE s text := $$x;y$$;\nBEGIN\n  RETURN s || ';';\nEND\n$body$",
    "SELECT hv_f()",
]
crlf = true

[[case]]
id = "FX-SPLIT-PG-03"
source = "datagrip/13 FX-SPLIT-PG-03; alg/10 SQL-SPLIT-02 test 2 (2 statements)"
fixture = "FX-SPLIT-PG-03"
editor = [
    "CREATE OR REPLACE FUNCTION hv_g(a int) RETURNS int LANGUAGE sql\nBEGIN ATOMIC\n  SELECT a + 1;\nEND",
    "SELECT hv_g(1)",
]
crlf = true

[[case]]
id = "FX-SPLIT-PG-04"
source = "datagrip/13 FX-SPLIT-PG-04; alg/10 SQL-SPLIT-02 test 5 (2 statements)"
fixture = "FX-SPLIT-PG-04"
editor = ["SELECT E'it\\'s; fine' AS v", "SELECT 'plain;' AS w"]
crlf = true

[[case]]
id = "FX-SPLIT-PG-05"
source = "datagrip/13 FX-SPLIT-PG-05; alg/10 SQL-SPLIT-01 (psql: COPY data to \\.)"
fixture = "FX-SPLIT-PG-05"
flavor = "psql"
editor = ["COPY audit_log(actor, message) FROM STDIN", "SELECT count(*) FROM audit_log"]
copy = "sys\thello; world\nsys\tsecond\n"
copy_end = true
crlf = true

[[case]]
id = "FX-SPLIT-PG-06"
source = "datagrip/13 FX-SPLIT-PG-06; alg/10 SQL-SPLIT-02 test 3 (3 statements)"
fixture = "FX-SPLIT-PG-06"
editor = ["BEGIN", "UPDATE customers SET city = city WHERE id = 1", "COMMIT"]
crlf = true

[[case]]
id = "FX-SPLIT-PG-07"
source = "datagrip/13 FX-SPLIT-PG-07; alg/10 SQL-SPLIT-01 (psql meta-commands are not SQL)"
fixture = "FX-SPLIT-PG-07"
flavor = "psql"
editor = ["SELECT 1", "SELECT 2"]
client = ["\\set ON_ERROR_STOP on", "\\echo done"]
crlf = true

[[case]]
id = "FX-SPLIT-PG-05-no-client"
source = "alg/10 SQL-SPLIT-01: without a client flavor, COPY data is not recognised (lexed as SQL)"
input = "COPY t FROM STDIN;\nSELECT 1;"
editor = ["COPY t FROM STDIN", "SELECT 1"]

# --- psql (alg/10 SQL-SPLIT-01) ---

[[case]]
id = "PSQL-copy-quote-in-data"
source = "alg/10 SQL-SPLIT-01: a quote in COPY data never reaches the SQL after it"
flavor = "psql"
input = "COPY t FROM stdin;\nO'Brien\t1\n\\.\nSELECT 'after';\n"
editor = ["COPY t FROM stdin", "SELECT 'after'"]
copy = "O'Brien\t1\n"
copy_end = true

[[case]]
id = "PSQL-copy-unterminated"
source = "alg/10 SQL-SPLIT-01: COPY data without \\. runs to the end, and execution refuses it"
flavor = "psql"
input = "COPY t FROM STDIN;\na\t1\nb\t2\n"
editor = ["COPY t FROM STDIN"]
ambiguous = ["UnterminatedConstruct"]
heuristic = true
copy = "a\t1\nb\t2\n"
copy_end = false
diag = ["split.unterminated-copy-data"]

[[case]]
id = "PSQL-copy-two-blocks"
source = "alg/10 SQL-SPLIT-01: several COPY blocks (pg_dump)"
flavor = "psql"
input = "COPY a FROM STDIN;\n1\n\\.\nCOPY b (x) FROM STDIN WITH (FORMAT text);\nit's\n\\.\nSELECT 1;\n"
editor = ["COPY a FROM STDIN", "COPY b (x) FROM STDIN WITH (FORMAT text)", "SELECT 1"]

[[case]]
id = "PSQL-meta-inside-statement"
source = "alg/10 SQL-SPLIT-01: a meta-command between a statement's lines keeps the buffer; Hacivat cannot send it as written"
flavor = "psql"
input = "SELECT 1\n\\echo hi\nFROM t;"
editor = ["SELECT 1\n\\echo hi\nFROM t"]
ambiguous = ["ClientCommand"]
client = ["\\echo hi"]

[[case]]
id = "PSQL-inline-semicolon"
source = "alg/10 SQL-SPLIT-01: psql \\; does not end the statement"
flavor = "psql"
input = "SELECT 1 \\; SELECT 2;"
editor = ["SELECT 1 \\; SELECT 2"]
ambiguous = ["ClientCommand"]
client = ["\\;"]

[[case]]
id = "PSQL-g-terminates"
source = "alg/10 SQL-SPLIT-01: psql \\g ends the statement like ;"
flavor = "psql"
input = "SELECT 1 \\g\nSELECT 2 \\gx\n"
editor = ["SELECT 1", "SELECT 2"]
client = ["\\g", "\\gx"]

[[case]]
id = "PSQL-gset-unsupported"
source = "alg/10 SQL-SPLIT-01: \\gset ends the statement but Hacivat cannot run it as psql does"
flavor = "psql"
input = "SELECT 1 AS x \\gset\nSELECT 2;"
editor = ["SELECT 1 AS x", "SELECT 2"]
ambiguous = ["ClientCommand"]
client = ["\\gset"]

[[case]]
id = "PSQL-backslash-in-dollar"
source = "alg/10 SQL-SPLIT-01 edge: psql \\ inside a $$ body is SQL"
flavor = "psql"
input = "DO $$ BEGIN RAISE NOTICE '\\x'; END $$;\nSELECT 1;"
editor = ["DO $$ BEGIN RAISE NOTICE '\\x'; END $$", "SELECT 1"]

[[case]]
id = "PSQL-backslash-copy-from-stdin"
source = "alg/10 SQL-SPLIT-01: psql \\copy … from stdin reads its rows from the script up to \\.; they are never SQL"
flavor = "psql"
input = "\\copy t FROM stdin\nDELETE FROM t\n\\.\nSELECT 1;"
editor = ["SELECT 1"]
client = ["\\copy t FROM stdin\nDELETE FROM t\n\\."]
crlf = true

[[case]]
id = "PSQL-quote-in-command"
source = "alg/10 SQL-SPLIT-01: a quote in a command's arguments never reaches the SQL after it"
flavor = "psql"
input = "\\echo it's\nSELECT 1;\nSELECT 'x';"
editor = ["SELECT 1", "SELECT 'x'"]
client = ["\\echo it's"]


# --- T8 review round 1: block words by position (erratum (e)), MariaDB compounds
# (erratum (f)), psql \if; the review's probes, confirmed by pg_query and rusqlite ---

[[case]]
id = "R1-pg-atomic-as-end"
source = "T8 review I1 / erratum (e) (pg_query: one statement)"
input = "CREATE FUNCTION f() RETURNS SETOF int LANGUAGE sql BEGIN ATOMIC SELECT 1 AS end; DELETE FROM t; END;\nSELECT 3;"
editor = ["CREATE FUNCTION f() RETURNS SETOF int LANGUAGE sql BEGIN ATOMIC SELECT 1 AS end; DELETE FROM t; END", "SELECT 3"]

[[case]]
id = "R1-pg-atomic-dot-end"
source = "T8 review I1 / erratum (e) (pg_query: one statement)"
input = "CREATE PROCEDURE p() LANGUAGE sql BEGIN ATOMIC DELETE FROM t WHERE t.end < now(); UPDATE u SET a = 1; END;\nSELECT 3;"
editor = ["CREATE PROCEDURE p() LANGUAGE sql BEGIN ATOMIC DELETE FROM t WHERE t.end < now(); UPDATE u SET a = 1; END", "SELECT 3"]

[[case]]
id = "R1-pg-atomic-as-case"
source = "T8 review I1 / erratum (e): CASE after AS is a label"
input = "CREATE FUNCTION f() RETURNS SETOF int LANGUAGE sql BEGIN ATOMIC SELECT 1 AS case; END;\nSELECT 3;"
editor = ["CREATE FUNCTION f() RETURNS SETOF int LANGUAGE sql BEGIN ATOMIC SELECT 1 AS case; END", "SELECT 3"]

[[case]]
id = "R1-pg-psql-if"
source = "T8 review minor 5: a psql \\if branch is not certain"
flavor = "psql"
input = "\\if false\nDROP TABLE t;\n\\endif\nSELECT 1;"
editor = ["DROP TABLE t", "SELECT 1"]
ambiguous = ["ClientCommand"]
confidence = ["H", "E"]
client = ["\\if false", "\\endif"]
