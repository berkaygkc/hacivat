input = "CREATE PROCEDURE p() BEGIN outer: LOOP LEAVE outer; END LOOP outer; END; SELECT 1"
editor = ["CREATE PROCEDURE p() BEGIN outer: LOOP LEAVE outer; END LOOP outer; END", "SELECT 1"]

[[case]]
id = "SPLIT02-if-paren"
source = "alg/10 SQL-SPLIT-02 edge: IF (cond) THEN is a statement IF; IF(a,b,c) a function"
input = "CREATE PROCEDURE p() BEGIN IF (a > 0) THEN SELECT IF(a, 1, 2); END IF; END; SELECT 2"
editor = ["CREATE PROCEDURE p() BEGIN IF (a > 0) THEN SELECT IF(a, 1, 2); END IF; END", "SELECT 2"]

[[case]]
id = "SPLIT02-if-exists"
source = "alg/10 SQL-SPLIT-02 edge: CREATE TABLE IF NOT EXISTS and IF EXISTS (…) THEN"
input = "CREATE PROCEDURE p() BEGIN CREATE TABLE IF NOT EXISTS t (a int); IF EXISTS (SELECT 1) THEN DROP TABLE IF EXISTS u; END IF; END; SELECT 3"
editor = [
    "CREATE PROCEDURE p() BEGIN CREATE TABLE IF NOT EXISTS t (a int); IF EXISTS (SELECT 1) THEN DROP TABLE IF EXISTS u; END IF; END",
    "SELECT 3",
]

[[case]]
id = "SPLIT02-case-statement"
source = "alg/10 SQL-SPLIT-02: CASE statement (END CASE) and CASE expression (END) in a body"
input = "CREATE PROCEDURE p(x int) BEGIN CASE x WHEN 1 THEN SET @a = CASE WHEN x > 0 THEN 1 ELSE 2 END; ELSE BEGIN END; END CASE; END; SELECT 1"
editor = [
    "CREATE PROCEDURE p(x int) BEGIN CASE x WHEN 1 THEN SET @a = CASE WHEN x > 0 THEN 1 ELSE 2 END; ELSE BEGIN END; END CASE; END",
    "SELECT 1",
]

[[case]]
id = "SPLIT02-trigger-if-body"
source = "alg/10 SQL-SPLIT-02: a trigger whose body is one IF statement"
input = "CREATE TRIGGER t BEFORE INSERT ON x FOR EACH ROW IF NEW.a IS NULL THEN SET NEW.a = 1; END IF; SELECT 2"
editor = ["CREATE TRIGGER t BEFORE INSERT ON x FOR EACH ROW IF NEW.a IS NULL THEN SET NEW.a = 1; END IF", "SELECT 2"]

[[case]]
id = "SPLIT02-definer"
source = "alg/10 SQL-SPLIT-02: CREATE DEFINER = user PROCEDURE"
input = "CREATE DEFINER=`admin`@`localhost` PROCEDURE p() BEGIN SELECT 1; END; SELECT 2"
editor = ["CREATE DEFINER=`admin`@`localhost` PROCEDURE p() BEGIN SELECT 1; END", "SELECT 2"]

[[case]]
id = "SPLIT02-mismatch"
