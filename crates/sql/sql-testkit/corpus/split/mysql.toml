# The MySQL and MariaDB splitter corpus (M3a Task 8): `alg/10` SQL-SPLIT-01, -02 and -03 test
# cases, the R-M3-5 errata, and the `datagrip/13` §3.3 FX-SPLIT-MY fixtures with Hacivat's own
# expectations. Fields: `sql-testkit/src/split.rs`. Every case runs under both dialects unless
# it names one.

dialects = ["mysql", "mariadb"]

# --- alg/10 SQL-SPLIT-02 test 6 ---

[[case]]
id = "SPLIT02-6a"
source = "alg/10 SQL-SPLIT-02 test 6 (stored program without DELIMITER)"
input = "CREATE PROCEDURE p() BEGIN IF x THEN SELECT 1; END IF; SELECT 2; END; CALL p();"
editor = ["CREATE PROCEDURE p() BEGIN IF x THEN SELECT 1; END IF; SELECT 2; END", "CALL p()"]

[[case]]
id = "SPLIT02-6b"
source = "alg/10 SQL-SPLIT-02 test 6 (SPLIT-MY-06: # comment hides the ;)"
input = "SELECT 1 #;\n;"
editor = ["SELECT 1"]
crlf = true

[[case]]
id = "SPLIT02-6c"
source = "alg/10 SQL-SPLIT-02 test 6 (SPLIT-MY-07: backslash escape)"
input = "SELECT 'it\\'s;'; SELECT 2;"
editor = ["SELECT 'it\\'s;'", "SELECT 2"]

[[case]]
id = "SPLIT02-6d"
source = "alg/10 SQL-SPLIT-02 test 6 (SPLIT-MY-10: double-quoted string)"
input = 'SELECT "a;b";'
editor = ['SELECT "a;b"']

[[case]]
