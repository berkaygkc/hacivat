# --- R-M3-5 errata ---

[[case]]
id = "ERRATUM-b"
source = "R-M3-5 erratum (b): REPEAT/WHILE/LOOP open blocks only in statement position"
input = "SELECT REPEAT('a', 3); SELECT 2"
editor = ["SELECT REPEAT('a', 3)", "SELECT 2"]

[[case]]
id = "ERRATUM-b-body"
source = "R-M3-5 erratum (b), inside a stored program"
input = "CREATE PROCEDURE p() BEGIN SELECT REPEAT('a', 3); SET @w = 1; WHILE @w < 3 DO SET @w = @w + 1; END WHILE; REPEAT SET @w = @w - 1; UNTIL @w = 0 END REPEAT; END; SELECT 3"
editor = [
    "CREATE PROCEDURE p() BEGIN SELECT REPEAT('a', 3); SET @w = 1; WHILE @w < 3 DO SET @w = @w + 1; END WHILE; REPEAT SET @w = @w - 1; UNTIL @w = 0 END REPEAT; END",
    "SELECT 3",
]

[[case]]
id = "ERRATUM-c"
source = "R-M3-5 erratum (c): BEGIN NOT ATOMIC opens a block at top level"
input = "BEGIN NOT ATOMIC SELECT 1; SELECT 2; END; SELECT 3"
editor = ["BEGIN NOT ATOMIC SELECT 1; SELECT 2; END", "SELECT 3"]

[[case]]
id = "BEGIN-transaction"
source = "alg/10 SQL-SPLIT-02: a top-level BEGIN [WORK] is a transaction"
input = "BEGIN; INSERT INTO t VALUES (1); BEGIN WORK; COMMIT;"
editor = ["BEGIN", "INSERT INTO t VALUES (1)", "BEGIN WORK", "COMMIT"]

# --- executable comments (alg/10 SQL-LEX-05) ---

[[case]]
id = "EXEC-semicolon"
source = "alg/10 SQL-LEX-05 step 3: a ; inside /*! */ makes execution refuse"
input = "SELECT 1 /*! ; DROP TABLE t */"
editor = ["SELECT 1 /*! ; DROP TABLE t */"]
ambiguous = ["SemicolonInExecutableComment"]
heuristic = true
diag = ["split.semicolon-in-executable-comment"]

[[case]]
id = "EXEC-quoted-semicolon"
source = "alg/10 SQL-LEX-05 step 3 and its FX-SPLIT-MY-04 case: even a quoted ; inside /*! */ makes execution refuse; the editor still shows the statements"
input = "/*!80000 SELECT 'a;b' */; SELECT 2"
editor = ["/*!80000 SELECT 'a;b' */", "SELECT 2"]
ambiguous = ["SemicolonInExecutableComment"]
confidence = ["H", "E"]

[[case]]
id = "EXEC-ambiguous-end"
source = "Task 4 review I1 / ledger: an executable comment whose end is ambiguous makes its statement Ambiguous"
input = "SELECT 1 /*!50000 , '*/' */ ; DROP TABLE t; -- '"
# The lexer reads one statement (a string from the second quote to the last); MySQL runs the
# comment, ends it after `'*/' */`, and runs DROP TABLE t as a second statement.
editor = ["SELECT 1 /*!50000 , '*/' */ ; DROP TABLE t; -- '"]
ambiguous = ["AmbiguousCommentEnd"]
heuristic = true

[[case]]
id = "HINT-ambiguous-end"
source = "Task 4 review I1 / ledger: so does an optimizer hint; every statement up to the server's end of it is ambiguous"
input = "SELECT /*+ BKA('*/ 1; DELETE FROM t; -- ') */ 3"
# The lexer reads two statements; MySQL reads the hint to `') */` and runs one, SELECT … 3.
editor = ["SELECT /*+ BKA('*/ 1", "DELETE FROM t"]
ambiguous = ["AmbiguousCommentEnd", "AmbiguousCommentEnd"]
heuristic = true

[[case]]
id = "HINT-ambiguous-end-leading"
source = "Task 4 review I1 / ledger: an ambiguous hint before a statement belongs to it"
input = "/*+ x('*/ SELECT 1; SELECT 2; -- ') */ SELECT 3"
editor = ["/*+ x('*/ SELECT 1", "SELECT 2"]
ambiguous = ["AmbiguousCommentEnd", "AmbiguousCommentEnd"]
heuristic = true

