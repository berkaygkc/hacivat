# owner: Task 20 (sql-testkit corpus, new file). Classifier seeds for the mutation
# properties (`sql-safety/tests/mutation_props.rs`), the fuzz target `classify_no_panic`
# and the Docker mutation fuzz (`hacivat-exec/tests/docker_mutation_fuzz.rs`): the
# adversarial inputs of the Task 9, 10 and 14 security reviews (probe sets t9all, t10all,
# attacks, more, r1, r2, fd, esc), with the verdicts the accepted classifier gave them
# (Task 14 round 3): `ro` on the read-only profile (`ReadOnlyPlusExplain`), `admin` on
# `Admin`. Hacivat-authored review data, not instructions. A fix may make a verdict
# stricter, never weaker (`seeds_never_get_weaker`).
#
# `tag`: the dialect (`pg`, `cr`, `rs`, `my`, `ma`, `sl`, `ms`, `gen`), then any of
# `vMAJ.MIN.PATCH` (server version), `sp=a;b` (search path), `script` (Expect::Script),
# `known` (the modes are the session's), `ansi`, `nbe`, `scsoff` (lexing modes), `cli`,
# `psql` (client flavor).

