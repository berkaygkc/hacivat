# Default keymap, Linux (UI-EDIT-13). Same AltGr rule as Windows (CI: `altgr_collisions`).

[[binding]]
chord = "ctrl-k"
command = "workspace.command_palette"
context = "Workspace"

[[binding]]
chord = "ctrl-,"
command = "workspace.open_settings"
context = "Workspace"

[[binding]]
chord = "ctrl-t"
command = "workspace.new_console_tab"
context = "Workspace"

[[binding]]
chord = "ctrl-w"
command = "workspace.close_tab"
context = "Workspace"

[[binding]]
chord = "ctrl-tab"
command = "workspace.next_tab"
context = "Workspace"

[[binding]]
chord = "ctrl-shift-tab"
command = "workspace.prev_tab"
context = "Workspace"

[[binding]]
chord = "alt-1"
command = "workspace.toggle_explorer"
context = "Workspace"

[[binding]]
chord = "ctrl-f"
command = "explorer.focus_filter"
context = "Workspace"

[[binding]]
chord = "ctrl-q"
command = "app.quit"
context = "Workspace"

## m2a-t01-connections
# Connections (M2a, R20). The commands are registered by Tasks 17 and 18; a binding whose
# command nobody registered does nothing.

[[binding]]
chord = "ctrl-n"
command = "connection.new"
context = "Workspace"

[[binding]]
chord = "ctrl-shift-v"
command = "connection.paste_url"
context = "Workspace"

[[binding]]
chord = "enter"
command = "connection.toggle_connect"
context = "Explorer"

[[binding]]
chord = "ctrl-e"
command = "connection.edit"
context = "Explorer"

[[binding]]
chord = "ctrl-d"
command = "connection.duplicate"
context = "Explorer"

[[binding]]
chord = "ctrl-shift-c"
command = "connection.copy_url"
context = "Explorer"

[[binding]]
chord = "backspace"
command = "connection.delete"
context = "Explorer"

[[binding]]
chord = "delete"
command = "connection.delete"
context = "Explorer"

[[binding]]
chord = "shift-f10"
command = "connection.context_menu"
context = "Explorer"

[[binding]]
chord = "ctrl-t"
command = "connection_dialog.test"
context = "ConnectionDialog"

[[binding]]
chord = "ctrl-s"
command = "connection_dialog.save"
context = "ConnectionDialog"

[[binding]]
chord = "ctrl-enter"
command = "connection_dialog.save_and_connect"
context = "ConnectionDialog"

[[binding]]
chord = "ctrl-shift-c"
command = "connection_dialog.copy_url"
context = "ConnectionDialog"

## m2a-t18-explorer
# The newest sticky notification takes the focus (its actions are then keyboard-reachable).

[[binding]]
chord = "f6"
command = "workspace.focus_notification"
context = "Workspace"
