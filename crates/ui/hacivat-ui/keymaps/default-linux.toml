# Default keymap, Linux (UI-EDIT-13). Same AltGr rule as Windows (CI: `altgr_collisions`).

[[binding]]
chord = "ctrl-k"
command = "workspace.command_palette"
context = "Workspace"

[[binding]]
chord = "ctrl-,"
command = "workspace.open_settings"
context = "Workspace"

[[binding]]
chord = "ctrl-t"
command = "workspace.new_console_tab"
context = "Workspace"

[[binding]]
chord = "ctrl-w"
command = "workspace.close_tab"
context = "Workspace"

[[binding]]
chord = "ctrl-tab"
command = "workspace.next_tab"
context = "Workspace"

[[binding]]
chord = "ctrl-shift-tab"
command = "workspace.prev_tab"
context = "Workspace"

[[binding]]
chord = "alt-1"
command = "workspace.toggle_explorer"
context = "Workspace"

[[binding]]
chord = "ctrl-f"
command = "explorer.focus_filter"
context = "Workspace"

[[binding]]
chord = "ctrl-q"
command = "app.quit"
context = "Workspace"
