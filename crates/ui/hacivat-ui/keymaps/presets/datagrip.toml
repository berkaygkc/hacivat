# Preset "datagrip": DataGrip's chords where they differ from the defaults. A preset binding
# replaces the default binding of the same command.

[[binding]]
chord = "cmd-shift-a"
command = "workspace.command_palette"
context = "Workspace"
platforms = ["macos"]

[[binding]]
chord = "ctrl-shift-a"
command = "workspace.command_palette"
context = "Workspace"
platforms = ["windows", "linux"]

[[binding]]
chord = "cmd-,"
command = "workspace.open_settings"
context = "Workspace"
platforms = ["macos"]

[[binding]]
chord = "ctrl-alt-s"
command = "workspace.open_settings"
context = "Workspace"
platforms = ["windows", "linux"]

# Accepted, documented AltGr shadowing (F12). On PL (Programmer) AltGr+S types the letter s with
# acute, on TR-Q it types the sharp s, and on TR-F it types the micro sign. AltGr chords always pass through to text input
# (Review Focus 1), so on those layouts `ctrl-alt-s` types the character instead of opening
# Settings, and the command stays reachable from the command palette. CI compares this list
# with the collisions it computes: a new collision fails until it is listed here.

[[accepted_altgr_shadowing]]
chord = "ctrl-alt-s"
layout = "pl"
produces = "ś"

[[accepted_altgr_shadowing]]
chord = "ctrl-alt-s"
layout = "tr-q"
produces = "ß"

[[accepted_altgr_shadowing]]
chord = "ctrl-alt-s"
layout = "tr-f"
produces = "µ"

## m3a-t01b-seams
# Cancel a run: DataGrip's Stop chord on Windows and Linux (R-M3-38); macOS keeps cmd-.

[[binding]]
chord = "ctrl-f2"
command = "exec.cancel"
context = "Console"
platforms = ["windows", "linux"]

## m3b-t01b-seams
# DataGrip's chords where M3b's defaults differ (Task 1b). Fix round 2 (I1, I2): a chord that
# works in M3a is never given to a stub. DataGrip's Delete line (cmd-backspace on macOS, today
# `editor.delete_to_line_start`) is bound by Task 34, and Extend/Shrink selection in a grid
# (ctrl-w/ctrl-shift-w on Windows and Linux, today `workspace.close_tab` through the Grid) by
# Task 35, each as a named exception. Every other M3b chord is the default's.

[[binding]]
chord = "ctrl-alt-shift-j"
command = "editor.select_all_occurrences"
context = "Editor"
platforms = ["windows", "linux"]

# Accepted, documented AltGr shadowing (Task 1b): on TR-F AltGr+Shift+J types `<`, so there
# DataGrip's Select all occurrences types the character instead; the command stays in the
# palette.

[[accepted_altgr_shadowing]]
chord = "ctrl-alt-shift-j"
layout = "tr-f"
produces = "<"

## m3c-t35-grid
# Named exception (Task 35, as the Task 1b note above asks): DataGrip's Extend / Shrink selection
# in a grid on Windows and Linux. With a grid innermost, ctrl-w grows the selection instead of
# closing the tab (P-M3b-21 / Q10 accept the shadowing); elsewhere ctrl-w still closes the tab.
# Ctrl-only letter chords: no AltGr collision on any CI layout (TR-Q, TR-F, DE, FR, PL).

[[binding]]
chord = "ctrl-w"
command = "grid.grow_selection"
context = "Grid"
platforms = ["windows", "linux"]

[[binding]]
chord = "ctrl-shift-w"
command = "grid.shrink_selection"
context = "Grid"
platforms = ["windows", "linux"]

## m3b-t34-editor
# Named exception (Task 34, as the Task 1b note above asks): DataGrip's Delete line on macOS,
# cmd-backspace. Under this preset it replaces `editor.delete_to_line_start` on that chord in the
# editor; the default preset keeps it. Windows and Linux keep the default's ctrl-y (DataGrip's
# own). A cmd chord: no AltGr collision on any CI layout.

[[binding]]
chord = "cmd-backspace"
command = "editor.delete_line"
context = "Editor"
platforms = ["macos"]
