## m3c-po
# PO decision on M3c-09 (2026-11-17; named exception to the append-only rule, Task 1b's rows
# stay as they are). Fold and unfold take VS Code's chords (the PO's habit), remappable like
# every row; Ctrl+Shift only, so no AltGr collision. Fold all and unfold all stay palette-only:
# VS Code's `ctrl-k ctrl-0` and `ctrl-k ctrl-j` start with `ctrl-k`, the command palette's chord
# here, which a two-key chord in the editor would hold back. "Use selection for find" (macOS
# `cmd-e`) has no standard chord on Windows: palette only. `alt-shift-f` is VS Code's Format
# Document, reserved for M5's reformat (no other row may take it). Collision check:
# `tests/m3b_routing.rs` (`m3c_po_chords_collide_with_nothing_in_any_preset`).

[[binding]]
chord = "ctrl-shift-["
command = "editor.fold"
context = "Editor"

[[binding]]
chord = "ctrl-shift-]"
command = "editor.unfold"
context = "Editor"

## m4-t01b-seams
# M4 (plan-m4 Task 1b, PO-Q10): the explorer tree and the DDL view. Defaults follow VS Code where
# VS Code has an equivalent, and every row is remappable. The commands are registered disabled
# until their tasks land (Tasks 24, 25, 27), so until then the chord passes through.
# - `explorer.view_ddl` F12: VS Code's Go to Definition.
# - `explorer.copy_qualified_name`: VS Code's Copy Path (`shift-alt-c`, not `ctrl-alt-c`,
#   which is AltGr+C: `ć` on Polish).
# - `explorer.collapse_all`: VS Code's `list.collapseAll`. The `Explorer` context is the tree's
#   own focus, so the chord never reaches the filter field or the editor.
# - `explorer.refresh` F5, in the `Explorer` context only (the file-manager and browser
#   convention; VS Code has no default).
# - `ddl_view.copy` has no row (review I1): the `DdlView` tab context stays on the stack whatever
#   has the focus, so a copy chord there would take the standard copy from the explorer filter,
#   the list and every text field. Inside the DDL text the read-only editor's `editor.copy` is
#   the copy; the command is the toolbar's Copy button and a palette entry.
# - Palette only: `explorer.open_data` (Enter on a table or view row is the tree's own activate;
#   on a profile row Enter stays `connection.toggle_connect`), `explorer.expand_all_children`,
#   `explorer.edit_scope`, `explorer.set_level.*`, `metadata.clear_cache`, `ddl_view.copy`.
# - No `explorer.focus_filter` row: VS Code's `ctrl-alt-f` is AltGr+F, which types `@` on
#   Turkish-F (`altgr/tr-f.toml`); the Workspace `ctrl-f` row stays (P-M4-9).
# No row takes `alt-shift-f` (M5's reformat) or starts with the command palette's chord.
# Checks: `crates/app/hacivat-app/tests/m4_routing.rs` and the AltGr CI
# (`crates/ui/hacivat-ui/tests/keymap_collisions.rs`).
# ## m4-t14-explorer (fix round 2, ruling R-W2-12b; named exception in Task 1b's rows): the
# rows below are in the `ExplorerTree` context, which the tree's focus carries on every row;
# `Explorer` (the connection rows above) is pushed only while the cursor is on a profile root.
# Chords unchanged; each command decides whether it applies to the cursor's row (R-W1-5).

[[binding]]
chord = "f12"
command = "explorer.view_ddl"
context = "ExplorerTree"

[[binding]]
chord = "shift-alt-c"
command = "explorer.copy_qualified_name"
context = "ExplorerTree"

[[binding]]
chord = "ctrl-left"
command = "explorer.collapse_all"
context = "ExplorerTree"

[[binding]]
chord = "f5"
command = "explorer.refresh"
context = "ExplorerTree"

