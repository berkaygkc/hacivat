# Default keymap, macOS (UI-EDIT-13). Chords are `mods-key`; mods are ctrl, alt (Option),
# shift and cmd. No chord may use Option or Option+Shift alone on a printable key: Option types
# characters and dead keys on every Mac layout (CI: `option_only_printables`).

[[binding]]
chord = "cmd-k"
command = "workspace.command_palette"
context = "Workspace"

[[binding]]
chord = "cmd-,"
command = "workspace.open_settings"
context = "Workspace"

[[binding]]
chord = "cmd-t"
command = "workspace.new_console_tab"
context = "Workspace"

[[binding]]
chord = "cmd-w"
command = "workspace.close_tab"
context = "Workspace"

[[binding]]
chord = "ctrl-tab"
command = "workspace.next_tab"
context = "Workspace"

[[binding]]
chord = "ctrl-shift-tab"
command = "workspace.prev_tab"
context = "Workspace"

[[binding]]
chord = "cmd-1"
command = "workspace.toggle_explorer"
context = "Workspace"

[[binding]]
chord = "cmd-f"
command = "explorer.focus_filter"
context = "Workspace"

[[binding]]
chord = "cmd-q"
command = "app.quit"
context = "Workspace"

## m2a-t01-connections
# Connections (M2a, R20). The commands are registered by Tasks 17 and 18; a binding whose
# command nobody registered does nothing.

[[binding]]
chord = "cmd-n"
command = "connection.new"
context = "Workspace"

[[binding]]
chord = "cmd-shift-v"
command = "connection.paste_url"
context = "Workspace"

[[binding]]
chord = "enter"
command = "connection.toggle_connect"
context = "Explorer"

[[binding]]
chord = "cmd-e"
command = "connection.edit"
context = "Explorer"

[[binding]]
chord = "cmd-d"
command = "connection.duplicate"
context = "Explorer"

[[binding]]
chord = "cmd-shift-c"
command = "connection.copy_url"
context = "Explorer"

[[binding]]
chord = "backspace"
command = "connection.delete"
context = "Explorer"

[[binding]]
chord = "delete"
command = "connection.delete"
context = "Explorer"

[[binding]]
chord = "shift-f10"
command = "connection.context_menu"
context = "Explorer"

[[binding]]
chord = "cmd-t"
command = "connection_dialog.test"
context = "ConnectionDialog"

[[binding]]
chord = "cmd-s"
command = "connection_dialog.save"
context = "ConnectionDialog"

[[binding]]
chord = "cmd-enter"
command = "connection_dialog.save_and_connect"
context = "ConnectionDialog"

[[binding]]
chord = "cmd-shift-c"
command = "connection_dialog.copy_url"
context = "ConnectionDialog"
