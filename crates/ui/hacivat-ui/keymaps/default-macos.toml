## m3b-t01b-seams
# M3b and M3c (Task 1b; P-M3b-21): every new chord of both milestones. Each command is
# registered since Task 1b with a stub body (a no-op) until its task fills it: multi-cursor (31),
# folding (32, palette-only), find (33, 37), lines and history recall (34), grid model (35), views
# and the value viewer (38), the grid menu (39), result tabs (25), the history dialog (27).
# `editor.find` and `grid.find` stay unbound until Tasks 33 and 37 bind them (controller ruling
# R5): a stub must not take the explorer filter's chord (PO Q10 shadowing) before its find bar
# exists. `results.next_tab`/`prev_tab` live in the `Results` context (the
# results tile's root); `ctrl-tab` stays Workspace tab switching. A second `exec.cancel` while
# cancelling escalates (Task 23): same chord, no new row.

