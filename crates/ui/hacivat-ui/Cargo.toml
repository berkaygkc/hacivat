[package]
name = "hacivat-ui"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
scene-check = ["hacivat-ui-core/scene-check"]

[dependencies]
hacivat-ui-core.workspace = true
# Embedded keymap data (Task 5) and `locales/en/hui.ftl` (EnglishDefaults, Task 11).
rust-embed.workspace = true
fluent-syntax.workspace = true
unicode-segmentation.workspace = true
serde.workspace = true
toml.workspace = true

[dev-dependencies]
# F1: `#[gpui::test]` expands to `gpui::` paths; production code uses `gpui_surface` only.
gpui = { workspace = true, features = ["test-support"] }
serde_json.workspace = true

[lints]
workspace = true
