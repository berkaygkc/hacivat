[package]
name = "hacivat-testkit"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# M2b (Task 1, Q23): the in-process SSH server and agent (Task 9).
ssh = ["dep:russh", "dep:hacivat-net"]

[dependencies]
hacivat-proto.workspace = true
serde.workspace = true
toml.workspace = true
# M2b (Task 1, Q5): the SSH server and agent (feature `ssh`) and the chaos proxy.
russh = { workspace = true, optional = true }
# `TestSshServer.host_key` is a `hacivat-net` type.
hacivat-net = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "net", "io-util", "sync", "time", "macros"] }

[dev-dependencies]
yaml-rust2.workspace = true

[lints]
workspace = true
