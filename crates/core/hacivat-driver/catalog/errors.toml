# The connect-error registry and classification tables (HV-CONN-03). Embedded by
# `hacivat_driver::errors`; read by `cargo xtask l10n check` (L026).
#
# [[class]]: one entry per `ErrClass::ALL`, in taxonomy order.
#   id         the stable class ID (`ErrClass::id`).
#   reachable  whether M2a can produce the class. L026 requires the English messages
#              `error-conn-<class>-title` and `-body` (hacivat-core.ftl) for every reachable class.
#   fixes      the quick fixes in button order (`FixId::id`). Without the key: ["edit_connection"].
#
# [codes.<table>]: a server error code and its class. Codes always win over text.
#   postgres   SQLSTATE (PostgreSQL).
#   mysql      vendor error numbers (MySQL and MariaDB).
#   mariadb    vendor error numbers that only MariaDB gives this meaning; checked before `mysql`.
#   sqlite     primary result codes; an extended code is reduced to its low byte first.
#
# [fragile]: English text fragments (ASCII, lowercase) for a server error that carries no code.
# Matched case-insensitively, and only when the server's language is unknown or English: never
# against localized text.

[[class]]
id = "network.dns"
reachable = true
fixes = ["try_again", "edit_connection"]

[[class]]
id = "network.refused"
reachable = true
fixes = ["try_again", "edit_connection"]

[[class]]
