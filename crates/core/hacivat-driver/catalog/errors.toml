[codes.postgres]
28P01 = "auth.invalid"
28000 = "authz.database"
3D000 = "config.unknown_database"
53300 = "server.too_many_connections"
57P03 = "server.starting"
57P01 = "server.shutdown"
57P02 = "server.shutdown"
25006 = "server.read_only"
08001 = "network.reset"
08006 = "network.reset"

[codes.mysql]
1045 = "auth.invalid"
1862 = "auth.expired"
1820 = "auth.expired"
3118 = "auth.locked"
1049 = "config.unknown_database"
1040 = "server.too_many_connections"
1290 = "server.read_only"
1792 = "server.read_only"
1044 = "authz.database"
2059 = "auth.method_unsupported"
2061 = "auth.method_unsupported"

[codes.mariadb]
# ER_ACCOUNT_HAS_BEEN_LOCKED (P44).
4151 = "auth.locked"

[codes.sqlite]
14 = "config.unknown_database" # SQLITE_CANTOPEN
26 = "config.invalid"          # SQLITE_NOTADB
8 = "server.read_only"         # SQLITE_READONLY
5 = "internal"                 # SQLITE_BUSY
6 = "internal"                 # SQLITE_LOCKED

[fragile]
"password authentication failed" = "auth.invalid"
"access denied for user" = "auth.invalid"
"too many connections" = "server.too_many_connections"
"the database system is starting up" = "server.starting"
"the database system is shutting down" = "server.shutdown"
"unknown database" = "config.unknown_database"
"server does not support tls" = "tls.not_supported_by_server"
"server does not support ssl" = "tls.not_supported_by_server"
