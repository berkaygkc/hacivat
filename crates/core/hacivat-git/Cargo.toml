version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "Read-only status of a script library through gix, isolated and with reduced trust; never runs a program (HV-SCRIPT-11)"

# ## m4b-t01a-manifests (the M4b manifest table; no later task edits this file).
#
# Core layer. The only crate that may depend on `gix` or any `gix-*` crate directly
# (`BackendOutsideOwner`); no `gix` type is public. No subprocess for the git program, ever
# (`NoGitSubprocess`); only the tests under `tests/` build fixture repositories with the CLI.
[dependencies]
hacivat-proto.workspace = true
gix.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
