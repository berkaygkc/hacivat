[package]
name = "hacivat-results"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The columnar result store: snapshots, the single writer, budgets and cursors (HV-RES-02, -03, -05, -07)"

[features]
# `ResultStore::from_rows`, a complete store for shots and UI tests with no core runtime
# (R-M3-15); enabled only by test dev-dependencies and the app's `shots` feature.
test-support = []

[dependencies]
hacivat-values.workspace = true
arc-swap.workspace = true
tokio = { workspace = true, features = ["sync"] }
futures.workspace = true

# Test targets that build stores with `ResultStore::from_rows` (P6).
[[test]]
name = "store"
required-features = ["test-support"]

[lints]
workspace = true
