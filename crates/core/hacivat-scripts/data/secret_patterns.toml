# ## m4b-t06-secrets
# Token formats of the secret-literal scanner (HV-SCRIPT-10 step 3; R-M4b-17).
#
# Written in our own words from the vendor and RFC documents alg/28 cites (§0.2, S9–S16); no
# rule file of any secret scanner was read or copied. Every regex runs on the `regex` crate,
# whose engines are linear in the text (no backtracking), and is anchored to a word boundary
# where the format starts with a word character.
#
# Rows: `id` (unique), `kind` (`access_token`, `test_key`, `private_key`, `jwt`,
# `connection_string`, `password`), `regex`, `source` ("alg/28 S<n> " + the document, n in
# 9–16, 21, 22), and optionally `check` (`jwt_header`: the first segment decodes to a JSON
# object naming `alg`; `aws_shape`: the 16-character tail holds a digit) and `min_len` (the
# shortest match reported, in bytes). A row whose
# regex has a group named `value` reports that group, and the group is dropped when it is a
# placeholder (`${…}`, `***`, a bind parameter), as a history span is.
#
# R-C0-4: no full token sample belongs in this file, only the shapes.

[[pattern]]
id = "aws-access-key-id"
kind = "access_token"
# `AKIA` (long-term) or `ASIA` (temporary STS) and 16 base32 characters (capitals, 2-7).
# ## m4b-t06-secrets (fix round 1, m4): the 16 must hold a digit (`aws_shape`), so a 20-capital
# word (`ASIAPACIFICCUSTOMERS`) stays quiet; a key id whose tail is all letters (about 4 in 100)
# is missed.
regex = '\b(?:AKIA|ASIA)[A-Z2-7]{16}\b'
source = "alg/28 S9 AWS IAM User Guide, IAM identifiers, unique ID prefixes"
check = "aws_shape"

[[pattern]]
id = "github-token"
kind = "access_token"
# Personal, OAuth, user-to-server, server-to-server and refresh tokens: no fixed length.
regex = '\bgh[pousr]_[A-Za-z0-9]{30,}\b'
source = "alg/28 S10 GitHub Docs, About authentication to GitHub (token formats)"

[[pattern]]
id = "github-fine-grained-token"
kind = "access_token"
regex = '\bgithub_pat_[A-Za-z0-9_]{22,}'
source = "alg/28 S10 GitHub Docs, About authentication to GitHub (token formats)"

[[pattern]]
id = "slack-token"
kind = "access_token"
# Bot, user, app-level, workflow and refreshed app tokens: a prefix, then `-`-separated runs.
# ## m4b-t06-secrets (fix round 1, m5) [Inferred]: the first run starts with a digit (a team,
# user or version number) and the whole token is at least 24 characters, so `xoxb-1-2` and a
# page name such as `xapp-dev-guide-v2` stay quiet.
regex = '\b(?:xox[bp]|xapp|xwfp|xoxe\.xapp)-[0-9][A-Za-z0-9]*(?:-[A-Za-z0-9]+)+'
source = "alg/28 S11 Slack developer docs, Tokens"
min_len = 24

[[pattern]]
id = "stripe-live-key"
kind = "access_token"
# Secret and restricted live keys. Publishable keys are safe to expose and are not reported.
regex = '\b(?:sk|rk)_live_[A-Za-z0-9]{16,}\b'
source = "alg/28 S12 Stripe docs, API keys"

[[pattern]]
id = "stripe-test-key"
kind = "test_key"
regex = '\b(?:sk|rk)_test_[A-Za-z0-9]{16,}\b'
source = "alg/28 S12 Stripe docs, API keys"

[[pattern]]
id = "google-api-key"
kind = "access_token"
# Not documented by the vendor (S13); the widely observed shape, tested with a fixed fixture.
regex = '\bAIza[A-Za-z0-9_-]{35}'
source = "alg/28 S13 Google Cloud docs, Manage API keys (shape inferred, not documented)"

[[pattern]]
id = "pem-private-key"
kind = "private_key"
# A `BEGIN` line whose label ends with `PRIVATE KEY`: plain, encrypted and the legacy labels.
regex = '-{5}BEGIN (?:[A-Z0-9]+ )*PRIVATE KEY-{5}'
source = "alg/28 S15 RFC 7468 (PEM) sections 2, 10 and 11"

[[pattern]]
id = "jwt"
kind = "jwt"
# Three base64url segments; the header is a JSON object (`eyJ` is `{"` encoded); the
# signature may be empty (an unsecured JWT).
regex = '\beyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*'
source = "alg/28 S14 RFC 7519 sections 3, 6 and 7.2; RFC 7515 sections 2 and 3.1"
check = "jwt_header"

[[pattern]]
id = "uri-password"
kind = "connection_string"
# The password of a URI's userinfo (`scheme://user:password@host`), deprecated by the RFC.
regex = '''\b[A-Za-z][A-Za-z0-9+.-]*://[^\s/?#@'":]*:(?P<value>[^\s/?#@'"]+)@'''
source = "alg/28 S16 RFC 3986 section 3.2.1"

# ## m4b-t06-secrets (fix round 1, review m7, m8)
[[pattern]]
id = "pgp-private-key-block"
kind = "private_key"
# The OpenPGP armor header line for an armored private key.
regex = '-{5}BEGIN PGP PRIVATE KEY BLOCK-{5}'
source = "alg/28 S21 RFC 4880 section 6.2 (Forming ASCII Armor)"

[[pattern]]
id = "sql-server-sp-addlogin"
kind = "password"
# SQL Server's deprecated login procedure: the second argument (positional or `@passwd =`,
# after the login name) is the password. The value group keeps its quotes; a placeholder
# (`'<password>'`) is dropped.
regex = '''(?i:\b(?:sys\.)?sp_addlogin)\s+(?i:@loginame\s*=\s*)?N?'(?:[^']|'')*'\s*,\s*(?i:@passwd\s*=\s*)?N?(?P<value>'(?:[^']|'')*')'''
source = "alg/28 S22 Microsoft Learn, sys.sp_addlogin (Transact-SQL)"
# ## m4b-t06-secrets
