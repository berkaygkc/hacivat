[package]
name = "hacivat-ddl"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "DDL generation: the typed DDL IR, per-dialect renderers and the view-only CREATE producers over the metadata model (HV-DDL-07, -09, -10, -11)"

# Pure (check-deps `DdlIsPure`, plan-m4 Global Constraints): no async runtime, no session, no
# driver, no introspection, no Fluent. Karagoz links this crate; every function here is a pure
# function over a catalog snapshot.
[dependencies]
hacivat-meta.workspace = true
hacivat-proto.workspace = true
sql-dialect.workspace = true

[dev-dependencies]
# The SQLite apply-then-reread test runs every SQLite golden against an in-memory database.
rusqlite.workspace = true
# Every PostgreSQL golden must parse with libpg_query (alg/03 HV-DDL-07 test 11).
sql-oracle-pg.workspace = true
smallvec.workspace = true

[lints]
workspace = true
