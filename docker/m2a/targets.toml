# ## m2b-t16-ssh-targets
# The SSH bastions (Task 16). User `hv_ssh` accepts the throwaway password and the generated
# client keys (`ssh-client-ed25519`, `ssh-client-ed25519-enc`; see `ssh_client_key`). `host` and
# `port` are what the connecting side dials: the host for sshd-a, and for sshd-b (`via`
# sshd-a) the in-network name and port. sshd-b has no published port.

[[ssh_target]]
id = "sshd-a"
host = "127.0.0.1"
port = 2222
user = "hv_ssh"
sets = ["pr", "full"]

[[ssh_target]]
id = "sshd-b"
host = "sshd-b"
port = 22
user = "hv_ssh"
via = "sshd-a"
sets = ["pr", "full"]
