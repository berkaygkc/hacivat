# Docker test targets of the M2a server matrix (R17). One `[[target]]` per service of
# compose.yml, read only through `hacivat-testkit` (Global Constraints, Docker).
#
# - `engine` is a `DbmsKind` id; `major` is the server line the tests assert on.
# - `tls_default` is what the server offers out of the box, observed on the first
#   `cargo xtask docker up --set full` and committed: `none` or `self_signed`.
# - `sets`: `pr` (CI and quick local runs) = pg17 + mysql84 + the two sshd bastions; `full` = every
#   target.
# - `service` is the compose service name and `internal_port` the port inside the compose
#   network: tests that go through `sshd-a`/`sshd-b` connect to `<service>:<internal_port>`.
#
# Host 127.0.0.1, user `hv_test`, database `hv_test` everywhere. The throwaway test password
# lives only in `hacivat-testkit` and the files of this directory.

[[target]]
id = "pg13"
service = "pg13"
engine = "postgres"
major = "13"
port = 54313
internal_port = 5432
tls_default = "none"
sets = ["full"]

