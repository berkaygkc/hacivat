[workspace]
resolver = "3"
members = ["crates/ui/*", "crates/core/*", "crates/app/*", "crates/bin/*", "xtask", "spikes/*"]
# M2b (Task 1, Q29): the vendored `mysql_async` is a `[patch]` path crate, never a member.
exclude = ["third_party"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
# Only `crates/ui/hacivat-ui-core/src/platform/**` may opt out, with a `// SAFETY:` comment per block.
unsafe_code = "deny"

[workspace.lints.clippy]
# `clippy.toml` bans locale-blind casing (INV-3, L11, R6).
disallowed_methods = "deny"

[workspace.dependencies]
# GPUI pin: the zed fork berkaygkc/zed, branch hacivat/912159c, which is zed-industries/zed @ 912159c
# plus the carried IME patch (R1; see crates/ui/hacivat-ui-core/patches/README.md).
# Only crates/ui/hacivat-ui-core may depend on these
# (crates/ui and crates/app may add `gpui` with `test-support` as a dev-dependency, F1).
gpui = { git = "https://github.com/berkaygkc/zed", rev = "a1eaa20480d5bfe62e21ab1248e3900232dab92b" }
gpui_platform = { git = "https://github.com/berkaygkc/zed", rev = "a1eaa20480d5bfe62e21ab1248e3900232dab92b", features = ["font-kit", "wayland", "x11"] }
anyhow = "1"
cargo_metadata = "0.19"

# Workspace crates.
hacivat-app = { path = "crates/app/hacivat-app" }
hacivat-bench = { path = "crates/ui/hacivat-bench" }
hacivat-l10n = { path = "crates/core/hacivat-l10n" }
hacivat-l10n-schema = { path = "crates/core/hacivat-l10n-schema" }
hacivat-settings = { path = "crates/core/hacivat-settings" }
hacivat-ui = { path = "crates/ui/hacivat-ui" }
hacivat-ui-core = { path = "crates/ui/hacivat-ui-core" }
# M2a (Task 1): the connect stack.
hacivat-proto = { path = "crates/core/hacivat-proto" }
hacivat-net = { path = "crates/core/hacivat-net" }
hacivat-secrets = { path = "crates/core/hacivat-secrets" }
hacivat-driver = { path = "crates/core/hacivat-driver" }
hacivat-driver-pg = { path = "crates/core/hacivat-driver-pg" }
hacivat-driver-mysql = { path = "crates/core/hacivat-driver-mysql" }
hacivat-driver-sqlite = { path = "crates/core/hacivat-driver-sqlite" }
hacivat-session = { path = "crates/core/hacivat-session" }
hacivat-testkit = { path = "crates/core/hacivat-testkit" }
# M2b (Task 1): the sans-I/O read-only guard.
hacivat-guard = { path = "crates/core/hacivat-guard" }

# Localization (Fluent + ICU4X 2.4).
fluent-bundle = "0.16.0"
fluent-syntax = "0.12.0"
intl-memoizer = "0.5.3"
unic-langid = { version = "0.9.6", features = ["macros"] }
icu_casemap = "2.4.0"
icu_datetime = "2.4.0"
# `alloc` gives `FormattedDecimal` its `Display` (Task 9 fix round 1, M4).
icu_decimal = { version = "2.4.0", features = ["alloc"] }
icu_list = "2.4.0"
icu_locale = "2.4.0"
icu_normalizer = "2.4.0"
icu_plurals = "2.4.0"
icu_properties = "2.4.0"
# Data-presence checks for the regional format policy (Task 9 fix round 1, I2).
icu_provider = "2.4.0"
icu_segmenter = "2.4.0"
icu_time = "2.4.0"
fixed_decimal = "0.7.3"
sys-locale = "0.3.2"
iana-time-zone = "0.1.65"
# Time-zone rules (DST) for `DATETIME` instants; ICU4X has none. `tzdb-bundle-platform` embeds
# the tz database where the OS has none (Windows). Pinned exactly (Task 9 fix round 1, I1).
jiff = { version = "=0.2.38", features = ["tzdb-bundle-platform"] }

# General.
arc-swap = "1.9.5"
base64 = "0.22.1"
directories = "6.0.0"
rust-embed = { version = "8.14.0", features = ["include-exclude"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
toml_edit = "0.25.19"
unicode-segmentation = "1.13.3"

# Logging.
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

# Platform (hacivat-ui-core `platform/**` only).
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"
mach2 = "0.6.0"
windows-sys = "0.61.2"

# Tests.
tempfile = "3.27.0"
trybuild = "1.0.122"
# Docker targets (`hacivat-testkit`) and the CI workflow check (`xtask`).
yaml-rust2 = "0.13"

# M2a connect stack (Task 1, P2). rustls uses the ring provider only: `aws-lc-rs` and
# `aws-lc-sys` are banned in `deny.toml` (P5).
tokio = { version = "1", default-features = false }
tokio-util = "0.7"
futures = "0.3"
tokio-postgres = "0.7"
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring"] }
rusqlite = { version = "0.42", features = ["bundled", "column_metadata"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
rustls-pki-types = { version = "1", features = ["std"] }
# OS trust roots for the MySQL driver only (P10).
rustls-native-certs = "0.8"
# Without these features keyring silently falls back to its non-persistent mock store.
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "crypto-rust", "tokio"] }
# `serde`: the vault JSON is parsed straight into `SecretString` (M2b, Q30).
secrecy = { version = "0.10", features = ["serde"] }
zeroize = "1"
uuid = { version = "1", features = ["v4", "serde"] }
percent-encoding = "2"
regex = "1"
# Test certificates; its default crypto backend is ring.
rcgen = "0.14"

# M2b secure network and sessions (Task 1). SSH uses ring, never aws-lc (Q28): no default
# features, so russh's `aws-lc-rs` default is off.
russh = { version = "0.65.1", default-features = false, features = ["ring", "rsa", "flate2"] }
x509-parser = "0.18"
sha2 = "0.10"
# Encrypted client keys (PKCS #8 PBES2, OpenSSL's default `-v2 aes-256-cbc`; Q5, Q36).
pkcs8 = { version = "0.10.2", features = ["encryption", "pkcs5", "pem", "std", "sha1-insecure"] }
# The vault (Q30): XChaCha20-Poly1305 under an Argon2id key; nonces and salts from
# `getrandom::fill`.
chacha20poly1305 = "0.10.1"
argon2 = "0.5.3"
getrandom = "0.3"
# Hashed `known_hosts` entries (`|1|salt|hash`, HMAC-SHA1).
hmac = "0.12"
sha1 = "0.10"
# `capture_tracing`'s `log` bridge (Q33).
tracing-log = "0.2"

[patch.crates-io]
# M2b (Task 1, Q2, Q29): Hacivat's patched copy (third_party/mysql_async/PATCHES.md).
mysql_async = { path = "third_party/mysql_async" }
# zed Cargo.toml:1045
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
# zed Cargo.toml:1046
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }

# Keep debug builds small: line tables give file:line in panics and backtraces
# without full variable debuginfo (cuts target/ size roughly in half).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
