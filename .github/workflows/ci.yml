name: ci

# CI never signs (L13): no job reads a signing secret, and the nightly packages are unsigned
# build artifacts. Release signing happens locally on the PO's Mac (packaging/*.sh).
#
# The bench job is a regression signal for the M0 spikes, not authoritative: real numbers come
# from the reference hardware, not from shared runners.

on:
  push:
    branches: [main, m1-foundations]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# bash everywhere (Git Bash on Windows): PowerShell would split `--features a,b` at the comma.
defaults:
  run:
    shell: bash

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins 1.98.1; install it explicitly.
      - name: Install pinned toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      - name: Linux system dependencies (GPUI)
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps

      # The runner's default Xcode may predate `-downloadComponent` (exit 64,
      # "invalid option"); select the newest installed Xcode first.
      - name: Select newest Xcode
        if: runner.os == 'macOS'
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)"
          if [ -z "$xcode" ]; then
            echo "::error::no /Applications/Xcode_*.app on this runner"
            exit 1
          fi
          echo "selecting $xcode"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      # Xcode 26+ ships the Metal compiler as a separate component. Download it
      # only when this xcodebuild supports that; then insist the compiler exists,
      # so a missing toolchain fails here and not deep inside the GPUI build.
      - name: macOS Metal Toolchain
        if: runner.os == 'macOS'
        run: |
          if xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            echo "Metal compiler already present"
          elif xcodebuild -help 2>&1 | grep -q -- '-downloadComponent'; then
            xcodebuild -downloadComponent MetalToolchain
          else
            echo "xcodebuild has no -downloadComponent; relying on the bundled Metal compiler"
          fi
          if ! xcrun -sdk macosx metal --version; then
            echo "::error::Metal compiler (xcrun metal) is missing after toolchain setup"
            exit 1
          fi

      - name: Lint VF capture script (PSScriptAnalyzer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          }
          $issues = Invoke-ScriptAnalyzer -Path design/vf/capture.ps1 -Severity Warning,Error
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }

      # ## m3a-t01a-proofs
      - name: libclang (pg_query bindgen)
        uses: ./.github/actions/libclang
      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --release --locked

      # Full test set, lines 1-4 (F2). Line 5 is the nightly release-tests job.
      - name: Test (1/4) workspace
        run: cargo test --workspace --locked

      - name: Test (2/4) ui-core, test-support + scene-check
        run: cargo test --locked -p hacivat-ui-core --features test-support,scene-check

      - name: Test (3/4) l10n, pseudo
        run: cargo test --locked -p hacivat-l10n --features pseudo

      - name: Test (4/4) app, scene-check + pseudo
        run: cargo test --locked -p hacivat-app --features scene-check,pseudo

      # ## m3a-t01b-seams: full test set lines 6-8 (P10), which no job ran before.
      - name: Test (6) testkit, ssh
        run: cargo test --locked -p hacivat-testkit --features ssh

      - name: Test (7) ui-editor, scene-check
        run: cargo test --locked -p hacivat-ui-editor --features scene-check

      - name: Test (8) ui-grid, test-support + scene-check
        run: cargo test --locked -p hacivat-ui-grid --features test-support,scene-check
      # ## m4-t01a-ci: the full test set's `hacivat-meta --all-features` line (P-M4-5).
      - name: Test (M4) meta, all features
        run: cargo test --locked -p hacivat-meta --all-features
      # Fix round 2: `hacivat-introspect` builds without `session` (what `fuzz/meta` needs).
      - name: Check (M4) introspect without the session feature
        run: cargo check --locked -p hacivat-introspect --no-default-features
      # ## m4-t31-golden-guard: after the test runs, no generated-DDL golden changed or appeared
      # (a golden is only ever written by `UPDATE_GOLDEN=1`, which CI never sets; G5).
      - name: Golden guard (M4) DDL goldens unchanged
        shell: bash
        run: |
          git diff --exit-code -- crates/core/hacivat-ddl/tests/golden
          extra="$(git status --porcelain --untracked-files=all -- crates/core/hacivat-ddl/tests/golden)"
          if [ -n "$extra" ]; then
            printf '%s\n' "$extra"
            echo "::error::a DDL golden changed or appeared during the test run (UPDATE_GOLDEN=1 is never set on CI)"
            exit 1
          fi

      # ## m3a-t01a-proofs
      # After every build of this job (clippy, release, the test builds): nothing under the
      # vendored pg_query was written or added, ignored paths included. Runners have no protoc,
      # so the static guard is what catches PATCHES.md §1 being undone.
      - name: The builds leave third_party/pg_query unchanged
        run: |
          changed="$(git status --porcelain --ignored -- third_party/pg_query)"
          if [ -n "$changed" ]; then
            printf '%s\n' "$changed"
            echo "::error::a build wrote into third_party/pg_query (PATCHES.md §1)"
            exit 1
          fi
          if grep -nE '^[^#]*prost-build' third_party/pg_query/Cargo.toml \
            || grep -nE '^[^/]*(Command::new|REGENERATE_PROTOBUF|prost_build)' third_party/pg_query/build.rs; then
            echo "::error::PATCHES.md §1 is undone: the vendored build.rs can regenerate src/protobuf.rs"
            exit 1
          fi

  tokens:
    name: tokens
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: ./.github/actions/linux-deps
      - uses: Swatinem/rust-cache@v2
      - name: Token staleness check
        run: cargo run --locked -p xtask -- tokens --check

  check-deps:
    name: check-deps
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: ./.github/actions/linux-deps
      - uses: Swatinem/rust-cache@v2
      - name: Dependency guard
        run: cargo run --locked -p xtask -- check-deps
      # ## m3a-t03-sql-tables: the generated keyword tables match data/keywords/*.toml. CI only
      # checks; `--from-docker` and `--from-pg-query` are run by hand when the data changes.
      - name: Keyword tables are fresh
        run: cargo run --locked -p xtask -- gen-sql-tables --check
      # ## m3b-t09-visitor: the generated PostgreSQL visitor
      # (`crates/sql/sql-safety/src/visit/pg_generated.rs`) matches the vendored
      # `pg_query.proto`; `--check` regenerates in memory (rustfmt from the pinned toolchain).
      - name: PG visitor is fresh
        run: cargo run --locked -p xtask -- gen-pg-visitor --check

  l10n-check:
    name: l10n-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: ./.github/actions/linux-deps
      - uses: Swatinem/rust-cache@v2
      - name: Catalog and literal lint
        run: cargo run --locked -p xtask -- l10n check
      - name: Repository catalogs are clean (F19)
        run: cargo test --locked -p xtask l10n -- --ignored repo_catalogs_are_clean

  # Turkish locale on the host: casing and formatting must not depend on LANG (INV-3).
  turkey-test:
    name: turkey-test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LANG: tr_TR.UTF-8
      LC_ALL: tr_TR.UTF-8
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: ./.github/actions/linux-deps
      - name: Generate the tr_TR locale
        run: |
          sudo apt-get install -y --no-install-recommends locales
          sudo locale-gen tr_TR.UTF-8
          locale -a | grep -i '^tr_TR'
      # ## m3a-t01a-proofs
      - name: libclang (pg_query bindgen)
        uses: ./.github/actions/libclang
      - uses: Swatinem/rust-cache@v2
      - name: Test (1/4) workspace
        run: cargo test --workspace --locked
      - name: Test (2/4) ui-core, test-support + scene-check
        run: cargo test --locked -p hacivat-ui-core --features test-support,scene-check
      - name: Test (3/4) l10n, pseudo
        run: cargo test --locked -p hacivat-l10n --features pseudo
      - name: Test (4/4) app, scene-check + pseudo
        run: cargo test --locked -p hacivat-app --features scene-check,pseudo
      # ## m3a-t01b-seams: full test set lines 6-8 (P10).
      - name: Test (6) testkit, ssh
        run: cargo test --locked -p hacivat-testkit --features ssh
      - name: Test (7) ui-editor, scene-check
        run: cargo test --locked -p hacivat-ui-editor --features scene-check
      - name: Test (8) ui-grid, test-support + scene-check
        run: cargo test --locked -p hacivat-ui-grid --features test-support,scene-check
      # ## m4-t01a-ci: the full test set's `hacivat-meta --all-features` line (P-M4-5).
      - name: Test (M4) meta, all features
        run: cargo test --locked -p hacivat-meta --all-features
      # ## m4-t31-golden-guard: after the test runs, no generated-DDL golden changed or appeared
      # (a golden is only ever written by `UPDATE_GOLDEN=1`, which CI never sets; G5).
      - name: Golden guard (M4) DDL goldens unchanged
        shell: bash
        run: |
          git diff --exit-code -- crates/core/hacivat-ddl/tests/golden
          extra="$(git status --porcelain --untracked-files=all -- crates/core/hacivat-ddl/tests/golden)"
          if [ -n "$extra" ]; then
            printf '%s\n' "$extra"
            echo "::error::a DDL golden changed or appeared during the test run (UPDATE_GOLDEN=1 is never set on CI)"
            exit 1
          fi

  # Spec 7.1 / F29: runtime language switching (tests of Tasks 13, 16 and 17).
  switch:
    name: switch (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Linux system dependencies (GPUI)
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - name: Select newest Xcode
        if: runner.os == 'macOS'
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)"
          [ -n "$xcode" ] || { echo "::error::no /Applications/Xcode_*.app on this runner"; exit 1; }
          sudo xcode-select -s "$xcode"
      - name: macOS Metal Toolchain
        if: runner.os == 'macOS'
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            if xcodebuild -help 2>&1 | grep -q -- '-downloadComponent'; then
              xcodebuild -downloadComponent MetalToolchain
            fi
          fi
          xcrun -sdk macosx metal --version
      # ## m3a-t01a-proofs
      - name: libclang (pg_query bindgen)
        uses: ./.github/actions/libclang
      - uses: Swatinem/rust-cache@v2
      - name: Detect the shell tests
        id: guard
        env:
          SHELL_TESTS_HASH: ${{ hashFiles('crates/app/hacivat-app/tests/shell.rs') }}
        run: |
          if [ -n "$SHELL_TESTS_HASH" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::tests/shell.rs is absent; switch tests skipped until Task 13 merges"
          fi
      # Once the tests exist, a filter that matches nothing must fail rather than pass vacuously.
      - name: Language switching tests
        if: steps.guard.outputs.present == 'true'
        run: |
          set -o pipefail
          cargo test --locked -p hacivat-app --features scene-check,pseudo -- switch language | tee switch.log
          ran="$(grep -Eo '[0-9]+ passed' switch.log | awk '{s += $1} END {print s + 0}')"
          if [ "$ran" -lt 1 ]; then
            echo "::error::the switch/language filter matched 0 tests"
            exit 1
          fi

  # Needs the `hacivat` binary's --smoke flag (Task 13, F17). Skips until crates/bin/hacivat/src/smoke.rs
  # exists, so this job stays green on a branch that predates the app shell.
  launch-smoke:
    name: launch-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Detect the app shell
        id: guard
        shell: bash
        env:
          SMOKE_HASH: ${{ hashFiles('crates/bin/hacivat/src/smoke.rs') }}
        run: |
          if [ -n "$SMOKE_HASH" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::crates/bin/hacivat/src/smoke.rs is absent; launch smoke skipped until Task 13 merges"
          fi
      - name: Install pinned toolchain
        if: steps.guard.outputs.present == 'true'
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - name: Linux system dependencies (GPUI)
        if: steps.guard.outputs.present == 'true' && runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - name: Select newest Xcode
        if: steps.guard.outputs.present == 'true' && runner.os == 'macOS'
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)"
          [ -n "$xcode" ] || { echo "::error::no /Applications/Xcode_*.app on this runner"; exit 1; }
          sudo xcode-select -s "$xcode"
      - name: macOS Metal Toolchain
        if: steps.guard.outputs.present == 'true' && runner.os == 'macOS'
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            if xcodebuild -help 2>&1 | grep -q -- '-downloadComponent'; then
              xcodebuild -downloadComponent MetalToolchain
            fi
          fi
          xcrun -sdk macosx metal --version
      # ## m3a-t01a-proofs
      - name: libclang (pg_query bindgen)
        if: steps.guard.outputs.present == 'true'
        uses: ./.github/actions/libclang
      - uses: Swatinem/rust-cache@v2
        if: steps.guard.outputs.present == 'true'
      - name: Build the release binary
        if: steps.guard.outputs.present == 'true'
        run: cargo build --release --locked -p hacivat
      # ## m3a-t01a-proofs
      # The shipped binary (`-p hacivat`, not the feature-unified workspace build). Task 1a's budget
      # (R-M3-1, plan Task 1a Step 5): libpg_query may add at most 10 MiB over the M2b gate's macOS
      # arm64 binary, 37,138,656 bytes; only that architecture has a recorded baseline. Over the
      # budget is a warning, not a failure: later M3a tasks grow the binary on purpose, and the
      # budget asks for a ruling, not a red build.
      - name: Shipped binary size
        if: steps.guard.outputs.present == 'true'
        run: |
          bin=target/release/hacivat
          [ -f "$bin" ] || bin=target/release/hacivat.exe
          size="$(wc -c < "$bin" | tr -d ' ')"
          echo "shipped binary $bin: $size bytes ($RUNNER_OS $(uname -m))"
          if [ "$RUNNER_OS" = macOS ] && [ "$(uname -m)" = arm64 ]; then
            budget=$((37138656 + 10 * 1024 * 1024))
            if [ "$size" -gt "$budget" ]; then
              echo "::warning::the shipped binary is $size bytes, over Task 1a's budget of $budget (M2b + 10 MiB): a size ruling is due"
            else
              echo "within Task 1a's budget: $size <= $budget bytes (M2b + 10 MiB)"
            fi
          fi
      - name: Launch smoke
        if: steps.guard.outputs.present == 'true'
        shell: bash
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a cargo run --release --locked -p hacivat -- --smoke | tee smoke.log
          else
            cargo run --release --locked -p hacivat -- --smoke | tee smoke.log
          fi
          grep -Eq '^first-frame-ms=[0-9]+' smoke.log || { echo "::error::no first-frame-ms= line"; exit 1; }
          grep -Eq '^idle-rss-mib=[0-9]+' smoke.log || { echo "::error::no idle-rss-mib= line"; exit 1; }
      # ## m3a-t01a-proofs
      - name: The shipped binary links libpg_query
        if: steps.guard.outputs.present == 'true'
        run: |
          grep -Eq '^libpg-query=pg_query 18\.1\.0 \(PostgreSQL 18\.[0-9]+\) statements=1$' smoke.log \
            || { echo "::error::no libpg-query= line with one statement"; exit 1; }

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # deny.toml [graph] targets cover macOS, Windows and Linux; --all-features covers the
      # scene-check dependencies (F28).
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
          arguments: --all-features

  # Full test set, line 5 (F10): release-only fallback and the 10 ms parse budget.
  release-tests:
    name: release-tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: ./.github/actions/linux-deps
      - uses: Swatinem/rust-cache@v2
      - name: Test (5/5) l10n, release
        run: cargo test --release --locked -p hacivat-l10n --features pseudo

  bench:
    name: bench (regression signal only)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: ./.github/actions/linux-deps

      # ## m3a-t01a-proofs
      - name: libclang (pg_query bindgen)
        uses: ./.github/actions/libclang
      - uses: Swatinem/rust-cache@v2

      # ## m3a-t20-bench: the synthetic B1 runs the real grid (`hacivat-ui-grid`'s `b1_synthetic`
      # example) in place of `spike-grid`, which stays in the tree as the frozen M0 record.
      - name: Build spikes
        run: cargo build --release --locked -p spike-editor

      - name: Generate B3 fixture
        run: cargo xtask gen-sql --lines 50000 --long-line 100000 --out target/fixtures/b3-50k.sql

      - name: Bench b1_synthetic fling (software rendering under a virtual display)
        run: xvfb-run -a cargo run --locked --release -p hacivat-ui-grid --features bench,test-support --example b1_synthetic -- --bench fling

      - name: Bench spike-editor typing
        run: xvfb-run -a cargo run --locked -p spike-editor --release -- --file target/fixtures/b3-50k.sql --bench typing

      - name: Bench spike-editor typing-long-line
        run: xvfb-run -a cargo run --locked -p spike-editor --release -- --file target/fixtures/b3-50k.sql --bench typing-long-line

      - name: Bench spike-editor completion
        run: xvfb-run -a cargo run --locked -p spike-editor --release -- --file target/fixtures/b3-50k.sql --bench completion

      # ## m3a-t36-bench: the real-app benches (`hacivat-app` examples `b3` and `b1_real`,
      # feature `bench`). Relative signal only (L2): software rendering under a virtual display
      # with no window manager, so `--allow-inactive` lets a run go on when the window never
      # becomes key (its verdict then fails by construction and exits 0). B1-real proper
      # (PostgreSQL, the PO's 120 Hz / 2x panel) is the gate's; here `--engine sqlite` builds the
      # same 1M x 50 shape under `--any-display` (the ungraded `b1-offpanel-real-*` label).
      # B3 `typing` needs the full-tier (T0) fixture: 50k lines, no long line (fix round 1, I4).
      - name: Build the real-app benches
        run: cargo build --locked --release -p hacivat-app --features bench --examples

      - name: Real-app bench harness tests (headless)
        run: cargo test --locked --release -p hacivat-app --features bench --lib bench

      - name: Generate the B3 T0 fixture
        run: cargo xtask gen-sql --lines 50000 --out target/fixtures/b3-50k-t0.sql

      - name: Bench b3 typing (real app)
        run: xvfb-run -a cargo run --locked --release -p hacivat-app --features bench --example b3 -- --file target/fixtures/b3-50k-t0.sql --bench typing --allow-inactive

      - name: Bench b1_real fling over SQLite (real app)
        run: xvfb-run -a cargo run --locked --release -p hacivat-app --features bench --example b1_real -- --engine sqlite --any-display --allow-inactive

      - name: Upload bench JSON (regression signal only, not authoritative)
        uses: actions/upload-artifact@v4
        with:
          name: bench-regression-signal-only-not-authoritative
          path: target/bench/*.json
          if-no-files-found: error

  # Unsigned installers (L13): macOS universal .dmg, Windows NSIS, Linux AppImage + .deb. Nothing
  # here signs, notarizes or minisigns; releases are signed locally from these artifacts.
  nightly-package:
    name: nightly-package (${{ matrix.os }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - name: Linux system dependencies (GPUI)
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - name: Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends libfuse2t64 file
      - name: Select newest Xcode
        if: runner.os == 'macOS'
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)"
          [ -n "$xcode" ] || { echo "::error::no /Applications/Xcode_*.app on this runner"; exit 1; }
          sudo xcode-select -s "$xcode"
      - name: macOS Metal Toolchain and universal targets
        if: runner.os == 'macOS'
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            if xcodebuild -help 2>&1 | grep -q -- '-downloadComponent'; then
              xcodebuild -downloadComponent MetalToolchain
            fi
          fi
          xcrun -sdk macosx metal --version
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      # ## m3a-t01a-proofs
      - name: libclang (pg_query bindgen)
        uses: ./.github/actions/libclang
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-packager
        shell: bash
        run: cargo install cargo-packager --locked --version '^0.11'
      - name: Nightly version
        id: version
        shell: bash
        run: echo "value=0.1.0-nightly.$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Package (macOS, unsigned universal dmg)
        if: runner.os == 'macOS'
        env:
          NIGHTLY_VERSION: ${{ steps.version.outputs.value }}
        run: packaging/package-macos.sh "$NIGHTLY_VERSION"
      # ## m3a-t01a-proofs
      - name: Universal binary size (macOS)
        if: runner.os == 'macOS'
        run: |
          for bin in target/packager/*/hacivat; do
            lipo -info "$bin"
            echo "universal binary $bin: $(wc -c < "$bin" | tr -d ' ') bytes"
          done
      - name: Package (Linux, unsigned AppImage and deb)
        if: runner.os == 'Linux'
        env:
          NIGHTLY_VERSION: ${{ steps.version.outputs.value }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: packaging/package-linux.sh "$NIGHTLY_VERSION"
      - name: Package (Windows, unsigned NSIS)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          NIGHTLY_VERSION: ${{ steps.version.outputs.value }}
        run: ./packaging/package-windows.ps1 $env:NIGHTLY_VERSION
      - name: Upload unsigned packages
        uses: actions/upload-artifact@v4
        with:
          name: hacivat-nightly-unsigned-${{ runner.os }}
          path: |
            target/packager/*/*.dmg
            target/packager/*/*-setup.exe
            target/packager/*/*.AppImage
            target/packager/*/*.deb
          if-no-files-found: error

  # Task 18's pseudo-locale screen harness. Skips until tests/shots.rs exists.
  pseudo-screens:
    name: pseudo-screens (${{ matrix.os }} ${{ matrix.part }}/${{ matrix.parts }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    # ## m3b-ci (controller): the M3b shot set (3,244 states) outgrew 60 min on hosted runners.
    timeout-minutes: 180
    # ## m3c-t45 (controller): Linux renders ~2.5 s per shot on hosted runners, so the M3c set
    # (4,860 states) needs ~3.4 h in one process, past the 180 min bound: Linux runs it in two
    # shards (`--shard k/n`, every other state), each its own process with its own thread
    # guard. macOS renders the whole set in one process (~2.1 h).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, part: 1, parts: 1 }
          - { os: ubuntu-24.04, part: 1, parts: 2 }
          - { os: ubuntu-24.04, part: 2, parts: 2 }
    steps:
      - uses: actions/checkout@v4
      - name: Detect the screen harness
        id: guard
        shell: bash
        env:
          SHOTS_HASH: ${{ hashFiles('crates/app/hacivat-app/tests/shots.rs') }}
        run: |
          if [ -n "$SHOTS_HASH" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::tests/shots.rs is absent; pseudo-screens skipped until Task 18 merges"
          fi
      - name: Install pinned toolchain
        if: steps.guard.outputs.present == 'true'
        run: rustup show active-toolchain || rustup toolchain install
      - name: Linux system dependencies (GPUI)
        if: steps.guard.outputs.present == 'true' && runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - name: Select newest Xcode and Metal Toolchain
        if: steps.guard.outputs.present == 'true' && runner.os == 'macOS'
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)"
          [ -n "$xcode" ] || { echo "::error::no /Applications/Xcode_*.app on this runner"; exit 1; }
          sudo xcode-select -s "$xcode"
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            if xcodebuild -help 2>&1 | grep -q -- '-downloadComponent'; then
              xcodebuild -downloadComponent MetalToolchain
            fi
          fi
          xcrun -sdk macosx metal --version
      # ## m3a-t01a-proofs
      - name: libclang (pg_query bindgen)
        if: steps.guard.outputs.present == 'true'
        uses: ./.github/actions/libclang
      - uses: Swatinem/rust-cache@v2
        if: steps.guard.outputs.present == 'true'
      - name: Render the pseudo-locale screens
        if: steps.guard.outputs.present == 'true'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a cargo test --locked -p hacivat-app --features scene-check,pseudo,shots --test shots -- --ignored --nocapture --shard ${{ matrix.part }}/${{ matrix.parts }}
          else
            cargo test --locked -p hacivat-app --features scene-check,pseudo,shots --test shots -- --ignored --nocapture --shard ${{ matrix.part }}/${{ matrix.parts }}
          fi
      # A failing render still uploads what it wrote, so the violations can be looked at.
      - name: Upload screens
        if: always() && steps.guard.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pseudo-screens-${{ runner.os }}-${{ matrix.part }}
          path: target/shots/**
          if-no-files-found: error
      # F17: pixel comparison (dE2000) against the committed macOS baselines. Skipped until
      # Task 19 commits design/baselines/m1/macos/*.png.
      # ## m3b-ci (controller fix): what this job gates, and what it leaves to the local gate.
      # - The render above runs every harness check (a-g, m, t, markers) on all 3,244 states on
      #   both OSes; any violation fails the job. Linux is checked like macOS: no check is
      #   skipped or loosened there (access-key runs are joined into their label, see
      #   tests/shots.rs `is_key_run`; trust labels must stay whole).
      # - This step compares pixels only where a committed baseline is still meant to hold: the
      #   36 M1 states nothing since M1 was meant to change. The 32 that M2a/M3a/M3c changed on
      #   purpose (dialog-about, menu-app, toast-info, settings-general) are listed in
      #   superseded.txt until the PO
      #   re-baselines them; a stale line fails the step. States without a committed baseline
      #   are listed as new and do not fail.
      # - The approved M2-M3b states are not committed (1.2 GB): the milestone gate compares the
      #   full render against the SDD baseline locally (docs/benchmarks/m3b.md, "pseudo-screens
      #   in CI"). Linux renders have no pixel baseline (fonts differ); they gate on the checks.
      - name: Compare with the M1 baselines (shot-diff)
        if: steps.guard.outputs.present == 'true' && runner.os == 'macOS' && hashFiles('design/baselines/m1/macos/*.png') != ''
        # ## m3b-ci (controller fix): `--superseded`.
        run: cargo run --locked -p xtask -- shot-diff --baseline design/baselines/m1/macos --candidate target/shots --superseded design/baselines/m1/macos/superseded.txt

  # ## m2a-t11-docker
  # Full test set line 5 (the FakeDriver tests) and line 7 with `--set pr` (R17). CI has no
  # controller, so this job starts the pr servers (pg17, mysql84) itself. It uses no secrets:
  # the servers run with the throwaway test credentials of docker/m2a.
  docker-pr:
    name: docker-pr
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # ## m3a-t01a-proofs
      - name: libclang (pg_query bindgen)
        uses: ./.github/actions/libclang
      - uses: Swatinem/rust-cache@v2
      - name: Test (5) driver, fake
        run: cargo test --locked -p hacivat-driver --features fake
      # ## m2b-t16-docker-matrix
      - name: Check image digest pins
        run: cargo run --locked -p xtask -- docker check-pins
      - name: Start the pr servers
        run: cargo run --locked -p xtask -- docker up --set pr
      - name: Docker tests (pr set)
        run: cargo run --locked -p xtask -- docker test --set pr
      - name: Server logs
        if: failure()
        run: docker compose -f docker/m2a/compose.yml logs --no-color
      - name: Stop the servers
        if: always()
        run: cargo run --locked -p xtask -- docker down

  # ## m2b-t16-docker-matrix
  # The whole matrix (pg13-18, auth/TLS/Turkish variants, MySQL, MariaDB, the sshd bastions) on
  # a schedule or by hand. No secrets: the servers use the throwaway credentials of docker/m2a.
  docker-full:
    name: docker-full
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # ## m3a-t01a-proofs
      - name: libclang (pg_query bindgen)
        uses: ./.github/actions/libclang
      - uses: Swatinem/rust-cache@v2
      - name: Check image digest pins
        run: cargo run --locked -p xtask -- docker check-pins
      - name: Start every server
        run: cargo run --locked -p xtask -- docker up --set full
      - name: Docker tests (full set)
        run: cargo run --locked -p xtask -- docker test --set full
      - name: Server logs
        if: failure()
        run: docker compose -f docker/m2a/compose.yml logs --no-color
      - name: Stop the servers
        if: always()
        run: cargo run --locked -p xtask -- docker down

  # ## m4-t23-minicat
  # The system-catalog snapshots (HV-INTRO-16, L7, D-017; R-M4-17, R-M4-45) regenerate byte for
  # byte from fresh servers: `minicat --check` (offline), two reads on CI's own stack (built
  # bytes must match each other and the committed assets), then the stack goes down with its
  # volumes and up again from the pinned images, and a third read must match too. The reader is
  # `hv_catalog` (docker/m2a/init/mysql.sql); no secrets (the throwaway m2a credentials), no
  # signing. Each read step continues on failure so the fresh-stack read always runs; the last
  # step fails the job if any of them failed. The regenerated sets (`minicat-1/verify`: the
  # first stack, `minicat-2/verify`: the fresh one; each read's own build `minicat-*/out-*`)
  # are always uploaded as the artifact
  # `system-catalogs`, and the log carries one `HV-FACT minicat` line per file: the first
  # complete set is reviewed and committed from there (`assets/system-catalogs/`). The offline
  # check also runs in build-test (xtask's `the_committed_snapshots_are_canonical`). Runs by
  # dispatch, on the schedule once `m4` reaches `main`, and on PRs touching the snapshots'
  # inputs (`hacivat-meta`, `hacivat-introspect`, `assets/system-catalogs`).
  minicat-verify:
    name: minicat-verify
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scope (a PR runs only when it touches the snapshots' inputs)
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE" HEAD | grep -qE '^(crates/core/hacivat-(meta|introspect)/|assets/system-catalogs/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install pinned toolchain
        if: steps.scope.outputs.run == 'true'
        run: rustup show active-toolchain || rustup toolchain install
      - name: libclang (pg_query bindgen)
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/libclang
      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.run == 'true'
      - name: Check image digest pins
        if: steps.scope.outputs.run == 'true'
        run: cargo run --locked -p xtask -- docker check-pins
      - name: Offline check of the committed snapshots
        if: steps.scope.outputs.run == 'true'
        run: cargo run --locked -p xtask -- minicat --check
      - name: Start every server
        if: steps.scope.outputs.run == 'true'
        run: cargo run --locked -p xtask -- docker up --set full
      - name: Read twice, compare the two builds and the committed snapshots
        id: first
        if: steps.scope.outputs.run == 'true'
        continue-on-error: true
        run: cargo run --locked -p xtask -- minicat --verify --twice --work "$RUNNER_TEMP/minicat-1"
      - name: Fresh servers (volumes removed)
        if: steps.scope.outputs.run == 'true'
        run: |
          cargo run --locked -p xtask -- docker down
          cargo run --locked -p xtask -- docker up --set full
      - name: Read on the fresh servers and compare again
        id: fresh
        if: steps.scope.outputs.run == 'true'
        continue-on-error: true
        run: cargo run --locked -p xtask -- minicat --verify --work "$RUNNER_TEMP/minicat-2"
      - name: The fresh stack built the same bytes as the first one
        id: stable
        if: steps.scope.outputs.run == 'true'
        continue-on-error: true
        run: |
          sha256sum "$RUNNER_TEMP"/minicat-1/verify/* || true
          diff -r "$RUNNER_TEMP/minicat-1/verify" "$RUNNER_TEMP/minicat-2/verify"
      - name: Upload the regenerated snapshots
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: system-catalogs
          # ## m4-t23-minicat (fix round 1, review m-5): the per-read builds `out-1`/`out-2`
          # too, so two reads that differ leave both sides as evidence.
          path: |
            ${{ runner.temp }}/minicat-1/verify
            ${{ runner.temp }}/minicat-2/verify
            ${{ runner.temp }}/minicat-*/out-*
          if-no-files-found: ignore
      - name: Server logs
        if: failure() || steps.first.outcome == 'failure' || steps.fresh.outcome == 'failure'
        run: docker compose -f docker/m2a/compose.yml logs --no-color
      - name: Stop the servers
        if: always() && steps.scope.outputs.run == 'true'
        run: cargo run --locked -p xtask -- docker down
      - name: Verdict
        if: steps.scope.outputs.run == 'true'
        env:
          FIRST: ${{ steps.first.outcome }}
          FRESH: ${{ steps.fresh.outcome }}
          STABLE: ${{ steps.stable.outcome }}
        run: |
          echo "first stack (twice + committed): $FIRST; fresh stack (committed): $FRESH; fresh equals first: $STABLE"
          [ "$FIRST" = success ] && [ "$FRESH" = success ] && [ "$STABLE" = success ]

  # ## m2b-t16-keyring
  # The live OS keyring round trip (B15). A broken D-Bus setup fails the
  # round trip loudly (the Linux build has the Secret Service backend only).
  keyring-linux:
    name: keyring-linux
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install the Secret Service
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11
      - name: Live keyring round trip (gnome-keyring over D-Bus)
        run: |
          dbus-run-session -- bash -c 'echo hv | gnome-keyring-daemon --unlock --components=secrets && HACIVAT_KEYRING_LIVE=1 cargo test --locked -p hacivat-secrets -- --ignored live_keyring_round_trip'

  keyring-windows:
    name: keyring-windows
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Live keyring round trip (Windows Credential Manager)
        env:
          HACIVAT_KEYRING_LIVE: "1"
        run: cargo test --locked -p hacivat-secrets -- --ignored live_keyring_round_trip

  # No D-Bus session on this runner: the Linux backend must fall back to the vault. Task 6
  # owns the test and writes it as `#[ignore = "ci-linux"]`.
  vault-linux:
    name: vault-linux
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Vault fallback without a Secret Service
        run: cargo test --locked -p hacivat-secrets --test fallback -- --include-ignored linux_without_secret_service_uses_vault

  # ## m3b-t20-fuzz
  # The SQL fuzz targets (R-M3-80; ADR 0005 `m3b-t20`): `fuzz/` is its own workspace (excluded
  # from the root, never shipped; `libfuzzer-sys`'s NCSA licence is accepted for it only), built
  # with the nightly toolchain and `--locked` against `fuzz/Cargo.lock` (generated from the root
  # lock, P-M3b-15), 10 minutes per target. The build must leave `third_party/` untouched (the
  # copied `[patch.crates-io]` entries point there). Locally the same properties run as seeded
  # tests in their crates.
  fuzz-sql:
    name: fuzz-sql (nightly, 10 min per target)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # A dated nightly, so a crash reproduces with the same compiler (fix round 1, m8).
      FUZZ_NIGHTLY: nightly-2026-11-01
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned nightly and cargo-fuzz
        run: |
          rustup toolchain install "$FUZZ_NIGHTLY" --profile minimal
          cargo +"$FUZZ_NIGHTLY" install cargo-fuzz --locked
      - name: libclang (pg_query bindgen)
        uses: ./.github/actions/libclang
      - name: Build the fuzz targets (locked)
        working-directory: fuzz
        run: |
          cargo +"$FUZZ_NIGHTLY" metadata --locked --format-version 1 > /dev/null
          cargo +"$FUZZ_NIGHTLY" fuzz build --release
      - name: The build left third_party and the lockfile untouched
        run: |
          test -z "$(git status --porcelain third_party)"
          git diff --exit-code -- fuzz/Cargo.lock
      - name: Seed corpora (the SQL corpora of sql-testkit and the review seeds)
        run: |
          for t in lex_lossless relex_equivalence split_items params_rewrite classify_no_panic; do
            mkdir -p fuzz/corpus/$t
            cp crates/sql/sql-testkit/corpus/read/*.sql crates/sql/sql-testkit/corpus/fixtures/*.sql fuzz/corpus/$t/
          done
          # One file per `sql` value of classifier_seeds.toml (the T9/T10/T14 review inputs).
          python3 - <<'EOF'
          import hashlib, pathlib, tomllib
          rows = tomllib.loads(pathlib.Path("crates/sql/sql-testkit/corpus/fuzz/classifier_seeds.toml").read_text())["row"]
          for t in ["lex_lossless", "split_items", "params_rewrite", "classify_no_panic"]:
              for r in rows:
                  b = r["sql"].encode()
                  (pathlib.Path("fuzz/corpus") / t / ("seed-" + hashlib.sha1(b).hexdigest())).write_bytes(b)
          print(len(rows), "review seeds")
          EOF
      - name: Run each target for 10 minutes (every target runs; the step fails after all)
        working-directory: fuzz
        run: |
          failed=""
          for t in lex_lossless relex_equivalence split_items params_rewrite classify_no_panic; do
            if ! cargo +"$FUZZ_NIGHTLY" fuzz run --release $t corpus/$t -- -max_total_time=600 -max_len=4096 -rss_limit_mb=4096; then
              failed="$failed $t"
            fi
          done
          if [ -n "$failed" ]; then echo "fuzz targets that found a failure:$failed"; exit 1; fi
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-sql-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # ## m4-t01a-ci
  # The M4 fuzz targets (P-M4-5, R-M4-45): untrusted cache rows and system snapshots
  # (`hacivat-meta`), scope patterns and query packs (`hacivat-introspect` without its default
  # feature `session`, so no session/network/SSH crate is compiled). Their own cargo-fuzz
  # package `fuzz/meta` (fix round 2: `fuzz-sql`'s package keeps its own graph), built like
  # `fuzz-sql`: the pinned nightly, `--locked` against `fuzz/meta/Cargo.lock`, `third_party/`
  # untouched; 10 minutes per target; dispatch and schedule only (on `m4` by
  # `workflow_dispatch`). Bodies: Tasks 11, 23, 12 and 4; until then a target only proves its
  # call path. Every cargo-fuzz command names the package with `--fuzz-dir fuzz/meta` (from the
  # repository root, cargo-fuzz otherwise picks `fuzz/`).
  fuzz-meta:
    name: fuzz-meta (nightly, 10 min per target)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FUZZ_NIGHTLY: nightly-2026-11-01
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned nightly and cargo-fuzz
        run: |
          rustup toolchain install "$FUZZ_NIGHTLY" --profile minimal
          cargo +"$FUZZ_NIGHTLY" install cargo-fuzz --locked
      - name: libclang (pg_query bindgen)
        uses: ./.github/actions/libclang
      - name: Build the fuzz targets (locked)
        run: |
          cargo +"$FUZZ_NIGHTLY" metadata --manifest-path fuzz/meta/Cargo.toml --locked --format-version 1 > /dev/null
          cargo +"$FUZZ_NIGHTLY" fuzz build --fuzz-dir fuzz/meta --release
      - name: The build left third_party and the lockfile untouched
        run: |
          test -z "$(git status --porcelain third_party)"
          git diff --exit-code -- fuzz/meta/Cargo.lock
      - name: Seed corpora (the committed snapshots and query packs, when present)
        run: |
          for t in catalog_row_decode system_snapshot_decode scope_pattern pack_parse; do
            mkdir -p fuzz/meta/corpus/$t
          done
          for f in assets/system-catalogs/*.hvsnap.zst; do
            [ -e "$f" ] && cp "$f" fuzz/meta/corpus/system_snapshot_decode/
          done
          for f in crates/core/hacivat-introspect/packs/*/*.hvq.sql; do
            [ -e "$f" ] && cp "$f" fuzz/meta/corpus/pack_parse/
          done
          true
      - name: Run each target for 10 minutes (every target runs; the step fails after all)
        run: |
          failed=""
          for t in catalog_row_decode system_snapshot_decode scope_pattern pack_parse; do
            if ! cargo +"$FUZZ_NIGHTLY" fuzz run --fuzz-dir fuzz/meta --release $t fuzz/meta/corpus/$t -- -max_total_time=600 -max_len=65536 -rss_limit_mb=4096; then
              failed="$failed $t"
            fi
          done
          if [ -n "$failed" ]; then echo "fuzz targets that found a failure:$failed"; exit 1; fi
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-meta-artifacts
          path: fuzz/meta/artifacts/
          if-no-files-found: ignore

  # ## m3b-t20-differential
  # The PostgreSQL regression differential (the P0 exit: our PG split equals libpg_query's on
  # ≥ 99.9 % of the REL_17_2 corpus's statements; the corpus is fetched at a pinned tag and
  # digest, never vendored), the classifier's mutation properties at the nightly case count, and
  # `bench-sql` (relative signal only, L2: no figure is asserted).
  sql-differential:
    name: sql-differential (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: libclang (pg_query bindgen)
        uses: ./.github/actions/libclang
      - uses: Swatinem/rust-cache@v2
      - name: Fetch the PostgreSQL regression corpus (REL_17_2, pinned digest)
        run: cargo xtask fetch-pg-regress --tag REL_17_2
      - name: PG regression differential
        run: cargo test --locked -p sql-testkit --features differential --test pg_regress_differential -- --ignored --nocapture
      - name: The one-parse oracle equals upstream's separate calls on the corpus
        run: cargo test --locked -p sql-safety --test oracle_corpus -- --ignored --nocapture
      - name: Classifier mutation properties (nightly cases)
        run: cargo test --locked --release -p sql-safety --test mutation_props
        env:
          PROPTEST_CASES: "100000"
      - name: bench-sql
        run: cargo xtask bench-sql --out target/bench/bench-sql.json
      - name: Upload bench-sql JSON (regression signal only, not authoritative)
        uses: actions/upload-artifact@v4
        with:
          name: bench-sql-regression-signal-only-not-authoritative
          path: target/bench/bench-sql.json
          if-no-files-found: error
