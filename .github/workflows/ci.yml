name: ci

# CI never signs (L13): no job reads a signing secret, and the nightly packages are unsigned
# build artifacts. Release signing happens locally on the PO's Mac (packaging/*.sh).
#
# The bench job is a regression signal for the M0 spikes, not authoritative: real numbers come
# from the reference hardware, not from shared runners.

on:
  push:
    branches: [main, m1-foundations]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# bash everywhere (Git Bash on Windows): PowerShell would split `--features a,b` at the comma.
defaults:
  run:
    shell: bash

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins 1.98.1; install it explicitly.
      - name: Install pinned toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      - name: Linux system dependencies (GPUI)
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps

      # The runner's default Xcode may predate `-downloadComponent` (exit 64,
      # "invalid option"); select the newest installed Xcode first.
      - name: Select newest Xcode
        if: runner.os == 'macOS'
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)"
          if [ -z "$xcode" ]; then
            echo "::error::no /Applications/Xcode_*.app on this runner"
            exit 1
          fi
          echo "selecting $xcode"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      # Xcode 26+ ships the Metal compiler as a separate component. Download it
      # only when this xcodebuild supports that; then insist the compiler exists,
      # so a missing toolchain fails here and not deep inside the GPUI build.
      - name: macOS Metal Toolchain
        if: runner.os == 'macOS'
        run: |
          if xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            echo "Metal compiler already present"
          elif xcodebuild -help 2>&1 | grep -q -- '-downloadComponent'; then
            xcodebuild -downloadComponent MetalToolchain
          else
            echo "xcodebuild has no -downloadComponent; relying on the bundled Metal compiler"
          fi
          if ! xcrun -sdk macosx metal --version; then
            echo "::error::Metal compiler (xcrun metal) is missing after toolchain setup"
            exit 1
          fi

      - name: Lint VF capture script (PSScriptAnalyzer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          }
          $issues = Invoke-ScriptAnalyzer -Path design/vf/capture.ps1 -Severity Warning,Error
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }

      # ## m3a-t01a-proofs
      - name: libclang (pg_query bindgen)
        uses: ./.github/actions/libclang
      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --release --locked

      # Full test set, lines 1-4 (F2). Line 5 is the nightly release-tests job.
      - name: Test (1/4) workspace
        run: cargo test --workspace --locked

      - name: Test (2/4) ui-core, test-support + scene-check
        run: cargo test --locked -p hacivat-ui-core --features test-support,scene-check

      - name: Test (3/4) l10n, pseudo
        run: cargo test --locked -p hacivat-l10n --features pseudo

      - name: Test (4/4) app, scene-check + pseudo
        run: cargo test --locked -p hacivat-app --features scene-check,pseudo

      # ## m3a-t01b-seams: full test set lines 6-8 (P10), which no job ran before.
      - name: Test (6) testkit, ssh
        run: cargo test --locked -p hacivat-testkit --features ssh

      - name: Test (7) ui-editor, scene-check
        run: cargo test --locked -p hacivat-ui-editor --features scene-check

      - name: Test (8) ui-grid, test-support + scene-check
        run: cargo test --locked -p hacivat-ui-grid --features test-support,scene-check

      # ## m3a-t01a-proofs
      # After every build of this job (clippy, release, the test builds): nothing under the
      # vendored pg_query was written or added, ignored paths included. Runners have no protoc,
      # so the static guard is what catches PATCHES.md §1 being undone.
      - name: The builds leave third_party/pg_query unchanged
        run: |
          changed="$(git status --porcelain --ignored -- third_party/pg_query)"
          if [ -n "$changed" ]; then
            printf '%s\n' "$changed"
            echo "::error::a build wrote into third_party/pg_query (PATCHES.md §1)"
            exit 1
          fi
          if grep -nE '^[^#]*prost-build' third_party/pg_query/Cargo.toml \
            || grep -nE '^[^/]*(Command::new|REGENERATE_PROTOBUF|prost_build)' third_party/pg_query/build.rs; then
            echo "::error::PATCHES.md §1 is undone: the vendored build.rs can regenerate src/protobuf.rs"
            exit 1
          fi

  tokens:
    name: tokens
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: ./.github/actions/linux-deps
      - uses: Swatinem/rust-cache@v2
      - name: Token staleness check
        run: cargo run --locked -p xtask -- tokens --check

  check-deps:
    name: check-deps
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: ./.github/actions/linux-deps
      - uses: Swatinem/rust-cache@v2
      - name: Dependency guard
        run: cargo run --locked -p xtask -- check-deps
      # ## m3a-t03-sql-tables: the generated keyword tables match data/keywords/*.toml. CI only
      # checks; `--from-docker` and `--from-pg-query` are run by hand when the data changes.
      - name: Keyword tables are fresh
        run: cargo run --locked -p xtask -- gen-sql-tables --check

  l10n-check:
    name: l10n-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: ./.github/actions/linux-deps
      - uses: Swatinem/rust-cache@v2
      - name: Catalog and literal lint
        run: cargo run --locked -p xtask -- l10n check
      - name: Repository catalogs are clean (F19)
        run: cargo test --locked -p xtask l10n -- --ignored repo_catalogs_are_clean

  # Turkish locale on the host: casing and formatting must not depend on LANG (INV-3).
  turkey-test:
    name: turkey-test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LANG: tr_TR.UTF-8
      LC_ALL: tr_TR.UTF-8
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: ./.github/actions/linux-deps
      - name: Generate the tr_TR locale
        run: |
          sudo apt-get install -y --no-install-recommends locales
          sudo locale-gen tr_TR.UTF-8
          locale -a | grep -i '^tr_TR'
      # ## m3a-t01a-proofs
      - name: libclang (pg_query bindgen)
        uses: ./.github/actions/libclang
      - uses: Swatinem/rust-cache@v2
      - name: Test (1/4) workspace
        run: cargo test --workspace --locked
      - name: Test (2/4) ui-core, test-support + scene-check
        run: cargo test --locked -p hacivat-ui-core --features test-support,scene-check
      - name: Test (3/4) l10n, pseudo
        run: cargo test --locked -p hacivat-l10n --features pseudo
      - name: Test (4/4) app, scene-check + pseudo
        run: cargo test --locked -p hacivat-app --features scene-check,pseudo
      # ## m3a-t01b-seams: full test set lines 6-8 (P10).
      - name: Test (6) testkit, ssh
        run: cargo test --locked -p hacivat-testkit --features ssh
      - name: Test (7) ui-editor, scene-check
        run: cargo test --locked -p hacivat-ui-editor --features scene-check
      - name: Test (8) ui-grid, test-support + scene-check
        run: cargo test --locked -p hacivat-ui-grid --features test-support,scene-check

  # Spec 7.1 / F29: runtime language switching (tests of Tasks 13, 16 and 17).
  switch:
    name: switch (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Linux system dependencies (GPUI)
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - name: Select newest Xcode
        if: runner.os == 'macOS'
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)"
          [ -n "$xcode" ] || { echo "::error::no /Applications/Xcode_*.app on this runner"; exit 1; }
          sudo xcode-select -s "$xcode"
      - name: macOS Metal Toolchain
        if: runner.os == 'macOS'
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            if xcodebuild -help 2>&1 | grep -q -- '-downloadComponent'; then
              xcodebuild -downloadComponent MetalToolchain
            fi
          fi
          xcrun -sdk macosx metal --version
      # ## m3a-t01a-proofs
      - name: libclang (pg_query bindgen)
        uses: ./.github/actions/libclang
      - uses: Swatinem/rust-cache@v2
      - name: Detect the shell tests
        id: guard
        env:
          SHELL_TESTS_HASH: ${{ hashFiles('crates/app/hacivat-app/tests/shell.rs') }}
        run: |
          if [ -n "$SHELL_TESTS_HASH" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::tests/shell.rs is absent; switch tests skipped until Task 13 merges"
          fi
      # Once the tests exist, a filter that matches nothing must fail rather than pass vacuously.
      - name: Language switching tests
        if: steps.guard.outputs.present == 'true'
        run: |
          set -o pipefail
          cargo test --locked -p hacivat-app --features scene-check,pseudo -- switch language | tee switch.log
          ran="$(grep -Eo '[0-9]+ passed' switch.log | awk '{s += $1} END {print s + 0}')"
          if [ "$ran" -lt 1 ]; then
            echo "::error::the switch/language filter matched 0 tests"
            exit 1
          fi

  # Needs the `hacivat` binary's --smoke flag (Task 13, F17). Skips until crates/bin/hacivat/src/smoke.rs
  # exists, so this job stays green on a branch that predates the app shell.
  launch-smoke:
    name: launch-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Detect the app shell
        id: guard
        shell: bash
        env:
          SMOKE_HASH: ${{ hashFiles('crates/bin/hacivat/src/smoke.rs') }}
        run: |
          if [ -n "$SMOKE_HASH" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::crates/bin/hacivat/src/smoke.rs is absent; launch smoke skipped until Task 13 merges"
          fi
      - name: Install pinned toolchain
        if: steps.guard.outputs.present == 'true'
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - name: Linux system dependencies (GPUI)
        if: steps.guard.outputs.present == 'true' && runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - name: Select newest Xcode
        if: steps.guard.outputs.present == 'true' && runner.os == 'macOS'
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)"
          [ -n "$xcode" ] || { echo "::error::no /Applications/Xcode_*.app on this runner"; exit 1; }
          sudo xcode-select -s "$xcode"
      - name: macOS Metal Toolchain
        if: steps.guard.outputs.present == 'true' && runner.os == 'macOS'
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            if xcodebuild -help 2>&1 | grep -q -- '-downloadComponent'; then
              xcodebuild -downloadComponent MetalToolchain
            fi
          fi
          xcrun -sdk macosx metal --version
      # ## m3a-t01a-proofs
      - name: libclang (pg_query bindgen)
        if: steps.guard.outputs.present == 'true'
        uses: ./.github/actions/libclang
      - uses: Swatinem/rust-cache@v2
        if: steps.guard.outputs.present == 'true'
      - name: Build the release binary
        if: steps.guard.outputs.present == 'true'
        run: cargo build --release --locked -p hacivat
      # ## m3a-t01a-proofs
      # The shipped binary (`-p hacivat`, not the feature-unified workspace build). Task 1a's budget
      # (R-M3-1, plan Task 1a Step 5): libpg_query may add at most 10 MiB over the M2b gate's macOS
      # arm64 binary, 37,138,656 bytes; only that architecture has a recorded baseline. Over the
      # budget is a warning, not a failure: later M3a tasks grow the binary on purpose, and the
      # budget asks for a ruling, not a red build.
      - name: Shipped binary size
        if: steps.guard.outputs.present == 'true'
        run: |
          bin=target/release/hacivat
          [ -f "$bin" ] || bin=target/release/hacivat.exe
          size="$(wc -c < "$bin" | tr -d ' ')"
          echo "shipped binary $bin: $size bytes ($RUNNER_OS $(uname -m))"
          if [ "$RUNNER_OS" = macOS ] && [ "$(uname -m)" = arm64 ]; then
            budget=$((37138656 + 10 * 1024 * 1024))
            if [ "$size" -gt "$budget" ]; then
              echo "::warning::the shipped binary is $size bytes, over Task 1a's budget of $budget (M2b + 10 MiB): a size ruling is due"
            else
              echo "within Task 1a's budget: $size <= $budget bytes (M2b + 10 MiB)"
            fi
          fi
      - name: Launch smoke
        if: steps.guard.outputs.present == 'true'
        shell: bash
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a cargo run --release --locked -p hacivat -- --smoke | tee smoke.log
          else
            cargo run --release --locked -p hacivat -- --smoke | tee smoke.log
          fi
          grep -Eq '^first-frame-ms=[0-9]+' smoke.log || { echo "::error::no first-frame-ms= line"; exit 1; }
          grep -Eq '^idle-rss-mib=[0-9]+' smoke.log || { echo "::error::no idle-rss-mib= line"; exit 1; }
      # ## m3a-t01a-proofs
      - name: The shipped binary links libpg_query
        if: steps.guard.outputs.present == 'true'
        run: |
          grep -Eq '^libpg-query=pg_query 18\.1\.0 \(PostgreSQL 18\.[0-9]+\) statements=1$' smoke.log \
            || { echo "::error::no libpg-query= line with one statement"; exit 1; }

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # deny.toml [graph] targets cover macOS, Windows and Linux; --all-features covers the
      # scene-check dependencies (F28).
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
          arguments: --all-features

  # Full test set, line 5 (F10): release-only fallback and the 10 ms parse budget.
  release-tests:
    name: release-tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: ./.github/actions/linux-deps
      - uses: Swatinem/rust-cache@v2
      - name: Test (5/5) l10n, release
        run: cargo test --release --locked -p hacivat-l10n --features pseudo

  bench:
    name: bench (regression signal only)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: ./.github/actions/linux-deps

      # ## m3a-t01a-proofs
      - name: libclang (pg_query bindgen)
        uses: ./.github/actions/libclang
      - uses: Swatinem/rust-cache@v2

      - name: Build spikes
        run: cargo build --release --locked -p spike-grid -p spike-editor

      - name: Generate B3 fixture
        run: cargo xtask gen-sql --lines 50000 --long-line 100000 --out target/fixtures/b3-50k.sql

      - name: Bench spike-grid fling (software rendering under a virtual display)
        run: xvfb-run -a cargo run --locked -p spike-grid --release -- --bench fling

      - name: Bench spike-editor typing
        run: xvfb-run -a cargo run --locked -p spike-editor --release -- --file target/fixtures/b3-50k.sql --bench typing

      - name: Bench spike-editor typing-long-line
        run: xvfb-run -a cargo run --locked -p spike-editor --release -- --file target/fixtures/b3-50k.sql --bench typing-long-line

      - name: Bench spike-editor completion
        run: xvfb-run -a cargo run --locked -p spike-editor --release -- --file target/fixtures/b3-50k.sql --bench completion

      - name: Upload bench JSON (regression signal only, not authoritative)
        uses: actions/upload-artifact@v4
        with:
          name: bench-regression-signal-only-not-authoritative
          path: target/bench/*.json
          if-no-files-found: error

  # Unsigned installers (L13): macOS universal .dmg, Windows NSIS, Linux AppImage + .deb. Nothing
  # here signs, notarizes or minisigns; releases are signed locally from these artifacts.
  nightly-package:
    name: nightly-package (${{ matrix.os }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - name: Linux system dependencies (GPUI)
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - name: Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends libfuse2t64 file
      - name: Select newest Xcode
        if: runner.os == 'macOS'
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)"
          [ -n "$xcode" ] || { echo "::error::no /Applications/Xcode_*.app on this runner"; exit 1; }
          sudo xcode-select -s "$xcode"
      - name: macOS Metal Toolchain and universal targets
        if: runner.os == 'macOS'
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            if xcodebuild -help 2>&1 | grep -q -- '-downloadComponent'; then
              xcodebuild -downloadComponent MetalToolchain
            fi
          fi
          xcrun -sdk macosx metal --version
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      # ## m3a-t01a-proofs
      - name: libclang (pg_query bindgen)
        uses: ./.github/actions/libclang
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-packager
        shell: bash
        run: cargo install cargo-packager --locked --version '^0.11'
      - name: Nightly version
        id: version
        shell: bash
        run: echo "value=0.1.0-nightly.$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Package (macOS, unsigned universal dmg)
        if: runner.os == 'macOS'
        env:
          NIGHTLY_VERSION: ${{ steps.version.outputs.value }}
        run: packaging/package-macos.sh "$NIGHTLY_VERSION"
      # ## m3a-t01a-proofs
      - name: Universal binary size (macOS)
        if: runner.os == 'macOS'
        run: |
          for bin in target/packager/*/hacivat; do
            lipo -info "$bin"
            echo "universal binary $bin: $(wc -c < "$bin" | tr -d ' ') bytes"
          done
      - name: Package (Linux, unsigned AppImage and deb)
        if: runner.os == 'Linux'
        env:
          NIGHTLY_VERSION: ${{ steps.version.outputs.value }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: packaging/package-linux.sh "$NIGHTLY_VERSION"
      - name: Package (Windows, unsigned NSIS)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          NIGHTLY_VERSION: ${{ steps.version.outputs.value }}
        run: ./packaging/package-windows.ps1 $env:NIGHTLY_VERSION
      - name: Upload unsigned packages
        uses: actions/upload-artifact@v4
        with:
          name: hacivat-nightly-unsigned-${{ runner.os }}
          path: |
            target/packager/*/*.dmg
            target/packager/*/*-setup.exe
            target/packager/*/*.AppImage
            target/packager/*/*.deb
          if-no-files-found: error

  # Task 18's pseudo-locale screen harness. Skips until tests/shots.rs exists.
  pseudo-screens:
    name: pseudo-screens (${{ matrix.os }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Detect the screen harness
        id: guard
        shell: bash
        env:
          SHOTS_HASH: ${{ hashFiles('crates/app/hacivat-app/tests/shots.rs') }}
        run: |
          if [ -n "$SHOTS_HASH" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::tests/shots.rs is absent; pseudo-screens skipped until Task 18 merges"
          fi
      - name: Install pinned toolchain
        if: steps.guard.outputs.present == 'true'
        run: rustup show active-toolchain || rustup toolchain install
      - name: Linux system dependencies (GPUI)
        if: steps.guard.outputs.present == 'true' && runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - name: Select newest Xcode and Metal Toolchain
        if: steps.guard.outputs.present == 'true' && runner.os == 'macOS'
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)"
          [ -n "$xcode" ] || { echo "::error::no /Applications/Xcode_*.app on this runner"; exit 1; }
          sudo xcode-select -s "$xcode"
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            if xcodebuild -help 2>&1 | grep -q -- '-downloadComponent'; then
              xcodebuild -downloadComponent MetalToolchain
            fi
          fi
          xcrun -sdk macosx metal --version
      # ## m3a-t01a-proofs
      - name: libclang (pg_query bindgen)
        if: steps.guard.outputs.present == 'true'
        uses: ./.github/actions/libclang
      - uses: Swatinem/rust-cache@v2
        if: steps.guard.outputs.present == 'true'
      - name: Render the pseudo-locale screens
        if: steps.guard.outputs.present == 'true'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a cargo test --locked -p hacivat-app --features scene-check,pseudo,shots --test shots -- --ignored --nocapture
          else
            cargo test --locked -p hacivat-app --features scene-check,pseudo,shots --test shots -- --ignored --nocapture
          fi
      # A failing render still uploads what it wrote, so the violations can be looked at.
      - name: Upload screens
        if: always() && steps.guard.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pseudo-screens-${{ runner.os }}
          path: target/shots/**
          if-no-files-found: error
      # F17: pixel comparison (dE2000) against the committed macOS baselines. Skipped until
      # Task 19 commits design/baselines/m1/macos/*.png.
      - name: Compare with the M1 baselines (shot-diff)
        if: steps.guard.outputs.present == 'true' && runner.os == 'macOS' && hashFiles('design/baselines/m1/macos/*.png') != ''
        run: cargo run --locked -p xtask -- shot-diff --baseline design/baselines/m1/macos --candidate target/shots

  # ## m2a-t11-docker
  # Full test set line 5 (the FakeDriver tests) and line 7 with `--set pr` (R17). CI has no
  # controller, so this job starts the pr servers (pg17, mysql84) itself. It uses no secrets:
  # the servers run with the throwaway test credentials of docker/m2a.
  docker-pr:
    name: docker-pr
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # ## m3a-t01a-proofs
      - name: libclang (pg_query bindgen)
        uses: ./.github/actions/libclang
      - uses: Swatinem/rust-cache@v2
      - name: Test (5) driver, fake
        run: cargo test --locked -p hacivat-driver --features fake
      # ## m2b-t16-docker-matrix
      - name: Check image digest pins
        run: cargo run --locked -p xtask -- docker check-pins
      - name: Start the pr servers
        run: cargo run --locked -p xtask -- docker up --set pr
      - name: Docker tests (pr set)
        run: cargo run --locked -p xtask -- docker test --set pr
      - name: Server logs
        if: failure()
        run: docker compose -f docker/m2a/compose.yml logs --no-color
      - name: Stop the servers
        if: always()
        run: cargo run --locked -p xtask -- docker down

  # ## m2b-t16-docker-matrix
  # The whole matrix (pg13-18, auth/TLS/Turkish variants, MySQL, MariaDB, the sshd bastions) on
  # a schedule or by hand. No secrets: the servers use the throwaway credentials of docker/m2a.
  docker-full:
    name: docker-full
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # ## m3a-t01a-proofs
      - name: libclang (pg_query bindgen)
        uses: ./.github/actions/libclang
      - uses: Swatinem/rust-cache@v2
      - name: Check image digest pins
        run: cargo run --locked -p xtask -- docker check-pins
      - name: Start every server
        run: cargo run --locked -p xtask -- docker up --set full
      - name: Docker tests (full set)
        run: cargo run --locked -p xtask -- docker test --set full
      - name: Server logs
        if: failure()
        run: docker compose -f docker/m2a/compose.yml logs --no-color
      - name: Stop the servers
        if: always()
        run: cargo run --locked -p xtask -- docker down

  # ## m2b-t16-keyring
  # The live OS keyring round trip (B15). A broken D-Bus setup fails the
  # round trip loudly (the Linux build has the Secret Service backend only).
  keyring-linux:
    name: keyring-linux
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install the Secret Service
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11
      - name: Live keyring round trip (gnome-keyring over D-Bus)
        run: |
          dbus-run-session -- bash -c 'echo hv | gnome-keyring-daemon --unlock --components=secrets && HACIVAT_KEYRING_LIVE=1 cargo test --locked -p hacivat-secrets -- --ignored live_keyring_round_trip'

  keyring-windows:
    name: keyring-windows
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Live keyring round trip (Windows Credential Manager)
        env:
          HACIVAT_KEYRING_LIVE: "1"
        run: cargo test --locked -p hacivat-secrets -- --ignored live_keyring_round_trip

  # No D-Bus session on this runner: the Linux backend must fall back to the vault. Task 6
  # owns the test and writes it as `#[ignore = "ci-linux"]`.
  vault-linux:
    name: vault-linux
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Vault fallback without a Secret Service
        run: cargo test --locked -p hacivat-secrets --test fallback -- --include-ignored linux_without_secret_service_uses_vault
