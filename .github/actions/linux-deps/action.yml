name: linux-deps
description: >
  System packages GPUI needs to build and run (software Vulkan, xvfb) on Ubuntu runners, and
  libclang for the vendored pg_query's bindgen (M3a Task 1a, R-M3-1).

runs:
  using: composite
  steps:
    - name: Linux system dependencies (GPUI)
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          gcc g++ clang lld cmake make pkg-config \
          libasound2-dev libfontconfig-dev libssl-dev libzstd-dev \
          libwayland-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev \
          libvulkan-dev mesa-vulkan-drivers libxcb1-dev xvfb \
          libclang-dev
