# Shipped virtual foreign keys of the system catalogs (R-M4-12), e.g.
# `pg_class.relnamespace -> pg_namespace.oid`. Hand-authored from vendor documentation and
# reviewed row by row; never copied from another tool. Rows: M4 Task 26.
#
# Every row is one reference the vendor documentation states for a column: PostgreSQL's
# "System Catalogs" chapter lists, per catalog, the column it references
# ("relnamespace oid (references pg_namespace.oid)"); `source` names the page and the column
# the row is taken from (version-independent page names, `/docs/current/`). No row is
# inferred from column names. Each row must resolve against every shipped PostgreSQL snapshot
# (14-18; `shipped_virtual_fks_resolve_against_every_pg_snapshot`).
#
# Format (read by `hacivat_meta::system`, a strict subset of TOML): one `[[fk]]` per key, with
# `dbms`, `from` and `to` as `schema.relation`, `from_columns`/`to_columns` in key order,
# `source`; optional `name`. Not part of the generated manifest (`xtask minicat` leaves it be).

